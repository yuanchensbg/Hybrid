<title>Hybrid · Yuan &amp; Yara</title>
<style>
:root{
  --bg:#0E1116; --surf:#161B23; --surf2:#1E2531; --surf3:#28313F;
  --line:#262F3C; --line2:#323D4C;
  --ink:#E9EDF3; --mid:#8694A8; --dim:#56637A;
  --yuan:#F2653C; --yara:#6FA8FF; --both:#E8C547;
  --ok:#3FBF8F; --warn:#F0A830; --red:#E85D5D;
  --me:var(--yuan); --me-soft:rgba(242,101,60,.14);
  --pad-top:8px; --pad-bottom:6px; --extend:0px; --vv:0px;
}
body[data-me="yara"]{--me:var(--yara);--me-soft:rgba(111,168,255,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg);height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  position:fixed;top:0;right:0;left:0;bottom:calc(-1 * var(--extend));
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
}
.cond{font-weight:800;letter-spacing:-.025em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
input,textarea,select,button{font-family:inherit}

/* ─── LADEBILDSCHIRM ─── */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .45s ease,transform .5s cubic-bezier(.65,0,.35,1)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-mark svg{width:132px;height:66px;overflow:visible}
.sp-c{fill:none;stroke-width:3.5;stroke-dasharray:107;stroke-dashoffset:107}
.sp-c1{stroke:var(--yuan)}
.sp-c2{stroke:var(--yara)}
.sp-bar{stroke:var(--both);stroke-width:3.5;stroke-linecap:round;
  stroke-dasharray:44;stroke-dashoffset:44;opacity:0}
.sp-name{font-size:33px;font-weight:800;letter-spacing:-.03em;margin-top:22px;
  opacity:0;transform:translateY(10px)}
.sp-sub{font-size:13.5px;color:var(--mid);margin-top:6px;letter-spacing:.02em;
  opacity:0;transform:translateY(8px)}
.sp-line{width:62px;height:2px;background:var(--line);border-radius:2px;margin-top:38px;overflow:hidden;opacity:0}
.sp-line i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--yuan),var(--both),var(--yara))}
#splash.go .sp-c1{animation:draw .62s cubic-bezier(.4,0,.2,1) forwards}
#splash.go .sp-c2{animation:draw .62s cubic-bezier(.4,0,.2,1) .16s forwards}
#splash.go .sp-bar{animation:link .42s ease .72s forwards}
#splash.go .sp-name{animation:rise .5s ease .86s forwards}
#splash.go .sp-sub{animation:rise .45s ease 1s forwards}
#splash.go .sp-line{animation:fade .3s ease 1.12s forwards}
#splash.go .sp-line i{animation:fill 1.05s ease .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes link{from{stroke-dashoffset:44;opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none !important;opacity:1 !important;transform:none !important;
    stroke-dashoffset:0 !important}
  #splash .sp-line i{width:100%}
}

/* ─── HEADER ─── */
header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:max(0px,calc(max(env(safe-area-inset-top),48px) + var(--pad-top)));
  margin-top:min(0px,calc(max(env(safe-area-inset-top),48px) + var(--pad-top)))}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px 12px}
.brand{flex:1;min-width:0}
.brand .bn{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand .bs{font-size:11px;color:var(--mid);margin-top:4px;letter-spacing:.02em}
.whoswitch{flex:0 0 auto;display:flex;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:3px}
.whoswitch button{padding:7px 13px;border:none;border-radius:8px;background:transparent;color:var(--dim);
  font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.whoswitch button.on[data-w="yuan"]{background:var(--yuan);color:#140A06}
.whoswitch button.on[data-w="yara"]{background:var(--yara);color:#06101F}

/* ─── CYCLE RAIL ─── */
.rmon{flex:0 0 auto;align-self:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);padding:0 6px;writing-mode:vertical-rl}
.rtile.past{opacity:.55}
.rtile.past.filled{opacity:1}
.rtile.filled::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:16px;height:2px;border-radius:1px;background:var(--ok)}
.jump{display:flex;align-items:center;gap:7px;padding:0 15px 9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.jump.off{padding-bottom:9px}
.jump button{flex:0 0 auto;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf);color:var(--mid);font-size:12px;cursor:pointer}
.jump button#jtoday{color:var(--me);border-color:var(--me)}
.jump .jdate{flex:1 1 auto;position:relative;font-size:12px;color:var(--dim);text-align:right;
  white-space:nowrap;cursor:pointer}
.jump .jdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.rail{display:flex;gap:4px;overflow-x:auto;padding:0 12px 11px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rtile{position:relative;flex:0 0 auto;width:58px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  padding:7px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.rtile .rd{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.rtile .rn{font-size:17px;font-weight:700;line-height:1}
.rtile .rk{font-size:9px;color:var(--mid);line-height:1.1;text-align:center}
.rtile.today{border-color:var(--me);background:var(--me-soft)}
.rtile.today .rn{color:var(--me)}
.rtile.sel{border-color:var(--ink)}
.rtile.rest{opacity:.5}
.rtile .cyc{position:absolute;top:-1px;right:-1px;font-size:8px;color:var(--dim);
  background:var(--surf2);border-radius:0 10px 0 7px;padding:2px 4px 2px 5px}
.rtile.dual::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:16px;height:2px;border-radius:2px;background:var(--both)}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:16px 16px 36px;width:100%;max-width:620px;margin:0 auto}
.page{display:none}.page.on{display:block}

/* ─── SESSION HERO ─── */
.hero{margin-bottom:18px}
.hero .ht{display:flex;align-items:flex-end;gap:10px;margin-bottom:6px}
.hero h1{font-size:29px;font-weight:800;line-height:1.08;letter-spacing:-.025em;flex:1}
.tagpill{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;margin-bottom:4px}
.t-kraft{background:rgba(242,101,60,.16);color:var(--yuan)}
.t-lauf{background:rgba(111,168,255,.16);color:var(--yara)}
.t-hybrid{background:rgba(232,197,71,.16);color:var(--both)}
.t-rest{background:var(--surf2);color:var(--dim)}
.hero .hm{font-size:13px;color:var(--mid);line-height:1.55}
.hero .hm b{color:var(--ink);font-weight:500}

/* together banner */
.together{display:flex;align-items:center;gap:10px;background:var(--surf);
  border:1px solid var(--line);border-left:2px solid var(--both);
  border-radius:0 12px 12px 0;padding:11px 13px;margin:14px 0 16px}
.together .tw{flex:1;font-size:12.5px;color:var(--mid);line-height:1.5}
.together .tw b{color:var(--ink);font-weight:500}
.avat{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;flex-shrink:0}
.a-yuan{background:rgba(242,101,60,.2);color:var(--yuan)}
.a-yara{background:rgba(111,168,255,.2);color:var(--yara)}

.why{border-left:2px solid var(--me);background:var(--surf);padding:12px 14px;margin:0 0 18px;
  border-radius:0 11px 11px 0;font-size:13px;line-height:1.65;color:var(--mid)}
.why b{color:var(--ink);font-weight:500}

.sec{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.05em;margin:22px 0 9px 2px;text-transform:uppercase}
.sec .sx{color:var(--both);text-transform:none;letter-spacing:0;font-weight:500}

/* ─── GYM BAR ─── */
.gymbar{display:flex;gap:6px;margin-bottom:14px}
.gymbar button{flex:1;padding:10px 6px;background:var(--surf);border:1px solid var(--line);border-radius:11px;
  color:var(--mid);font-size:12px;cursor:pointer;line-height:1.3}
.gymbar button.on{border-color:var(--me);background:var(--me-soft);color:var(--ink)}
.gymbar button .gl{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}

/* ─── EXERCISE ─── */
.ex{background:var(--surf);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.ex.done{opacity:.48}
.ex.lead{border-color:var(--line2)}
.exh{display:flex;align-items:center;gap:10px;padding:12px 13px}
.tick{flex:0 0 auto;width:25px;height:25px;border:1.5px solid var(--line2);border-radius:7px;
  background:transparent;display:grid;place-items:center;cursor:pointer}
.tick svg{width:12px;height:12px;opacity:0;stroke:#0E1116;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ex.done .tick{background:var(--ok);border-color:var(--ok)}
.ex.done .tick svg{opacity:1}
.exn{flex:1;min-width:0}
.exn .nm{font-size:15px;font-weight:530;line-height:1.25}
.ex.done .nm{text-decoration:line-through;text-decoration-color:var(--dim)}
.exn .sb{font-size:11.5px;color:var(--mid);margin-top:2px;line-height:1.35}
.exn .sb.swap{color:var(--warn)}
.badge-lead{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--both);
  background:rgba(232,197,71,.13);padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:1px}
.ib{flex:0 0 auto;width:27px;height:27px;background:none;border:none;color:var(--dim);
  font-size:15px;cursor:pointer;border-radius:7px;display:grid;place-items:center}
.ib.on{color:var(--me);background:var(--me-soft)}
.figs{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.fig{flex:1;background:var(--surf);padding:9px 12px}
.fig.tap{cursor:pointer}
.fig .k{font-size:9px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.fig .v{font-size:17px;font-weight:650}
.fig.tap .v{color:var(--me)}
.notetog{display:flex;align-items:center;gap:8px;width:100%;padding:9px 13px;background:var(--surf);
  border:none;border-top:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer;text-align:left}
.notetog.has{color:var(--me)}
.notewrap{display:none;border-top:1px solid var(--line);padding:10px 13px 12px;background:var(--surf)}
.notewrap.on{display:block}
.notewrap textarea{width:100%;min-height:62px;background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;color:var(--ink);font:inherit;font-size:15px;line-height:1.55;
  resize:none;-webkit-appearance:none}
.notewrap textarea:focus{outline:none;border-color:var(--me)}
.noterow{display:flex;gap:7px;margin-top:8px}
.noterow button{flex:1;padding:9px 6px;background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;color:var(--mid);font-size:12.5px;cursor:pointer}
.noterow button.mic{color:var(--me);border-color:var(--line2)}
.noterow button.rec{background:rgba(232,93,93,.16);border-color:var(--red);color:var(--red)}
.notehint{font-size:11px;color:var(--dim);line-height:1.5;margin-top:7px}
.hintl{font-size:11.5px;color:var(--me);padding:7px 13px;border-top:1px solid var(--line);background:var(--me-soft);line-height:1.5}
.lastl{font-size:11.5px;color:var(--mid);padding:7px 13px;border-top:1px solid var(--line);line-height:1.5}
.lastl .lw{color:var(--dim)}
.fillbtn{display:block;width:calc(100% - 26px);margin:0 13px 9px;padding:8px;background:var(--surf2);
  border:1px solid var(--line);border-radius:8px;color:var(--me);font-size:12px;cursor:pointer}
.fillbtn:active{background:var(--surf3)}
.warnl{font-size:11.5px;color:var(--warn);padding:8px 13px;border-top:1px solid var(--line);background:rgba(240,168,48,.07);line-height:1.5}
.trk{border-top:1px solid var(--line);background:var(--surf)}
.erow{display:flex;align-items:center;gap:7px;padding:8px 13px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:none}
.elbl{font-size:10.5px;color:var(--dim);width:48px;flex-shrink:0}
.inp{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;color:var(--ink);font-size:16px;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--me)}
.inp::placeholder{color:var(--dim)}
.u{flex:0 0 auto;font-size:10px;color:var(--dim);width:24px}
.sn{flex:0 0 auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--mid);font-size:13px;font-weight:700;cursor:pointer}
.sn.ok{background:var(--ok);border-color:var(--ok);color:#0E1116}
.skp{flex:0 0 auto;width:29px;height:29px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:14px;cursor:pointer}
.erow.skipped{opacity:.4}
.erow.skipped .inp{text-decoration:line-through;pointer-events:none}
.erow.skipped .skp{background:rgba(240,168,48,.15);border-color:var(--warn);color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.opt{flex:1;min-width:56px;padding:7px 5px;background:var(--surf2);border:1px solid var(--line);
  border-radius:8px;color:var(--mid);font-size:11.5px;cursor:pointer;text-align:center}
.opt.sel{background:var(--me-soft);border-color:var(--me);color:var(--ink)}
.opt.miss{opacity:.35}
.how{display:none;padding:12px 13px;font-size:13px;line-height:1.68;color:var(--mid);border-top:1px solid var(--line)}
.how.on{display:block}
.how b{color:var(--ink);font-weight:500}
.mobfig{display:flex;gap:12px;align-items:center;background:var(--surf2);border-radius:11px;
  padding:9px 11px;margin:8px 0}
.mobfig svg{width:92px;height:77px;flex-shrink:0}
.mobfig .ml{stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mobfig .mh{stroke:var(--ink);stroke-width:3;fill:none}
.mobfig .mg{stroke:var(--line2);stroke-width:2.4;stroke-linecap:round}
.mobfig .mb{stroke:var(--me);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-dasharray:5 4}
.mobtxt{font-size:12.5px;line-height:1.55;color:var(--mid)}
.mobtxt b{color:var(--ink);font-weight:550}

/* ─── PARTNER ─── */
.pcard{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px}
.pch{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.pch .pn{flex:1;font-size:14px;font-weight:600}
.plist{font-size:12.5px;color:var(--mid);line-height:1.75}
.plist .pm{color:var(--ink)}

/* ─── BUTTONS / CARDS ─── */
.btn{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px;
  font-size:14px;font-weight:500;color:var(--mid);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;margin-bottom:8px}
.btn:active{background:var(--surf2)}
.btn-go{background:var(--me);color:#0E1116;border-color:var(--me);font-weight:650}
.btn-w{color:var(--warn);border-color:rgba(240,168,48,.3)}
.btn-r{color:var(--red);border-color:rgba(232,93,93,.3)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:9px}
.card h4{font-size:13.5px;font-weight:600;margin-bottom:10px}
.lbl{font-size:10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.big{font-size:31px;font-weight:700;line-height:1;letter-spacing:-.01em}
.big small{font-size:14px;color:var(--mid);font-weight:400;letter-spacing:0}
.r2{display:flex;gap:9px}.r2>*{flex:1}
.r3{display:flex;gap:9px}.r3>*{flex:1}
.ta{width:100%;min-height:76px;background:var(--surf);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;color:var(--ink);font-size:16px;line-height:1.6;resize:none;-webkit-appearance:none}
.ta:focus{outline:none;border-color:var(--me)}
.ntog{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  color:var(--mid);font-size:13px;cursor:pointer;text-align:left;margin-top:8px}
.ntog.has{color:var(--ink);border-color:var(--line2)}
.nta{display:none;margin-top:6px;border-color:var(--me)}
.nta.open{display:block}
.empty{color:var(--dim);font-size:13px;padding:22px 0;text-align:center;line-height:1.65}
.mi{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;padding:14px 13px;cursor:pointer;text-align:left;color:var(--ink);font-size:14.5px;width:100%;margin-bottom:8px}
.mi .mg{width:22px;text-align:center;flex-shrink:0;font-size:15px}
.mi .md{flex:1}
.mi .ms{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.mi .ma{color:var(--dim)}
.back{background:none;border:none;color:var(--me);font-size:14px;cursor:pointer;padding:0;margin-bottom:14px}
.seg{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px 4px;border:none;border-radius:8px;background:transparent;color:var(--mid);
  font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surf3);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 12px;background:var(--surf);border:1px solid var(--line);border-radius:18px;
  color:var(--mid);font-size:12.5px;cursor:pointer}
.chip.sel{border-color:var(--me);color:var(--me)}

/* ─── TABBAR ─── */
#bot{flex:0 0 auto;position:relative;z-index:40;
  margin-bottom:calc(var(--vv) + min(0px,calc(max(0px,env(safe-area-inset-bottom) - 14px) + var(--pad-bottom))))}
#tabs{background:var(--bg);border-top:1px solid var(--line);display:flex;
  padding-top:9px;padding-left:5px;padding-right:5px;
  padding-bottom:max(0px,calc(max(0px,env(safe-area-inset-bottom) - 14px) + var(--pad-bottom)))}
#tabs button{flex:1;background:none;border:none;color:var(--dim);font-size:9.5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px}
#tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--me)}

/* ─── TIMER ─── */
.tmr{position:absolute;left:0;right:0;bottom:100%;background:var(--bg);border-top:1px solid var(--line);
  padding:11px 16px;display:flex;align-items:center;gap:13px;transform:translateY(110%);opacity:0;
  pointer-events:none;transition:transform .2s,opacity .16s}
.tmr.up{transform:translateY(0);opacity:1;pointer-events:auto}
.tmr .tl{font-size:10.5px;color:var(--dim);margin-bottom:2px}
.tmr .tv{font-size:36px;font-weight:700;line-height:1}
.tmr.done .tv{color:var(--ok)}
.tmr .sp{flex:1}
.tmr button{border:1px solid var(--line);background:var(--surf2);color:var(--ink);font-size:14px;
  padding:10px 14px;border-radius:10px;cursor:pointer}
.tmr .tx{background:transparent;color:var(--mid);border-color:transparent}
/* Schwebender Player: frei verschiebbar, auf jeder Seite sichtbar */
/* Schwebender Hinweis auf eine angefangene Einheit */
#woresume{position:fixed;left:14px;z-index:185;display:none;align-items:center;gap:10px;
  padding:10px 14px 10px 12px;background:var(--surf2);border:1px solid var(--me);
  border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;max-width:70vw}
#woresume.on{display:flex}
#woresume .wrsym{width:26px;height:26px;border-radius:50%;background:var(--me);color:#0E1116;
  display:grid;place-items:center;font-size:14px;flex-shrink:0}
#woresume .wrtxt{font-size:12.5px;line-height:1.35;min-width:0}
#woresume .wrtxt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#woresume .wrtxt span{color:var(--mid)}
#player{position:fixed;z-index:190;display:none;touch-action:none;
  background:var(--surf2);border:1px solid var(--line2);border-radius:26px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);overflow:hidden;
  transition:width .18s ease,height .18s ease,border-radius .18s ease}
#player.on{display:block}
#player.mini{width:48px;height:48px;border-radius:50%}
#player.open{width:252px;height:auto;border-radius:18px}
#player .pmini{width:48px;height:48px;display:grid;place-items:center;color:var(--me);font-size:19px;cursor:grab}
#player.open .pmini{display:none}
#player .pbody{display:none;padding:11px 12px 12px}
#player.open .pbody{display:block}
#player .phead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
#player .pdrag{width:22px;height:22px;display:grid;place-items:center;color:var(--dim);cursor:grab;flex-shrink:0;font-size:13px}
#player img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--surf3);flex-shrink:0}
#player .pti{flex:1;min-width:0}
#player .pt1{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .pt2{font-size:11px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#player .pclose{width:20px;height:20px;background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;flex-shrink:0}
#player .pctl{display:flex;gap:6px}
#player .pctl button{flex:1;padding:9px 0;background:var(--surf);border:1px solid var(--line);
  border-radius:9px;color:var(--ink);font-size:14px;cursor:pointer}
#player .pctl button.pp{background:var(--me);border-color:var(--me);color:#0E1116}

/* ─── WORKOUT ─── */
#wo{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:150;background:var(--bg);
  flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#wo.on{display:flex}
.wgrip{flex:0 0 auto;display:flex;justify-content:center;padding:8px 0 2px;touch-action:none;cursor:grab}
.wgrip span{width:40px;height:4px;border-radius:2px;background:var(--line2)}
.wt{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line)}
.wt .wp{flex:1;font-size:12px;color:var(--mid)}
.wx{background:none;border:none;color:var(--mid);font-size:23px;cursor:pointer;line-height:1;padding:0 4px}
.wb{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 19px}
.wn{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.12;margin-bottom:5px}
.ws{font-size:13.5px;color:var(--mid);margin-bottom:18px;line-height:1.5}
.wp3{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
.wp3>div{flex:1;background:var(--surf);border-radius:11px;padding:11px}
.wp3 .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
.wp3 .v{font-size:21px;font-weight:700}
.wset{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;margin-bottom:7px}
.wset.ok{border-color:var(--ok);background:rgba(63,191,143,.07)}
.wset.skipped{opacity:.42}
.wset.skipped input{text-decoration:line-through;pointer-events:none}
.wset .wsn{width:48px;font-size:12.5px;color:var(--mid);flex-shrink:0}
.wset input{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--line);border-radius:8px;
  padding:9px;color:var(--ink);font-size:16px;-webkit-appearance:none}
.wset input:focus{outline:none;border-color:var(--me)}
.wdo{flex:0 0 auto;width:40px;height:37px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surf2);color:var(--mid);font-size:16px;cursor:pointer}
.wset.ok .wdo{background:var(--ok);border-color:var(--ok);color:#0E1116}
.wsk{flex:0 0 auto;width:34px;height:37px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:14px;cursor:pointer}
.wset.skipped .wsk{background:rgba(240,168,48,.15);border-color:var(--warn);color:var(--warn)}
.wnav{flex:0 0 auto;display:flex;gap:9px;padding:11px 19px;border-top:1px solid var(--line)}
.wnav button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);
  color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}
.wnav button.main{flex:2;background:var(--me);border-color:var(--me);color:#0E1116;font-weight:650}
.wrest{position:absolute;inset:0;background:rgba(14,17,22,.97);display:none;flex-direction:column;
  align-items:center;justify-content:center;z-index:5}
.wrest.on{display:flex}
.wrest .rl{font-size:12.5px;color:var(--mid);margin-bottom:8px}
.wrest .rt{font-size:78px;font-weight:700;line-height:1;color:var(--ok);cursor:pointer;
  padding:10px 24px;border-radius:18px}
.wrest .rt:active{background:var(--surf2)}
.wrest .rhint{font-size:11.5px;color:var(--dim);margin-top:14px}
.wrest.mini .rhint{display:none}
.wrest .rb{margin-top:26px;display:flex;gap:9px}
.wrest .rb button{padding:12px 20px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  color:var(--ink);font-size:14px;cursor:pointer}
.wrest .rmin{position:absolute;top:10px;right:10px;width:52px;height:52px;border-radius:50%;
  background:var(--surf2);border:1px solid var(--line);color:var(--mid);font-size:17px;cursor:pointer}
/* Verkleinert: schwebende Pille, frei verschiebbar, Rest der Seite bedienbar */
.wrest.mini{position:fixed;inset:auto;width:auto;background:none;display:block;z-index:180;
  touch-action:none}
.wrest.mini .rl,.wrest.mini .rb,.wrest.mini .rmin{display:none}
.wrest.mini .rt{font-size:19px;font-weight:700;color:var(--ok);background:var(--surf2);
  border:1px solid var(--line2);border-radius:22px;padding:9px 17px;
  box-shadow:0 5px 18px rgba(0,0,0,.5);cursor:grab;min-width:78px;text-align:center}

/* ─── MODAL / TOAST ─── */
.mbg{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(14,17,22,.9);
  overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.mbg.open{display:flex;flex-direction:column}
.modal{max-width:560px;width:100%;margin:auto;background:var(--surf);border:1px solid var(--line);
  border-radius:16px;padding:20px 17px 22px}
.modal h3{font-size:18px;font-weight:650;margin-bottom:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);
  background:var(--surf3);border:1px solid var(--line2);color:var(--ink);padding:11px 19px;border-radius:11px;
  font-size:13.5px;z-index:180;opacity:0;transition:.24s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--dim);border-top-color:var(--me);
  border-radius:50%;animation:sp .7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* ─── CHAT ─── */
.chat{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.msg{max-width:88%;padding:11px 13px;border-radius:13px;font-size:14px;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--surf3);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--mid)}
.msg.a b{color:var(--ink);font-weight:500}
.cbar{display:flex;gap:8px;align-items:flex-end}
.cbar textarea{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  color:var(--ink);font-size:16px;line-height:1.5;resize:none;max-height:120px;-webkit-appearance:none}
.cbar textarea:focus{outline:none;border-color:var(--me)}
.cbar button{flex:0 0 auto;width:43px;height:43px;border-radius:12px;background:var(--me);border:none;
  color:#0E1116;font-size:18px;cursor:pointer}

/* ─── CHART / MISC ─── */

  h:"<b>Wettkampf: 200 m, Damen Open 2 × 16 kg.</b><br><br>Aufrecht, Schultern hinten und unten, kurze schnelle Schritte. Nicht absetzen, solange der Griff hält – jedes Absetzen kostet mehr Zeit, als es spart.<br><br><b>Griffkraft ist fast immer der limitierende Faktor</b>, nicht die Beine. Deshalb stehen Dead Hangs und Carries regelmäßig im Plan."},
 deadhang:{n:"Dead Hang",o:["klimmzug","ringe"],a:["farmerwalk"],h:"Einfach hängen, Schultern aktiv. Zeit in Sekunden."},
 shrug:{n:"Schulterheben",o:["kurzhantel","langhantel","trapbar"],a:["farmerwalk"],h:"Gerade nach oben ziehen, oben kurz halten. Kein Kreisen."},
 beinheben:{n:"Hängendes Beinheben",o:["klimmzug","kapitaen","bauchmasch","ringe"],a:["pallof","plank"],h:"Beine kontrolliert bis mindestens Hüfthöhe. Kein Schwung."},
 pallof:{n:"Pallof Press",o:["kabel","kabelturm","band"],a:["beinheben","plank","deadhang"],h:"Seitlich zum Zug, Arme nach vorn ausstrecken und halten. Der Zug will rotieren, du widerstehst. 3–5 s pro Wiederholung."},
 plank:{n:"Plank",o:[],a:["beinheben","pallof"],h:"Gerade Linie, Gesäß nicht hochstrecken, Hüfte nicht durchhängen."},

 /* Hybrid / HYROX */
 skierg:{n:"SkiErg",o:["skierg","concept2","kabel"],a:["row","burpee","kbswing"],
  h:"<b>Wettkampf: 1000 m als erste Station, direkt nach dem ersten Kilometer.</b><br><br>Der Zug beginnt mit Hüftbeugung und Rumpf, nicht mit den Armen. Bis zu den Oberschenkeln durchziehen, entspannt zurückführen.<br><br><b>Hier wird das Rennen verloren, nicht gewonnen.</b> Wer die erste Station zu hart angeht, bezahlt es an den Lunges und Wall Balls. Gleichmäßiges Tempo, das sich noch zu langsam anfühlt."},
 row:{n:"Rudern",o:["concept2","assaultbike"],a:["skierg","kbswing","burpeeplain"],
  h:"<b>Wettkampf: 1000 m als fünfte Station, direkt nach den Burpees.</b><br><br>Reihenfolge: Beine, Rumpf, Arme. Zurück in umgekehrter Folge, Damper 4 bis 5.<br><br>Nach den Burpees ist die Atmung hoch – die ersten zweihundert Meter bewusst ruhig rudern und den Puls kontrolliert senken. Das ist die beste Erholungsgelegenheit im ganzen Rennen."},
 wallballs:{n:"Wall Balls",o:["wallball","medball"],a:["thruster","goblet","kbswing"],
  h:"<b>Wettkampf: 100 Wiederholungen, Damen Open 4 kg auf 2,70 m. Die letzte Station nach sieben Kilometern.</b><br><br>Tiefe Hocke, Hüfte unter Kniehöhe, aus den Beinen werfen – nicht aus den Armen drücken. Ball fangen und direkt in die nächste Hocke fallen lassen.<br><br><b>Einteilen ab der ersten Wiederholung.</b> Sätze zu zehn oder zwanzig mit kurzen Pausen sind schneller, als unbrochen anzufangen und ab Wiederholung vierzig einzubrechen."},
 thruster:{n:"Thruster",o:["kurzhantel","langhantel","kettlebell"],a:["wallballs","pushpress"],
  h:"Front Squat direkt in den Überkopfdruck. Eine durchgehende Bewegung, kein Stopp oben im Stand."},
 goblet:{n:"Goblet Squat",o:["kettlebell","kurzhantel"],a:["wallballs","squat"],h:"Gewicht vertikal vor der Brust, tief runter, Ellbogen drücken die Knie nach außen."},
 burpee:{n:"Burpee Broad Jumps",o:[],a:["burpeeplain","boxjump"],
  h:"<b>Wettkampf: 80 m, Körpergewicht.</b><br><br>Brust zum Boden, aufstehen, beidbeinig weit nach vorn springen. <b>Flach und weit springen statt hoch</b> – jeder Zentimeter Höhe ist verschenkte Zeit und Puls.<br><br>Gleichmäßiger Rhythmus schlägt Sprints mit Pausen. Beim Hochkommen ausatmen."},
 burpeeplain:{n:"Burpees",o:[],a:["burpee","boxjump"],h:"Brust zum Boden, hoch, Hände über dem Kopf zusammen."},
 jumpsquat:{n:"Sprungkniebeuge",o:["matten"],a:["boxjump","wallballs","goblet"],
  h:"Tiefe Kniebeuge, explosiv nach oben, weich landen und direkt in die nächste gehen.<br><br><b>Warum:</b> Auf Reisen der nächste Verwandte zum Wall Ball – gleiche Bewegung, gleiche Ermüdung in den Oberschenkeln, nur ohne Ball und ohne Wand."},
 boxjumpein:{n:"Box Jumps einbeinig",o:["box"],a:["boxjump","stepup"],
  h:"Niedrige Box, ein Bein. Weich landen, das Knie bleibt über dem Fuß.<br><br><b>Warum:</b> Deckt Seitenunterschiede in der Sprungkraft auf, die beidbeinig verborgen bleiben – und genau diese Unterschiede zeigen sich später beim Laufen."},
 bulgarianjump:{n:"Bulgarian Split Squat Jumps",o:["box","bank"],a:["bulgarian","lunge"],
  h:"Hinterer Fuß erhöht, aus der tiefen Position abspringen, weich wieder landen.<br><br><b>Warum:</b> Verbindet die einbeinige Kraftposition mit Schnellkraft. Für den Sled Push und die Lunges im Wettkampf unmittelbar übertragbar."},
 quickfeet:{n:"Quick Feet",o:["stepper","box","matten"],a:["jumprope","boxjump"],
  h:"So schnelle Fußwechsel wie möglich, kurzer Bodenkontakt, aufrechter Oberkörper. Angabe in Sekunden.<br><br><b>Warum:</b> Trainiert die Kontaktzeit, nicht die Kraft. Kurze Bodenkontaktzeit ist einer der stärksten Einzelfaktoren der Laufökonomie."},
 boxjump:{n:"Box Jumps",o:["box"],a:["burpee","lunge"],h:"Beidbeinig hoch, oben voll aufrichten, runtersteigen statt springen."},
 sledpush:{n:"Sled Push",o:["sled","schlitten"],a:["lunge","beinpresse","stepup","bulgarian"],
  h:"<b>Wettkampf: 50 m in vier Bahnen à 12,5 m, Damen Open 102 kg inklusive Schlitten.</b><br><br>Tief bleiben, Arme gestreckt und blockiert, Blick nach unten. Kurze schnelle Schritte statt langer Züge. Nicht stehenbleiben – den Schlitten wieder anzuschieben kostet mehr Kraft als durchgehendes Schieben.<br><br><b>Für Frauen meist die schwerste Station.</b> Was hier hilft: schwere Kniebeugen, Beinpresse, Ausfallschritte und Wadenarbeit – also genau das, was im Beintag steht."},
 sledpull:{n:"Sled Pull",o:["sled","schlitten","kabel"],a:["kabelrudern","rudern","pullup"],
  h:"<b>Wettkampf: 50 m, Damen Open 78 kg inklusive Schlitten.</b><br><br>Breiter Stand, tief sitzen, Hand über Hand ziehen und dabei rückwärts gehen. Die Kraft kommt aus Beinen und Rumpf, nicht aus den Armen – wer hier aus dem Arm zieht, hat vor den Wall Balls keine Griffkraft mehr.<br><br>Nach dem Push sind Beine und Griff schon müde. Genau deshalb wird die Reihenfolge im Training geübt."},
 sandbaglunge:{n:"Sandbag Lunges",o:["sandbag","kurzhantel","kettlebell"],a:["lunge","bulgarian","stepup"],
  h:"<b>Wettkampf: 100 m Ausfallschritte, Damen Open 10 kg auf den Schultern.</b><br><br>Das hintere Knie muss den Boden berühren, sonst zählt die Wiederholung nicht. Aufrecht bleiben, der Sack liegt im Nacken und wird mit beiden Händen fixiert.<br><br>Diese Station kommt an siebter Stelle – die Beine sind dann von Schlitten, Sprüngen und sieben Kilometern vorbelastet. Im Training deshalb bewusst mit müden Beinen üben."},
 kbswing:{n:"Kettlebell Swing",o:["kettlebell"],a:["thruster","rdl"],h:"Hüftscharnier, nicht Kniebeuge. Explosiv aus der Hüfte, die Kugel fliegt von selbst."},
 /* Brust und Druck */
 pullover:{n:"Überzug",o:["kurzhantel","kabel","langhantel"],a:["butterflyex","latzugbreit"],
  h:"<b>Quer auf der Bank</b>, nur die Schulterblätter liegen auf. Gewicht mit beiden Händen über der Brust, kontrolliert hinter den Kopf absenken bis es im Brustkorb zieht, dann zurückziehen.<br><br><b>Warum:</b> Dehnung unter Last über einen Bereich, den weder Bankdrücken noch Fliegende erreichen. Trifft Brust und Latissimus gleichzeitig."},
 closegrip:{n:"Enges Bankdrücken",o:["langhantel","multipresse","sz"],a:["dips","trizeps","bench"],
  h:"Griff etwa schulterbreit, nicht enger – sonst leiden die Handgelenke. Ellbogen eng am Körper führen, Stange zum unteren Brustbein.<br><br><b>Warum:</b> Die beste schwere Trizepsübung. Überträgt sich direkt auf das Bankdrücken im oberen Drittel."},
 cablecross:{n:"Kabelkreuz",o:["kabelcross","kabel"],a:["butterflyex","pullover"],
  h:"Züge von oben oder unten, leicht vorgebeugt. Hände vor dem Körper zusammenführen und eine Sekunde anspannen.<br><br><b>Warum:</b> Konstante Spannung über die ganze Bewegung – das hat keine Hantelübung."},
 inclinefly:{n:"Fliegende schräg",o:["kurzhantel","kabelcross","butterfly"],a:["incline","butterflyex"],
  h:"Bank auf 30°, Ellbogen leicht gebeugt und fixiert. Weit öffnen bis zur Dehnung, dann zusammenführen.<br><br><b>Warum:</b> Trifft die obere Brust, die beim Flachbankdrücken zu kurz kommt."},
 pushup:{n:"Liegestütze",o:[],a:["bench","dips"],
  h:"Körper als gerade Linie, Hände etwas breiter als schulterbreit, Brust zum Boden. Bei Bedarf Füße erhöhen für mehr Last."},
 /* Schultern */
 arnold:{n:"Arnold Press",o:["kurzhantel"],a:["ohp","schulterpresse"],
  h:"Start mit den Handflächen zum Körper, beim Hochdrücken nach außen drehen. Oben zeigen die Handflächen nach vorn.<br><br><b>Warum:</b> Die Rotation nimmt den vorderen und mittleren Schulterkopf gleichzeitig mit."},
 frontraise:{n:"Frontheben",o:["kurzhantel","kabel","band"],a:["seitheben","ohp"],
  h:"Gestreckte Arme bis Schulterhöhe heben, kein Schwung aus der Hüfte. Leichtes Gewicht, saubere Bahn."},
 reversefly:{n:"Reverse Flys",o:["reversebutterfly","kurzhantel","kabel"],a:["facepull","seitheben"],
  h:"Vorgebeugt oder an der Maschine, Ellbogen leicht gebeugt. Arme seitlich öffnen, Schulterblätter zusammenziehen.<br><br><b>Warum:</b> Die hintere Schulter ist bei fast jedem die schwächste – und sie hält das Bankdrücken langfristig gesund."},
 /* Rücken */
 onerow:{n:"Einarmiges Kurzhantelrudern",o:["kurzhantel","kettlebell"],a:["rudern","kabelrudern"],
  h:"Knie und freie Hand auf der Bank, Rücken flach. Langer Zug bis der Ellbogen deutlich hinter dem Körper ist, unten voll ausstrecken lassen.<br><br><b>Warum:</b> Jede Seite einzeln – Seitenunterschiede verstecken sich hier nicht."},
 chestrow:{n:"Rudern mit Brustpolster",o:["rudermaschbrust","tbarplate"],a:["rudern","kabelrudern"],
  h:"Brust fest am Polster, dadurch fällt der untere Rücken als Schwachstelle weg. Schulterblätter zuerst, dann die Arme."},
 straightarm:{n:"Überzug am Kabel",o:["kabel","latzug"],a:["pullover","latzugbreit"],
  h:"Gestreckte Arme, Zug von oben vor den Körper nach unten ziehen. Nur die Schulter bewegt sich.<br><br><b>Warum:</b> Isoliert den Latissimus ohne Bizepsbeteiligung – gute Vorermüdung vor Klimmzügen."},
 /* Arme */
 skullcrusher:{n:"Stirndrücken",o:["sz","kurzhantel","langhantel"],a:["trizeps","closegrip"],
  h:"Liegend, Oberarme senkrecht und fixiert. Gewicht zur Stirn oder knapp dahinter absenken, dann strecken."},
 overheadtri:{n:"Trizepsdrücken über Kopf",o:["kurzhantel","kabel","sz"],a:["trizeps","skullcrusher"],
  h:"Über Kopf, Ellbogen eng und fixiert. Tiefe Dehnung unten.<br><br><b>Warum:</b> Trifft den langen Trizepskopf, den kein Drücken erreicht."},
 scottcurl:{n:"Scott-Curl",o:["predigerbank","sz","kurzhantel"],a:["curl","hammer"],
  h:"Oberarme liegen auf dem Polster. Unten vollständig strecken – genau dort entsteht der Reiz."},
 /* Beine */
 nordic:{n:"Nordic Curls",o:[],a:["beincurl","rdl"],
  h:"Knien, Fersen fixieren lassen, Körper gestreckt so weit wie möglich nach vorn absenken und abfangen.<br><br><b>Warum:</b> Die stärkste exzentrische Übung für die hintere Oberschenkelmuskulatur. Schützt beim Sprinten."},
 /* Rumpf */
 abwheel:{n:"Ab-Wheel",o:["abrad"],a:["beinheben","pallof"],
  h:"Aus dem Knien ausrollen, unterer Rücken bleibt flach. Nur so weit, wie du die Spannung halten kannst."},
 cablecrunch:{n:"Crunch am Kabel",o:["kabel"],a:["beinheben","abwheel"],
  h:"Knien, Seil am Kopf, Bewegung kommt aus der Wirbelsäule – Hüfte bleibt still."},
 sideplank:{n:"Seitstütz",o:[],a:["pallof","abwheel"],
  h:"Gerade Linie von Kopf bis Fuß, Hüfte oben halten. Angabe in Sekunden je Seite."},
 /* ── BEINE VORDERSEITE ── */
 boxsquat:{n:"Box Squat",o:["rack","powerrack","multipresse","box"],a:["squat","beinpresse45"],
  h:"Auf die Box setzen, kurz entspannen ohne die Rumpfspannung zu verlieren, dann explosiv hoch. Die Box gibt eine konstante Tiefe vor – gut, um Technik zu standardisieren."},
 pausesquat:{n:"Pausen-Kniebeuge",o:["rack","powerrack","multipresse"],a:["squat","front"],
  h:"Unten zwei bis drei Sekunden still halten, dann hoch. Tötet jeden Schwung ab und baut genau dort Kraft auf, wo die meisten hängenbleiben. Etwa achtzig Prozent des normalen Gewichts."},
 zercher:{n:"Zercher Squat",o:["langhantel","rack"],a:["front","goblet"],
  h:"Stange in den Ellbogenbeugen. Zwingt zu maximaler Aufrichtung und fordert den Rumpf enorm. Mit Tuch oder Polster gegen den Druck."},
 splitsquat:{n:"Split Squat statisch",o:["kurzhantel","langhantel","multipresse"],a:["bulgarian","lunge"],
  h:"Beide Füße bleiben am Boden, Schrittstellung. Senkrecht absenken. Leichter zu dosieren als die bulgarische Variante."},
 reverselunge:{n:"Rückwärtsausfallschritt",o:["kurzhantel","langhantel","kettlebell"],a:["lunge","splitsquat"],
  h:"Schritt nach hinten statt nach vorn. Deutlich knieschonender, weil das vordere Knie nicht nach vorn wandert."},
 walkinglunge:{n:"Ausfallschritte gehend",o:["kurzhantel","kettlebell","langhantel"],a:["lunge","reverselunge"],
  h:"Durchgehend vorwärts, hinteres Knie tippt den Boden an. Angabe in Schritten je Seite."},
 stepdown:{n:"Step-Down",o:["box","kurzhantel"],a:["stepup","bulgarian"],
  h:"Auf der Box stehen, kontrolliert mit einem Bein absenken bis die Ferse den Boden antippt. Die exzentrische Kontrolle ist der Reiz."},
 sissysquat:{n:"Sissy Squat",o:["matten","band"],a:["beinext","hacksq"],
  h:"Knie nach vorn, Oberkörper zurück, Hüfte bleibt gestreckt. Trifft den geraden Oberschenkelmuskel in voller Dehnung. Langsam herantasten."},
 beinpresseein:{n:"Beinpresse einbeinig",o:["beinpresse45","beinpresselin","beinpresseho"],a:["bulgarian","beinpresse"],
  h:"Ein Bein mittig auf die Platte, das andere zur Seite. Deckt Seitenunterschiede auf, die beidbeinig verborgen bleiben."},
 beinextein:{n:"Beinstrecker einbeinig",o:["beinstrecker"],a:["beinext","sissysquat"],
  h:"Jede Seite einzeln. Oben eine Sekunde halten, unten die Spannung nicht abfallen lassen."},
 adduktoren:{n:"Adduktoren",o:["adduktor","band","kabel"],a:["abd","bulgarian"],
  h:"Innenseite der Oberschenkel. Wird fast immer vergessen und ist bei Läufern oft die Ursache für Leistenprobleme."},
 wandsitz:{n:"Wall Sit",o:[],a:["beinext","goblet"],
  h:"Rücken an der Wand, Oberschenkel waagrecht, Zeit halten. Angabe in Sekunden."},
 /* ── BEINE RÜCKSEITE ── */
 sumodl:{n:"Sumo-Kreuzheben",o:["langhantel","trapbar"],a:["deadlift","rdl"],
  h:"Breiter Stand, Hände innerhalb der Beine. Kürzerer Weg, aufrechterer Rücken, mehr Beteiligung von Gesäß und Innenseite. Für manche Körperbauten deutlich stärker als konventionell."},
 deficitdl:{n:"Deficit-Kreuzheben",o:["langhantel"],a:["deadlift","rdl"],
  h:"Auf einer Erhöhung von drei bis fünf Zentimetern stehen. Längerer Weg, baut Kraft im Antritt vom Boden. Zehn bis fünfzehn Prozent weniger Gewicht."},
 rackpull:{n:"Rack Pull",o:["rack","powerrack","langhantel"],a:["deadlift","shrug"],
  h:"Stange auf Kniehöhe abgelegt. Nur die obere Hälfte, dadurch sehr schwer ladbar. Gut für Griff und oberen Rücken."},
 stiffleg:{n:"Gestrecktes Kreuzheben",o:["langhantel","kurzhantel"],a:["rdl","goodmorning"],
  h:"Knie fast durchgestreckt, maximale Dehnung hinten. Deutlich leichter als Rumänisches Kreuzheben – das Gewicht ist hier nebensächlich."},
 hipthrustein:{n:"Hip Thrust einbeinig",o:["kurzhantel","bank"],a:["hipthrust","glutebridge"],
  h:"Ein Fuß am Boden, das andere Bein angezogen. Deckt Seitenunterschiede im Gesäß auf."},
 pullthrough:{n:"Pull Through am Kabel",o:["kabel","kabelturm","band"],a:["rdl","hipthrust"],
  h:"Rücken zum Zugturm, Seil zwischen den Beinen. Hüftscharnier gegen den Zug. Sehr rückenschonend und lehrt die Bewegung sauber."},
 gluteham:{n:"Glute-Ham-Raise",o:["hyper","hyperhor"],a:["nordic","beincurl"],
  h:"Im Gerät oder mit fixierten Füßen. Die stärkste Übung für die Oberschenkelrückseite, die es ohne Zusatzgewicht gibt."},
 kbdeadlift:{n:"Kettlebell-Kreuzheben",o:["kettlebell","kurzhantel"],a:["deadlift","rdl"],
  h:"Kugel zwischen den Füßen, Hüftscharnier. Gute Einstiegsvariante und leicht zu dosieren."},
 /* ── BRUST ── */
 declinebench:{n:"Negativbankdrücken",o:["negativbank","langhantel","kurzhantel"],a:["bench","dips"],
  h:"Kopf tiefer als die Hüfte. Trifft die untere Brust, oft das stärkste Drücken überhaupt. Beim Ablegen vorsichtig sein."},
 floorpress:{n:"Bodendrücken",o:["langhantel","kurzhantel","sz"],a:["bench","closegrip"],
  h:"Auf dem Boden liegend, Oberarme tippen auf. Begrenzter Weg, starker Reiz auf Trizeps und oberes Drittel. Schulterschonend."},
 dbbench:{n:"Kurzhantel-Bankdrücken",o:["kurzhantel","bank"],a:["bench","chestpressex"],
  h:"Größere Dehnung als mit der Stange, jede Seite arbeitet für sich. Am Ende kontrolliert auf den Oberschenkeln ablegen."},
 cablelow:{n:"Kabelzug von unten",o:["kabelcross","kabel"],a:["inclinefly","incline"],
  h:"Züge von unten nach oben zusammenführen. Trifft die obere Brust unter konstanter Spannung."},
 cablehigh:{n:"Kabelzug von oben",o:["kabelcross","kabel"],a:["butterflyex","cablecross"],
  h:"Züge von oben nach unten vor dem Körper zusammenführen. Betont die untere Brust."},
 pushupfeet:{n:"Liegestütze erhöht",o:["box","bank"],a:["pushup","incline"],
  h:"Füße auf Box oder Bank. Verschiebt die Last Richtung obere Brust und Schulter."},
 /* ── SCHULTERN ── */
 uprightrow:{n:"Aufrechtes Rudern",o:["sz","langhantel","kabel","kurzhantel"],a:["seitheben","shrug"],
  h:"Nur bis Brusthöhe ziehen, Ellbogen führen. Bei Schulterbeschwerden weglassen und stattdessen Seitheben."},
 landmine:{n:"Landmine Press",o:["langhantel"],a:["ohp","arnold"],
  h:"Stangenende in der Ecke oder im Landmine-Gelenk, einarmig schräg nach oben drücken. Sehr schulterfreundlich."},
 plateraise:{n:"Scheibenheben",o:["langhantel","kurzhantel"],a:["frontraise","ohp"],
  h:"Scheibe mit beiden Händen vor dem Körper bis Augenhöhe heben. Kein Schwung."},
 cuban:{n:"Cuban Press",o:["kurzhantel","band"],a:["facepull","reversefly"],
  h:"Aufrechtes Rudern, dann Außenrotation, dann Druck über Kopf. Leichtes Gewicht – reine Vorsorge für die Schulter."},
 /* ── RÜCKEN ── */
 latzugengex:{n:"Latzug Enggriff",o:["latzugeng","latzug","kabel"],a:["latzugbreit","pullup"],
  h:"Paralleler Enggriff, zum oberen Brustbein ziehen. Mehr Dicke, weniger Breite als der breite Griff."},
 pendlay:{n:"Pendlay Rudern",o:["langhantel"],a:["rudern","chestrow"],
  h:"Oberkörper waagrecht, Stange liegt zwischen den Wiederholungen jedes Mal am Boden ab. Explosiv ziehen. Baut rohe Zugkraft."},
 sealrow:{n:"Seal Row",o:["bank","langhantel","kurzhantel"],a:["chestrow","rudern"],
  h:"Bauchlage auf erhöhter Bank. Kein Schwung möglich, dadurch arbeitet nur der Rücken."},
 meadows:{n:"Meadows Row",o:["tbar","langhantel"],a:["onerow","rudern"],
  h:"Seitlich zum Stangenende stehen, einarmig ziehen. Ungewöhnlicher Winkel, trifft den oberen Latissimus."},
 invertedrow:{n:"Schrägrudern",o:["ringe","schlingentrainer","multipresse"],a:["kabelrudern","pullup"],
  h:"Unter einer Stange hängend, Körper gestreckt, zur Stange ziehen. Je flacher, desto schwerer."},
 chinup:{n:"Klimmzug Untergriff",o:["klimmzug","assist","band"],a:["pullup","latzugbreit"],
  h:"Handflächen zu dir. Der Bizeps hilft mehr mit, dadurch meist zwei bis drei Wiederholungen mehr als im Obergriff."},
 neutralpull:{n:"Klimmzug Kammgriff",o:["klimmzug","ringe","assist"],a:["pullup","chinup"],
  h:"Handflächen zueinander. Die schulterfreundlichste Klimmzugvariante."},
 /* ── ARME ── */
 inclinecurl:{n:"Schrägbank-Curl",o:["schraeg","kurzhantel"],a:["curl","scottcurl"],
  h:"Rücklings auf der Schrägbank, Arme hängen. Maximale Dehnung des langen Bizepskopfs."},
 spidercurl:{n:"Spider Curl",o:["schraeg","sz","kurzhantel"],a:["scottcurl","curl"],
  h:"Bäuchlings auf der Schrägbank. Keine Ausweichbewegung möglich, sehr strikte Ausführung."},
 concentration:{n:"Konzentrationscurl",o:["kurzhantel"],a:["curl","scottcurl"],
  h:"Sitzend, Ellbogen an der Oberschenkelinnenseite. Maximale Spitzenspannung."},
 reversecurl:{n:"Umgekehrtes Curlen",o:["sz","langhantel","kabel"],a:["hammer","curl"],
  h:"Obergriff. Trifft den Unterarmstrecker und den darunterliegenden Muskel – gut für die Griffkraft."},
 wristcurl:{n:"Handgelenkscurl",o:["kurzhantel","sz","langhantel"],a:["farmerwalk","deadhang"],
  h:"Unterarme auf den Oberschenkeln, nur das Handgelenk bewegt sich. Beide Richtungen trainieren."},
 kickback:{n:"Trizeps-Kickback",o:["kurzhantel","kabel"],a:["trizeps","overheadtri"],
  h:"Oberkörper vorgebeugt, Oberarm waagrecht und fixiert. Nur der Unterarm streckt."},
 jmpress:{n:"Enges Drücken an der Multipresse",o:["multipresse","langhantel"],a:["closegrip","skullcrusher"],
  h:"Enger Griff, Ellbogen eng. Die geführte Bahn erlaubt schwere Trizepsarbeit ohne Hilfestellung."},
 /* ── RUMPF ── */
 russian:{n:"Russian Twist",o:["medball","kurzhantel","kettlebell"],a:["pallof","woodchopper"],
  h:"Sitzend, Oberkörper zurückgelehnt, Gewicht von Seite zu Seite. Bewegung aus dem Rumpf, nicht aus den Armen."},

/* RPE hängt nicht nur von der Last ab, sondern vom Verhältnis Last zu
   Wiederholungen. 66 Prozent sind bei fünf Wiederholungen leicht und bei
   zwölf nahe am Maximum. Grundlage ist die gebräuchliche RPE-Tabelle:
   Prozentwert, der bei einer bestimmten Wiederholungszahl RPE 10 entspricht. */
const RPE10=[100,100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,70.7,68.0];
function rpeFromPct(p,reps,sets){
  const r=Math.max(1,Math.min(12,parseInt(reps,10)||5));
  const top=RPE10[r];
  // Je 2,5 Prozentpunkte unter dem Maximalwert eine RPE-Stufe
  let rpe=10-((top-p*100)/2.5);
  // Mehrere Sätze ermüden: der letzte ist schwerer als der erste
  rpe+=Math.max(0,((sets||3)-2))*0.3;
  return Math.max(4,Math.min(9,Math.round(rpe)));
}

/* Einmalige Bereinigung: In früheren Fassungen lief Yuan im wandernden Zyklus.

   Entfernt wird nur, was keine eigene Belegung enthält – von Hand gesetzte
   Wochen- oder Zykluspläne bleiben unangetastet. */
(function migrateCycle(){
  /* Fassung 3: In älteren Fassungen wurde beim Antippen der Zyklusseite der
     komplette damalige Stand gespeichert – samt Vorlagen, die über Nummern
     verknüpft waren. Da sich diese Nummern mit neuen Vorlagen verschieben,
     zeigten solche Pläne später falsche Übungen. Diese eingefrorenen Reste
     werden entfernt; von Hand gesetzte Pläne mit Namensbezug bleiben. */
  if(DB.cycleV>=4&&DB.cycle){
    let geaendert=false;
    ATH.forEach(a=>{
      const c=DB.cycle[a]; if(!c)return;
      if(c.phasePlans){delete c.phasePlans;geaendert=true;}
    });
    if(geaendert){try{localStorage.setItem("hybrid_v1",JSON.stringify(DB));}catch(e){}}
    return;
  }
  if(DB.cycle){
    const alteNummer=v=>typeof v==="string"&&/^p\d+$/.test(v);
    ATH.forEach(a=>{
      const c=DB.cycle[a]; if(!c)return;
      delete c.phasePlans;
      /* Die rollierende Woche stammt aus einer früheren Vorgabe. Dort wandern
         die Krafteinheiten durch den Katalog – genau das führte dazu, dass
         derselbe Wochentag unterschiedliche Übungen zeigte. */
      if(c.plan)delete c.plan;
      if(c.mode==="week")delete c.mode;
      ["fixPlan","rollPlan"].forEach(k=>{
        const arr=c[k];
        if(Array.isArray(arr)&&arr.some(v=>alteNummer(v)||(typeof v==="string"&&v.indexOf("alt:p")===0)))
          delete c[k];
      });
      if(!Object.keys(c).length)delete DB.cycle[a];
    });
    if(!Object.keys(DB.cycle).length)delete DB.cycle;
  }
  DB.cycleV=4;
  try{localStorage.setItem("hybrid_v1",JSON.stringify(DB));}catch(e){}
  if(DB.cycleV>=2)return;
  if(DB.cycle){
    ATH.forEach(a=>{
      const c=DB.cycle[a];
      if(!c)return;
      const eigen=(c.fixPlan&&c.fixPlan.length)||(c.rollPlan&&c.rollPlan.length)||c.phasePlans;
      if(!eigen)delete DB.cycle[a];
    });
    if(!Object.keys(DB.cycle).length)delete DB.cycle;
  }
  DB.cycleV=2;
  try{localStorage.setItem("hybrid_v1",JSON.stringify(DB));}catch(e){}
})();

  if(v==="long")return ["Long Run","var(--both)"];

function entryToMap(v,pos,dateStr){

const _schedC={};
function buildSchedule(uptoISO,ath){
  const c=cyc(ath);
  const key=ath+"|"+DB.start+"|"+uptoISO+"|"+JSON.stringify(c)+"|"+JSON.stringify(DB.templates||[]);
  if(_schedC[key])return _schedC[key];
  const map={},start=new Date(DB.start+"T12:00:00"),end=new Date(uptoISO+"T12:00:00");
  const KS=KRAFT_SLOTS(),LS=LAUF_SLOTS(),RP=rollPlanOf(ath);
  let ptr=0,kp=0,lp=0,prevRun=false,pending=null;
  const d=new Date(start);
  while(d<=end){
    const wd=d.getDay(), ds=iso(d);
    if(wd===c.longDay){map[ds]={fix:"long"};prevRun=true;}
    else if((c.rest||[]).includes(wd)){map[ds]={fix:"rest"};prevRun=false;}
    else if(c.mode==="fix"){
      const v=(phasePlan(ath,ds)||c.fixPlan||[])[wd];
      map[ds]=entryToMap(v,-1,ds);
      prevRun=(entryKind(v,ds)==="lauf");
    }
    else if(c.mode==="week"){
      const kind=(c.plan||[])[wd]||"rest";
      if(kind==="rest"){map[ds]={fix:"rest"};prevRun=false;}
      else if(kind==="long"){map[ds]={fix:"long"};prevRun=true;}
      else if(kind==="lauf"){map[ds]={slot:LS[lp%LS.length]};lp++;prevRun=true;}
      else {map[ds]={slot:KS[kp%KS.length]};kp++;prevRun=false;}
    }
    else if(pending!==null){
      map[ds]=entryToMap(RP[pending],pending);
      prevRun=(entryKind(RP[pending])==="lauf");pending=null;
    }
    else{
      const N=RP.length;
      let use=ptr;
      if(entryKind(RP[use])==="lauf"&&prevRun){
        let t=0,alt=(use+1)%N;
        while(t<N&&entryKind(RP[alt])==="lauf"){alt=(alt+1)%N;t++;}
        if(entryKind(RP[alt])!=="lauf"){pending=use;use=alt;ptr=(alt+1)%N;}
        else ptr=(use+1)%N;
      } else ptr=(use+1)%N;
      map[ds]=entryToMap(RP[use],use);
      prevRun=(entryKind(RP[use])==="lauf");

      fixed:1,slot:-1,date:dateStr,cyc:0,ath,
      why:"<b>Heute nichts.</b> Spazieren, essen, schlafen. Trag im Protokoll ein, wie das Rennen gelaufen ist – Zeiten, was gut lief, was nicht. Das ist die wertvollste Information für den nächsten Block."};
  }
  if(rc&&rc.date===dateStr)return {k:"hybrid",n:rc.name,note:"Wettkampftag",fixed:1,slot:-1,
    date:dateStr,cyc:0,ath,raceday:1,
    why:"<b>Heute zählt nichts von dem, was du noch machen könntest – nur das, was du über Monate gemacht hast.</b><br><br>Aufwärmen wie an jedem Trainingstag: fünf Minuten locker, Mobilität, ein paar leichte Wiederholungen an der ersten Station. Dann warm bleiben.<br><br>Die ersten tausend Meter fühlen sich zu langsam an. Genau so sollen sie sich anfühlen."};
  const cu=(DB.custom&&DB.custom[dateStr]&&DB.custom[dateStr][ath]);
  if(cu&&cu.items&&cu.items.length)return {k:cu.k||"kraft",n:cu.name||"Eigene Einheit",
    note:cu.restSwap?"Statt Ruhetag":"Selbst zusammengestellt",warm:cu.warm||"mixed",
    custom:1,restSwap:cu.restSwap,items:cu.items,
    why:"<b>Diesen Tag hast du selbst zusammengestellt.</b> Aufwärmen und Cooldown laufen wie gewohnt mit. Über die Schaltfläche zum Zurücksetzen kommst du jederzeit zurück zum geplanten Training.",
    fixed:1,slot:-1,date:dateStr,cyc:0,ath};
  const e=schedEntry(dateStr,ath);
  if(e.fix==="preset"||e.fix==="tpl"){
    const t=(e.fix==="preset")?PRESETS[e.ix]
      :(DB.templates||[]).find(x=>x.name===e.name);
    if(t)return {k:"kraft",n:t.n||t.name,note:"Feste Vorlage",warm:t.w||t.warm||"mixed",
      tpl:1,items:t.items,
      why:"<b>Dieser Platz ist mit einer Vorlage belegt.</b> "+(t.d||"Du kannst den Tag jederzeit einzeln anpassen oder die Belegung unter Zyklus &amp; Ruhetage ändern."),
      fixed:1,slot:-1,date:dateStr,cyc:(e.pos>=0?e.pos+1:0),ath};
  }
  if(e.fix==="long")return {...SUN,fixed:1,slot:-1,date:dateStr,cyc:(e.pos>=0?e.pos+1:0),ath};
  if(e.fix==="rest")return {...SAT,fixed:1,slot:-1,date:dateStr,cyc:(e.pos>=0?e.pos+1:0),ath};
  const i=e.slot;
  return {...SLOTS[i],slot:i,date:dateStr,cyc:(e.pos>=0?e.pos+1:0),ath};
}
function weekIndex(dateStr){return Math.floor(Math.max(0,dayNum(dateStr))/7);}
/* Ein Block umfasst zwölf Wochen. Danach steht eine Überprüfung an:
   Maxima nachmessen, Laufumfang nachziehen, Plan anpassen. */
const BLOCKW=12;
function blockInfo(dateStr){
  const w=weekIndex(dateStr);
  return {block:Math.floor(w/BLOCKW)+1, week:(w%BLOCKW)+1, total:BLOCKW,
    last:(w%BLOCKW)+1>=BLOCKW, w};
}

/* Long-Run-Distanz: +1 km pro Woche, jede 4. Woche Entlastung */
function longRun(ath,dateStr){
  const w=weekIndex(dateStr);
  const base=DB.longBase[ath]||12;
  let max=DB.longMax[ath]||20;
  // Ab Block zwei darf die Obergrenze langsam mitwachsen, sonst bleibt der
  // Long Run nach rund einem halben Jahr für immer stehen.
  const bi=blockInfo(dateStr);
  // Höchstens vier Kilometer automatisch dazu. Alles darüber gehört in die
  // Blocküberprüfung – unbegrenztes Wachstum hätte nach zwei Jahren bei
  // 38 Kilometern geendet, und das ist ohne Marathonziel sinnlos.
  if(DB.longGrow!==false)max=max+Math.min(4,Math.max(0,bi.block-1)*2);
  const deload=(w%4===3);
  const build=w-Math.floor(w/4);
  let km=Math.min(max,base+build);
  if(deload)km=Math.round(km*0.7);
  return km;
}
/* Die wirksame Intensität für VO2max-Intervalle liegt bei 90 bis 95 Prozent
   der maximalen Herzfrequenz (Helgerud et al. 2007, Med Sci Sports Exerc 39(4)).
   Darüber entsteht kein zusätzlicher Reiz, nur zusätzliche Erholungskosten. */
const hrMax=a=>((DB.hrmax||{})[a]||0);
function hrTxt(a,von,bis){
  const m=hrMax(a);
  return m?`${Math.round(m*von)}–${Math.round(m*bis)} bpm`:"";
}
function paceTxt(ath,zone){
  const z=(DB.zones[ath]||ZONES[ath])[zone];
  if(!z)return "–";
  const f=(m,s)=>m+":"+String(s).padStart(2,"0");
  return z.length===4?`${f(z[0],z[1])}–${f(z[2],z[3])}`:f(z[0],z[1]);
}

function exOptions(id,g){

/* Neues Gerät anlegen und direkt dieser Übung zuordnen */
function addExEq(exId,name,key,gymAuch){
  const n=(name||"").trim();
  if(!n)return null;
  const tag="ux_"+n.toLowerCase().replace(/[^a-z0-9äöüß]+/g,"_").slice(0,26);
  DB.customEq=DB.customEq||{};
  DB.customEq[tag]=n;
  EQ[tag]=n;
  DB.exEq=DB.exEq||{};
  DB.exEq[exId]=DB.exEq[exId]||[];
  if(!DB.exEq[exId].includes(tag))DB.exEq[exId].push(tag);
  if(gymAuch!==false){
    const g=curGym();
    if(g&&!g.eq.includes(tag))g.eq.push(tag);
  }
  save();
  return tag;
}
function exAvailable(id,g){
  const x=EX[id]; if(!x)return false;
  if(!x.o||!x.o.length)return true;
  return x.o.some(t=>hasEq(t,g));
}

/* ══════════ GYM-EMPFEHLUNG ══════════
   Bewertet jedes Gym danach, wie viele der geplanten Übungen dort
   im Original machbar sind. Ersatzübungen zählen nur halb. */
function gymScore(ses,ath,g){
  const items=buildSession(ses,ath,true).filter(i=>i.ex&&EX[i.ex]);
  if(!items.length)return {pts:0,max:0,miss:[],pct:100};
  let pts=0,miss=[];
  items.forEach(it=>{
    if(exAvailable(it.ex,g))pts+=1;
    else{
      const alt=(EX[it.ex].a||[]).some(a=>EX[a]&&exAvailable(a,g));
      if(alt)pts+=.5;
      miss.push(it.name);
    }
  });
  return {pts,max:items.length,miss,pct:Math.round(pts/items.length*100)};
}
function bestGym(ses,ath){
  // Bei Gleichstand gewinnt das aktuell gewählte Gym, danach das mit mehr Auswahl
  return DB.gyms.map(g=>({g,...gymScore(ses,ath,g)}))
    .sort((a,b)=>b.pts-a.pts
      ||(b.g.id===DB.gym)-(a.g.id===DB.gym)
      ||b.g.eq.length-a.g.eq.length);
}
function altsFor(id){
  const x=EX[id]; if(!x)return [];
  return (x.a||[]).filter(a=>EX[a]&&exAvailable(a));
}

/* Stabiler Schlüssel zum Tauschen einer Übung: Zyklus-Einheiten über den
   Platz, Vorlagen über ihren Namen – der Tausch gilt dann jedes Mal. */
function swapKeyOf(ses,ath,it){
  if(it.slotKey)return it.slotKey;
  if(ses&&ses.n&&it.key&&it.key[0]==="C")return `n:${ses.n}|${ath}|${it.key}`;
  return null;
}

const ERG_EQ=["skierg","concept2","assaultbike","ergometer","laufband",
  "crosstrainer","stairmaster","stepper","liegerad","spinning"];
const isErg=eq=>ERG_EQ.includes(eq);

/* Zifferneingabe in eine Zeitangabe umwandeln: "205" wird zu "2:05".
   Nötig, weil die Zifferntastatur auf dem Handy keinen Doppelpunkt hat. */
function clockFmt(v){
  const s=String(v||"").trim();
  if(!s)return "";
  if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(s))return s;
  const d=s.replace(/\D/g,"");
  if(!d)return "";
  if(d.length<=2)return "0:"+d.padStart(2,"0");
  if(d.length<=4)return String(+d.slice(0,-2))+":"+d.slice(-2);
  return String(+d.slice(0,-4))+":"+d.slice(-4,-2)+":"+d.slice(-2);
}
const setsFor=(b,m,lead)=>m==="leicht"?Math.max(2,b-1):(m==="mehr"&&lead)?b+1:b;
function repFor(rep,m,unit){
  if(unit)return rep;                       // Meter und Sekunden bleiben unverändert
  const p=String(rep).split("–");
  if(p.length>1)return m==="leicht"?p[0]:m==="mehr"?p[1]:rep;
  const n=parseInt(rep,10);
  if(isNaN(n))return rep;
  return m==="leicht"?String(Math.max(3,Math.round(n*0.8))):m==="mehr"?String(n+2):rep;
}
function modeOf(date,ath){return (LR(date,ath).mode)||"normal";}
function buildSession(ses,ath,raw,modeArg){
  const out=[];
  if(ses.k==="rest")return out;
  const mode=modeArg||modeOf(ses.date,ath);
  const variant=(ses.slot>=0&&!ses.fixed)?(slotCount(ses.slot,ses.date,ath)%2):0;
  if(ses.run){
    const z=ses.run.zone;
    if(ses.run.isLong){
      const km=longRun(ath,ses.date);
      out.push({key:"run0",type:"run",name:"Long Run",
        sub:`Durchgehend lockeres Tempo · ${paceTxt(ath,"esy")} /km`,
        figs:[["Distanz",km+" km"],["Pace",paceTxt(ath,"esy")]],
        cardio:["dist","pace","time","hr"],how:"easy"});
      out.push({key:"run1",type:"free",name:"Auslaufen & Dehnen",sub:ses.run.cool,figs:[["Dauer","10 Min"]]});
    } else {
      out.push({key:"run0",type:"free",name:"Einlaufen",sub:ses.run.warm,figs:[["Dauer","10–12 Min"]]});
      const hrZiel=ses.run.hr?hrTxt(ath,ses.run.hr[0],ses.run.hr[1]):"";
      const hrPause=ses.run.hrRest?hrTxt(ath,ses.run.hrRest[0],ses.run.hrRest[1]):"";
      const figs=[["Umfang",ses.run.main]];
      if(hrZiel)figs.push(["Puls",hrZiel.replace(" bpm","")]);
      figs.push(["Pace",paceTxt(ath,z)]);
      out.push({key:"run1",type:"run",name:ses.run.main,
        sub:hrZiel
          ? `Puls ${hrZiel} · Pause ${ses.run.rest}${hrPause?" bei "+hrPause:""} · Tempo etwa ${paceTxt(ath,z)} /km`
          : `Pause dazwischen: ${ses.run.rest} · Zieltempo ${paceTxt(ath,z)} /km`,
        figs,cardio:["dist","pace","time","hr"],how:z==="ivl"?"ivl":"tmp"});
      out.push({key:"run2",type:"free",name:"Auslaufen",sub:ses.run.cool,figs:[["Dauer","8–10 Min"]]});
    }
    return out;
  }
  if(ses.circuit){
    const c=ses.circuit;
    out.push({key:"c-head",type:"free",name:`${c.rounds} Runden`,
      sub:`Zwischen den Runden ${c.rest} Pause. Innerhalb der Runde zügig durchwechseln.`,
      figs:[["Runden",String(c.rounds)],["Pause",c.rest,1]]});
    c.items.forEach((it,i)=>{
      const amount=ath==="yuan"?it.y:it.a;
      if(it.e==="run800"){
        out.push({key:"c"+i,type:"run",name:"Lauf "+amount,
          sub:"Direkt nach der Station starten · zügig, aber kontrolliert",
          figs:[["Distanz",amount],["Runden",String(c.rounds)]],cardio:["pace","hr"],how:"comp"});
        return;
      }
      out.push({key:"c"+i,type:"circuit",ex:it.e,name:EX[it.e]?.n||it.e,
        sub:`${c.rounds} Runden · je ${amount}`,amount,
        figs:[["Pro Runde",amount],["Runden",String(c.rounds)]],
        sets:c.rounds,rep:amount,lead:1});
    });
    return out;
  }
  let dropped=0;
  const dayLg2=LR(ses.date,ath);
  const push=(arr,tag)=>arr.forEach((it,i)=>{
    if(mode==="leicht"&&it.drop){dropped++;return;}
    const id=dayLg2[`${tag}${i}-exdone`]||dayLg2[`${tag}${i}-swap`]
      ||DB.swaps[`${ses.slot}-${ath}-${tag}${i}`]||it.e;
    const x=EX[id]||{n:id};
    let sets=it.s,rep=it.r,wave=null,target=0;
    if(it.sch){
      wave=waveFor(ses.date,it.sch,ses.slot,ath);
      sets=setsFor(wave.s,mode,true); rep=wave.r;
      if(!raw){const mx=bestMax(ath,id); if(mx)target=round25(mx*wave.pct);}
    } else {
      sets=setsFor(it.s,mode,tag==="L"); rep=repFor(it.r,mode,it.unit);
    }
    let pause=it.p;
    if(HYP_ATH.includes(ath)&&it.sch==="main")pause="2:30";
    out.push({key:tag+i,slotKey:`${ses.slot}-${ath}-${tag}${i}`,
      type:"lift",ex:id,orig:it.e,name:x.n,lead:(tag==="L"),unit:it.unit||"",
      rpe:it.rpe||(wave?rpeFromPct(wave.pct,rep,sets):(it.unit?0:8)),
      sets,rep,pause,pull:it.pull,how:id,extra:(tag==="X"),
      sch:it.sch,wave,target,pct:wave?wave.pct:0});
  });
  if(ses.items){
    if(ses.warm&&WARM[ses.warm]){
      const w=WARM[ses.warm];
      out.push({key:"w0",type:"warm",name:"Allgemein warm werden",
        sub:"Rudern, SkiErg oder Laufband · locker, bis die Atmung geht",
        figs:[["Dauer","5 Min"]],how:"warm_"+ses.warm});
      out.push({key:"w1",type:"warm",name:"Mobilität · "+w.mob,sub:"Gezielt für die Übungen von heute",
        figs:[["Dauer","5 Min"]],how:"warm_"+ses.warm});
    }
    const dayLg=LR(ses.date,ath);
    (ses.items||[]).forEach((it,i)=>{
      // Was tatsächlich gemacht wurde, hat Vorrang vor dem, was heute im Plan steht.
      // Sonst würde ein zurückgenommener Tausch alte Einträge umetikettieren.
      const fest=dayLg[`C${i}-exdone`];
      const sw=fest||dayLg[`C${i}-swap`]||DB.swaps[`n:${ses.n}|${ath}|C${i}`];
      const exId=sw||it.e;
      const x=EX[exId]||{n:exId};
      let sets=setsFor(it.s||3,mode),rep=repFor(it.r||"10",mode,it.unit),wave=null,target=0;
      if(it.sch){
        wave=waveForLift(ses.date,it.sch,ath,exId);
        sets=setsFor(wave.s,mode,true); rep=wave.r;
        if(!raw){const mx=bestMax(ath,exId); if(mx)target=round25(mx*wave.pct);}
      }
      out.push({key:"C"+i,type:"lift",ex:exId,orig:it.e,name:x.n,lead:!!it.sch,unit:it.unit||"",
        rpe:it.rpe||(wave?rpeFromPct(wave.pct,rep,sets):(it.unit?0:8)),
        sets,rep,pause:it.p||"1:30",how:exId,
        sch:it.sch,wave,target,pct:wave?wave.pct:0});
    });
    if(ses.warm&&WARM[ses.warm])
      out.push({key:"cd",type:"warm",name:"Cooldown & Dehnen",
        sub:WARM[ses.warm].cool.split(" · ")[0]+" …",
        figs:[["Dauer","7 Min"]],how:"cool_"+ses.warm});
    return out;
  }
  if(ses.warm&&WARM[ses.warm]){
    const w=WARM[ses.warm];
    out.push({key:"w0",type:"warm",name:"Allgemein warm werden",
      sub:"Rudern, SkiErg oder Laufband · locker, bis die Atmung geht",
      figs:[["Dauer","5 Min"]],how:"warm_"+ses.warm});
    out.push({key:"w1",type:"warm",name:"Mobilität · "+w.mob,
      sub:"Gezielt für die Übungen von heute",
      figs:[["Dauer","5 Min"]],how:"warm_"+ses.warm});
    if((ses.lead||[]).some(x=>x.sch))
      out.push({key:"w2",type:"warm",name:"Aufwärmsätze am Hauptlift",
        sub:"Leere Stange, 40, 60, 75 Prozent · zählen nicht zum Volumen",
        figs:[["Sätze","4–5"]],how:"ramp"});
  }
  push(ses.lead||[],"L");
  const vKey=(ath==="yuan"?"yuan":"yara")+(variant?"B":"A");
  push(ses[vKey]||ses[ath==="yuan"?"yuan":"yara"]||[],"A");
  if(mode==="mehr")push(ses.extra||[],"X");
  if(dropped)out._dropped=dropped;
  if(ses.finisher){
    const f=ses.finisher;
    out.push({key:"f-head",type:"free",name:"Abschluss · "+f.rounds+" Runden",
      sub:"Zügig durchwechseln, zwischen den Runden "+f.rest+" Pause. Acht Minuten, dann ist Schluss.",
      figs:[["Runden",String(f.rounds)],["Pause",f.rest,1]]});
    f.items.forEach((it,i)=>{
      const amount=ath==="yuan"?it.y:it.a;
      out.push({key:"f"+i,type:"circuit",ex:it.e,name:EX[it.e]?.n||it.e,
        sub:f.rounds+" Runden · je "+amount,
        figs:[["Pro Runde",amount],["Runden",String(f.rounds)]],
        sets:f.rounds,rep:amount,how:it.e});
    });
  }
  if(ses.warm&&WARM[ses.warm])
    out.push({key:"cd",type:"warm",name:"Cooldown & Dehnen",
      sub:WARM[ses.warm].cool.split(" · ")[0]+" …",
      figs:[["Dauer","7 Min"]],how:"cool_"+ses.warm});
  return out;
}

      pull:P.lat+P.bws+P.atmen,hinge:P.ober+P.hueftbeuger+P.atmen,
      mixed:P.hueftbeuger+P.brust+P.atmen}[t]||P.atmen;
    return "<b>Sieben Minuten, direkt nach der letzten Übung:</b>"+figs+
      "<b>Warum es sich lohnt:</b> Dehnen macht dich nicht beweglicher, wenn du es einmal machst – aber viermal pro Woche über Monate schon. Und der Puls kommt kontrolliert runter statt im Auto.";

  let base=RUNHOW[k]||EX[k]?.h||"";
  if(eq){
    const def=EQDEF[eq], spec=(EXVAR[k]&&EXVAR[k][eq])||EQNOTE[eq];
    if(def||spec)base+=`<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">

  }
  return base;
}

function pathState(ath,ex){
  const bw=DB.bw[ath]||70, mx=bestMax(ath,ex), p=PATHS[ex];
  let cur=-1;
  p.steps.forEach((s,i)=>{if(mx>=s.m*bw)cur=i;});
  const next=p.steps[cur+1]||null;
  return {bw,mx,cur,next,ratio:mx?+(mx/bw).toFixed(2):0,
    toGo:next?Math.max(0,Math.round(next.m*bw-mx)):0};
}

/* Grobe Dauer einer Einheit in Minuten */
function estDuration(items){
  const sec=p=>{const a=String(p||"1:30").split(":");return (+a[0])*60+(+a[1]);};
  let t=0;
  items.forEach(it=>{
    if(it.type==="lift"||it.type==="circuit")t+=it.sets*(40+sec(it.pause));
    else if(it.type==="warm")t+=(it.key==="w2")?300:(it.key==="cd")?420:300;
    else if(it.type==="run")t+=it.figs&&/Min/.test(String(it.figs[0][1]))?0:0;
  });
  return Math.round(t/60/5)*5||45;
}

/* Letzte Ausführung derselben Übung: Datum, alle Sätze, Kennzahlen */
function lastPerf(ath,exId,beforeDate){
  const dates=Object.keys(DB.log).filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){
    const ses=sessionFor(d,ath);
    if(ses.k!=="kraft")continue;
    const items=buildSession(ses,ath,true);
    for(const it of items){
      if(it.ex!==exId||(it.type!=="lift"&&it.type!=="circuit"))continue;
      const lg=LR(d,ath);
      let sets=[];
      for(let s=1;s<=(it.sets||3)+2;s++){
        if(lg[`${it.key}-x${s}`]){sets.push({skip:1});continue;}
        const w=parseFloat(lg[`${it.key}-w${s}`]), r=parseInt(lg[`${it.key}-r${s}`],10);
        const t=lg[`${it.key}-t${s}`];
        if(t)sets.push({t,r:isNaN(r)?null:r});
        else if(!isNaN(w)||!isNaN(r))sets.push({w:isNaN(w)?null:w,r:isNaN(r)?null:r});
      }
      const done=sets.filter(x=>!x.skip&&x.r!=null);
      if(!done.length&&!sets.length)continue;
      const ws=done.map(x=>x.w).filter(x=>x!=null);
      const rs=done.map(x=>x.r);
      return {date:d,sets,unit:it.unit||"",
        top:ws.length?Math.max(...ws):0,
        minR:rs.length?Math.min(...rs):0,
        maxR:rs.length?Math.max(...rs):0,
        avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0,
        all:rs.length};
    }
  }
  return null;
}
const repBounds=r=>{
  const p=String(r).split("–").map(x=>parseInt(x,10));
  const lo=p[0]||10, hi=p[1]||p[0]||10;
  return {lo,hi};
};
/* Doppelte Progression: erst Wiederholungen hoch, dann Gewicht.
   Das ist die verlässlichste Methode, um über Monate zu steigern. */
function progression(ath,it,date,eqJetzt){
  if(it.sch)return null;                       // Hauptlifts laufen über die Welle
  if(!it.sets||it.unit)return null;
  if(isErg(LR(date,ath)[it.key+"-eq"]))return null;
  const {lo,hi}=repBounds(it.rep);
  /* Ein Vorschlag aus der Chest Press taugt nicht für die Langhantel.
     Deshalb zuerst die letzte Ausführung am selben Gerät suchen. */
  let p=eqJetzt?lastPerf(ath,it.ex,date,eqJetzt):null;
  const alle=lastPerf(ath,it.ex,date);
  if(!p&&alle&&alle.all&&eqJetzt&&alle.eq&&alle.eq!==eqJetzt)
    return {kg:0,txt:`An ${eqLabel(eqJetzt)} noch nichts eingetragen. Zuletzt ${alle.top} kg an ${eqLabel(alle.eq)} – such hier ein Gewicht für ${hi} saubere Wiederholungen.`};
  if(!p)p=alle;
  if(!p||!p.all)return {kg:0,txt:`Erstes Mal – such ein Gewicht, bei dem ${hi} Wiederholungen gerade noch sauber gehen.`};
  if(!p.top)return {kg:0,txt:`Letztes Mal ohne Gewichtsangabe. Trag es diesmal mit ein, dann rechnet die App weiter.`};
  const amGeraet=p.eq?` an ${eqLabel(p.eq)}`:"";
  const inc=p.top<20?1.25:p.top<40?2.5:5;
  if(p.minR>=hi)
    return {kg:p.top+inc,txt:`Letztes Mal${amGeraet} alle Sätze auf ${hi} – heute ${(p.top+inc).toLocaleString("de-DE")} kg und zurück auf ${lo} Wiederholungen.`};
  if(p.maxR<lo)
    return {kg:Math.max(inc,p.top-inc),txt:`Letztes Mal${amGeraet} nur ${p.maxR} statt ${lo} – heute ${Math.max(inc,p.top-inc).toLocaleString("de-DE")} kg, dafür sauber.`};
  // Starker Abfall über die Sätze: das Einstiegsgewicht war zu hoch
  if(p.all>=2&&p.minR<=Math.ceil(lo*0.6)){
    const red=Math.max(inc,Math.round((p.top-inc)*2)/2);
    return {kg:red,txt:`Letztes Mal${amGeraet} fiel es von ${p.maxR} auf ${p.minR} ab – das Startgewicht war zu hoch. Heute ${red.toLocaleString("de-DE")} kg und alle Sätze auf ${lo}.`};
  }
  return {kg:p.top,txt:`Gewicht halten bei ${p.top.toLocaleString("de-DE")} kg${amGeraet} und je Satz eine Wiederholung mehr als letztes Mal.`};
}
/* Kurzfassung der letzten Ausführung für die Übungskarte */
function lastLine(ath,it,date){
  const p=lastPerf(ath,it.ex,date);
  if(!p)return "";
  const dt=new Date(p.date+"T12:00:00");
  const diff=Math.round((new Date(date+"T12:00:00")-dt)/86400000);
  const when=diff===1?"gestern":diff<14?`vor ${diff} Tagen`:dt.toLocaleDateString("de-DE",{day:"numeric",month:"short"});
  const txt=p.sets.map(s=>s.skip?"–":
    s.t?(s.t+(s.r!=null?" / "+s.r+" m":"")):
    (s.w!=null?s.w+(p.unit?"":" kg"):"")+(s.r!=null?(s.w!=null?" × ":"")+s.r+(p.unit?" "+p.unit:""):"")).join(" · ");
  return `<div class="lastl"><span class="lw">Letztes Mal ${when}</span> ${esc(txt)}</div>`;
}

function suggest(ath,it,date){
  if(it.type!=="lift"||!it.sets)return "";
  const p=lastPerf(ath,it.ex,date);
  if(!p||!p.top)return "";
  const target=parseInt(String(it.rep).split("–").pop(),10)||8;
  const inc=p.top<40?2.5:5;
  if(p.avgR>=target)return `${p.top+inc} kg – letztes Mal ${p.top} kg bei ${Math.round(p.avgR)} Wdh`;
  if(p.avgR&&p.avgR<target*0.65)return `${Math.max(2.5,p.top-inc)} kg – letztes Mal nur ${Math.round(p.avgR)} Wdh`;
  return `${p.top} kg halten – letztes Mal ${Math.round(p.avgR)} Wdh`;
}
function waveHint(it,ath){
  const w=it.wave; if(!w)return "";
  const pc=Math.round(w.pct*100);
  const hyp=HYP_ATH.includes(ath);
  const label=hyp?w.n:(w.n+"swoche");
  if(it.target)return `${label} · ${it.sets} × ${it.rep} mit ${it.target} kg (${pc} % vom geschätzten Maximum)`;
  return `${label} · ${it.sets} × ${it.rep} bei etwa ${pc} % · trag dein Maximum im Profil ein, dann rechnet die App das Gewicht aus`;
}

/* Epley */
const e1rm=(w,r)=>w*(1+r/30);

/* Bestes geschätztes Maximum: eingetragener Wert oder aus dem Protokoll */
function bestMax(ath,exId){
  const ck=ath+"|"+exId;
  if(_mxCache[ck]!==undefined)return _mxCache[ck];
  let best=(DB.maxes&&DB.maxes[ath]&&DB.maxes[ath][exId])?+DB.maxes[ath][exId]:0;
  Object.keys(DB.log).forEach(d=>{
    const ses=sessionFor(d,ath); if(ses.k!=="kraft")return;
    const lg=LR(d,ath);
    buildSession(ses,ath,true).forEach(it=>{
      if(it.ex!==exId||it.type!=="lift")return;
      for(let s=1;s<=(it.sets||0)+2;s++){
        if(lg[`${it.key}-x${s}`])continue;
        const w=parseFloat(lg[`${it.key}-w${s}`]), r=parseInt(lg[`${it.key}-r${s}`],10);
        if(!isNaN(w)&&!isNaN(r)&&r<=12){const v=e1rm(w,r); if(v>best)best=v;}
      }
    });
  });
  _mxCache[ck]=best;
  return best;
}
/* Rundung auf die kleinste darstellbare Scheibe */
const round25=v=>Math.round(v/2.5)*2.5;
/* Wie oft war dieser Platz vor dem Stichtag schon dran?
   Die Welle hängt an der Anzahl der Einheiten, nicht an der Kalenderwoche –
   sonst werden Stufen übersprungen, weil ein Platz nur alle rund zwölf Tage kommt. */
/* Wie oft war dieser Hauptlift vor dem Stichtag schon dran?
   Nötig, weil sich Kniebeuge und Kreuzheben abwechseln – die Welle muss
   pro Lift zählen, nicht nach Kalenderwochen. */
const _liftCnt={};
function liftItemsOf(entry){
  if(!entry)return [];
  if(entry.fix==="preset")return (PRESETS[entry.ix]||{}).items||[];
  if(entry.fix==="tpl")return (((DB.templates||[]).find(t=>t.name===entry.name))||{}).items||[];
  if(entry.slot!==undefined&&SLOTS[entry.slot])return SLOTS[entry.slot].lead||[];
  return [];
}
function liftCount(ath,exId,dateStr){
  const ck=ath+"|"+exId+"|"+dateStr+"|"+DB.start;
  if(_liftCnt[ck]!==undefined)return _liftCnt[ck];
  const m=buildSchedule(dateStr,ath);
  let c=0;
  Object.keys(m).forEach(d=>{
    if(d>=dateStr)return;
    liftItemsOf(m[d]).forEach(it=>{if(it.sch==="main"&&it.e===exId)c++;});
  });
  _liftCnt[ck]=c;
  return c;
}
/* Versatz, wenn eine Welle übersprungen wurde – etwa weil schwerer
   gearbeitet wurde als geplant. Wird unter Profil gesetzt. */
const WAVE_OFF_DEF={yuan:{bench:1}};
function waveOffset(ath,exId){
  const o=(DB.waveOff||{})[ath];
  if(o&&o[exId]!==undefined)return o[exId];
  return (WAVE_OFF_DEF[ath]||{})[exId]||0;
}
function waveForLift(dateStr,sch,ath,exId){
  const hyp=HYP_ATH.includes(ath);
  if(sch==="light")return hyp?WAVE_LIGHT_HYP:WAVE_LIGHT;
  const n=liftCount(ath,exId,dateStr)+waveOffset(ath,exId);
  const W=(hyp?WAVE_HYP:WAVE);
  return W[((n%W.length)+W.length)%W.length];
}
function waveFor(dateStr,sch,slotIx,ath){
  const hyp=HYP_ATH.includes(ath);
  if(sch==="light")return hyp?WAVE_LIGHT_HYP:WAVE_LIGHT;
  const n=(slotIx>=0)?slotCount(slotIx,dateStr,ath):weekIndex(dateStr);
  return (hyp?WAVE_HYP:WAVE)[n%4];
}

      m.className="rmon";

        (dt.getFullYear()!==new Date().getFullYear()?" "+String(dt.getFullYear()).slice(2):"");
      rail.appendChild(m);
    }
    const b=document.createElement("button");
    const vergangen=ds<todayISO();
    const eintrag=vergangen&&((DB.log[ds]||{})[me()])&&
      Object.keys((DB.log[ds]||{})[me()]).some(k=>k!=="_t");
    b.className="rtile"+(ds===todayISO()?" today":"")+(ds===selDate?" sel":"")
      +(ss.k==="rest"?" rest":" dual")+(vergangen?" past":"")+(eintrag?" filled":"");
    const short={kraft:"Kraft",lauf:"Lauf",hybrid:"Hybrid",rest:"Frei"}[ss.k];
    b.innerHTML=`<span class="cyc num">${ss.cyc}</span><span class="rd">${WD[dt.getDay()]}</span>
      <span class="rn num">${dt.getDate()}</span><span class="rk">${short}</span>`;
    b.onclick=()=>{selDate=ds;render();};
    rail.appendChild(b);
  }
  const act=rail.querySelector(".sel");
  if(act)rail.scrollLeft=Math.max(0,act.offsetLeft-110);
  // Sprungleiste: zu heute und zu einem beliebigen Datum
  const jump=document.getElementById("jump");
  if(jump){
    const heute=selDate===todayISO();
    jump.innerHTML=`${heute?"":`<button id="jtoday">Heute</button>`}
      <button id="jminus">− 7 Tage</button>
      <button id="jplus">+ 7 Tage</button>
      <label class="jdate">${new Date(selDate+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}
        <input type="date" id="jpick" value="${selDate}"></label>`;
    jump.classList.toggle("off",heute);
    const schieb=n=>{const d=new Date(selDate+"T12:00:00");d.setDate(d.getDate()+n);selDate=iso(d);render();};
    document.getElementById("jtoday")?.addEventListener("click",()=>{selDate=todayISO();render();});
    document.getElementById("jminus").onclick=()=>schieb(-7);
    document.getElementById("jplus").onclick=()=>schieb(7);
    document.getElementById("jpick").onchange=e=>{if(e.target.value){selDate=e.target.value;render();}};
  }
}

        h+=`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin:-6px 0 14px">

        h+=`<div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-6px 0 14px">
