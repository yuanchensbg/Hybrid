/* ─── Trainings-Bibliothek ─── */
function newTemplate(){
  DB.templates=DB.templates||[];
  DB.templates.push({name:"Neue Vorlage",k:"kraft",warm:"mixed",items:[]});
  save();
  cuTarget={type:"tpl",ix:DB.templates.length-1};
  go("mehr","custom");
}
function editTemplate(i){cuTarget={type:"tpl",ix:i};go("mehr","custom");}
function copyPreset(i){
  const p=PRESETS[i];
  DB.templates=DB.templates||[];
  DB.templates.push({name:p.n+" (eigene)",k:"kraft",warm:p.w,
    items:JSON.parse(JSON.stringify(p.items))});
  save();cuTarget={type:"tpl",ix:DB.templates.length-1};go("mehr","custom");
}
function dupTemplate(i){
  const t=DB.templates[i];
  DB.templates.push(Object.assign({},JSON.parse(JSON.stringify(t)),{name:t.name+" Kopie"}));
  save();rTemplates();toast("Kopie angelegt");
}
function placeDialog(i){
  const t=(DB.templates||[])[i];
  if(!t)return;
  let m=`<h3>${esc(t.name)} einsetzen</h3>
    <p style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-bottom:12px">
    An welchem Tag soll dieses Training stehen? Der geplante Tag wird dadurch ersetzt,
    du kannst ihn später wieder zurücksetzen.</p>`;
  for(let k=0;k<14;k++){
    const dt=new Date();dt.setDate(dt.getDate()+k);
    const ds=iso(dt), s=sessionFor(ds,me());
    m+=`<button class="btn" onclick="placeOn('${ds}',${i})" style="justify-content:space-between">
      <span>${WD[dt.getDay()]} ${dt.getDate()}.${dt.getMonth()+1}.</span>
      <span style="color:var(--dim);font-size:12.5px">${esc(s.n)}</span></button>`;
  }
  m+=`<div style="height:8px"></div><button class="btn" onclick="closeModal()">Abbrechen</button>`;
  showModal(m);
}
function placeOn(ds,i){
  const t=DB.templates[i], a=me();
  DB.custom=DB.custom||{};DB.custom[ds]=DB.custom[ds]||{};
  DB.custom[ds][a]={name:t.name,k:t.k||"kraft",warm:t.warm||"mixed",
    items:JSON.parse(JSON.stringify(t.items))};
  save();closeModal();
  selDate=ds;cuTarget={type:"day"};switchPage("heute");
  toast(t.name+" eingesetzt");
}
function rTemplates(){
  const tp=DB.templates||[];
  let h=back+`<h1 style="font-size:25px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px">Trainings-Bibliothek</h1>

    h+=`<div class="empty">Noch keine eigene Vorlage.<br>Leg eine an oder kopiere unten ein fertiges Training.</div>`;
  } else {
    tp.forEach((t,i)=>{
      const kg=t.items.filter(x=>exAvailable(x.e)).length;
      h+=`<div class="ex"><div class="exh">
        <div class="exn"><div class="nm">${esc(t.name)}</div>
        <div class="sb">${t.items.length} Übungen${kg<t.items.length?` · ${t.items.length-kg} im ${esc(curGym().n)} nicht verfügbar`:""}</div></div>
        <button class="ib" data-tdup="${i}" title="Kopieren">⧉</button>

        <div class="lastl">${t.items.map(x=>esc((EX[x.e]||{n:x.e}).n)).join(" · ")||"noch leer"}</div>

  h+=`<div class="sec">Fertige Trainings kopieren</div>
    <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-4px 2px 10px">

  PRESETS.forEach((p,i)=>{
    h+=`<button class="mi" data-tcopy="${i}" style="margin-bottom:6px">
      <span class="mg" style="color:var(--both)">◆</span>
      <span class="md">${esc(p.n)}<div class="ms">${p.items.length} Übungen · ${esc(p.d)}</div></span>
      <span class="ma">kopieren</span></button>`;
  });
  document.getElementById("p-mehr").innerHTML=h;
  document.getElementById("tnew").onclick=newTemplate;
  document.querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>editTemplate(+b.dataset.tedit));
  document.querySelectorAll("[data-tdup]").forEach(b=>b.onclick=()=>dupTemplate(+b.dataset.tdup));
  document.querySelectorAll("[data-tplace]").forEach(b=>b.onclick=()=>placeDialog(+b.dataset.tplace));
  document.querySelectorAll("[data-tcopy]").forEach(b=>b.onclick=()=>copyPreset(+b.dataset.tcopy));
}

/* ─── Check-in ─── */
let ciDate=null;
function rCheckin(){
  const a=me(), d=ciDate||todayISO();
  DB.checkins[a]=DB.checkins[a]||{};
  const c=DB.checkins[a][d]||{};
  const sc=(k,v)=>[1,2,3,4,5].map(n=>`<button data-ci="${k}" data-cv="${n}" class="${v==n?"sel":""}">${n}</button>`).join("");
  let strip="";
  for(let i=13;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const k=iso(dt), e=DB.checkins[a][k];
    const fil=e&&(e.sleep||e.energy||e.sore||e.bw);
    strip+=`<button class="dchip${k===d?" sel":""}${fil?" fil":""}" data-dt="${k}">
      <span class="dw">${WD[dt.getDay()]}</span><span class="dn num">${dt.getDate()}</span>
      ${fil?'<i></i>':'<span style="height:4px"></span>'}</button>`;
  }
  const rd=(c.sleep&&c.energy)?Math.round(((+c.sleep)+(+c.energy)+(6-(c.sore||3)))/15*100):null;
  let h=back+`<h1 class="cond" style="font-size:25px;margin-bottom:5px">Check-in</h1>
    <div style="font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:12px">
    Dreißig Sekunden am Tag. Wenn die Gewichte stagnieren, steht hier meist der Grund.</div>
    <div class="dstrip">${strip}</div>
    <div style="font-size:13px;color:${d===todayISO()?"var(--me)":"var(--mid)"};margin-bottom:12px">
    ${d===todayISO()?"Heute":new Date(d+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div>`;
  if(rd!==null)h+=`<div class="card"><div class="lbl">Bereitschaft</div>
    <div class="big num">${rd}<small> von 100</small></div>
    <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin-top:7px">${
      rd>=75?"Guter Tag für die geplante Einheit, gern auch etwas mehr Gewicht."
      :rd>=50?"Normal trainieren, aber nicht auf Rekordjagd gehen."
      :"Heute reduzieren: ein Satz weniger, zehn Prozent runter. Besser so als gar nicht."}</div></div>`;
  h+=`<div class="card">
      <div class="frow"><label>Schlaf · 1 schlecht bis 5 top</label><div class="scale">${sc("sleep",c.sleep)}</div></div>
      <div class="frow"><label>Energie</label><div class="scale">${sc("energy",c.energy)}</div></div>
      <div class="frow"><label>Muskelkater · 1 keiner bis 5 stark</label><div class="scale">${sc("sore",c.sore)}</div></div>
      <div class="frow"><label>Körpergewicht in kg</label>
        <input class="inp num" type="number" inputmode="decimal" id="cbw" value="${c.bw||""}" style="width:100%"></div>
      <div class="frow" style="margin-bottom:0"><label>Notiz</label>
        <textarea class="ta" id="cnote" style="min-height:56px" placeholder="Knie zwickt, schlecht geschlafen, …">${esc(c.note||"")}</textarea></div>
    </div>`;
  const keys=Object.keys(DB.checkins[a]).filter(k=>{const e=DB.checkins[a][k];
    return e&&(e.sleep||e.energy||e.sore||e.bw||e.note);}).sort().reverse().slice(0,14);
  if(keys.length){
    const avg=f=>{const v=keys.map(k=>DB.checkins[a][k][f]).filter(Boolean);
      return v.length?(v.reduce((x,y)=>x+ +y,0)/v.length).toFixed(1):"–";};
    h+=`<div class="card"><h4>Durchschnitt der letzten ${keys.length} Einträge</h4>
      <div class="r3">
      <div><div class="lbl">Schlaf</div><div style="font-size:21px;font-weight:700" class="num">${avg("sleep")}</div></div>
      <div><div class="lbl">Energie</div><div style="font-size:21px;font-weight:700" class="num">${avg("energy")}</div></div>
      <div><div class="lbl">Kater</div><div style="font-size:21px;font-weight:700" class="num">${avg("sore")}</div></div>
      </div></div>`;
    const bws=keys.filter(k=>DB.checkins[a][k].bw).sort().map((k,i)=>({w:i,v:parseFloat(DB.checkins[a][k].bw)}));
    if(bws.length>1)h+=`<div class="card"><h4>Körpergewicht</h4>${lineChart(bws,"#E8C547")}</div>`;
    h+=`<div class="sec">Verlauf</div>`;
    keys.forEach(k=>{const e=DB.checkins[a][k];
      h+=`<div class="pentry"><div class="pd">${new Date(k+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}</div>
      Schlaf ${e.sleep||"–"} · Energie ${e.energy||"–"} · Kater ${e.sore||"–"}${e.bw?" · "+e.bw+" kg":""}
      ${e.note?`<div style="font-style:italic;margin-top:3px">"${esc(e.note)}"</div>`:""}</div>`;});
  }
  document.getElementById("p-mehr").innerHTML=h;
  const st=document.querySelector(".dstrip");if(st)st.scrollLeft=st.scrollWidth;
  document.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{ciDate=b.dataset.dt;rCheckin();});
  document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{
    const e=DB.checkins[a][d]||{};
    e[b.dataset.ci]=(e[b.dataset.ci]==+b.dataset.cv)?null:+b.dataset.cv;
    if(!e[b.dataset.ci])delete e[b.dataset.ci];
    DB.checkins[a][d]=e;saveCheck(a,d);rCheckin();});
  document.getElementById("cbw").oninput=e=>{const x=DB.checkins[a][d]||{};
    x.bw=e.target.value;DB.checkins[a][d]=x;
    if(e.target.value&&d===todayISO())DB.bw[a]=parseFloat(e.target.value);saveCheck(a,d);};
  document.getElementById("cnote").oninput=e=>{const x=DB.checkins[a][d]||{};
    x.note=e.target.value;DB.checkins[a][d]=x;saveCheck(a,d);};
}

/* ─── Rechner ─── */
function rRechner(){
  let h=back+`<h1 class="cond" style="font-size:25px;margin-bottom:16px">Rechner</h1>
    <div class="card"><h4>Maximalkraft schätzen</h4>
      <div class="r2">
        <div><div class="lbl">Gewicht</div><input class="inp num" type="number" inputmode="decimal" id="rw" placeholder="kg" style="width:100%"></div>
        <div><div class="lbl">Wiederholungen</div><input class="inp num" type="number" inputmode="numeric" id="rr" placeholder="8" style="width:100%"></div>
      </div><div id="rout" style="margin-top:13px;font-size:13px;color:var(--mid);line-height:1.85"></div></div>
    <div class="card"><h4>Scheiben auf die Stange</h4>
      <div class="r2">
        <div><div class="lbl">Zielgewicht</div><input class="inp num" type="number" inputmode="decimal" id="pw" placeholder="kg" style="width:100%"></div>
        <div><div class="lbl">Stange</div><input class="inp num" type="number" inputmode="decimal" id="pb" value="20" style="width:100%"></div>
      </div><div id="pout" style="margin-top:13px;font-size:14px;line-height:1.7"></div></div>
    <div class="card"><h4>Pace und Zeit</h4>
      <div class="r2">
        <div><div class="lbl">Distanz km</div><input class="inp num" type="number" inputmode="decimal" id="dk" placeholder="10" style="width:100%"></div>
        <div><div class="lbl">Pace min:sek</div><input class="inp" id="dp" placeholder="5:30" style="width:100%"></div>
      </div><div id="dout" style="margin-top:13px;font-size:14px;line-height:1.7"></div></div>`;
  document.getElementById("p-mehr").innerHTML=h;
  const c1=()=>{const w=parseFloat(document.getElementById("rw").value),r=parseInt(document.getElementById("rr").value,10);
    const o=document.getElementById("rout"); if(!w||!r){o.innerHTML="";return;}
    const m=e1rm(w,r);
    o.innerHTML=`<b style="color:var(--ink);font-size:21px">${m.toFixed(1)} kg</b> geschätztes Maximum<br><br>
      90 % → ${(m*.9).toFixed(1)} kg · etwa 4 Wiederholungen<br>
      85 % → ${(m*.85).toFixed(1)} kg · etwa 6<br>
      80 % → ${(m*.8).toFixed(1)} kg · etwa 8<br>
      75 % → ${(m*.75).toFixed(1)} kg · etwa 10`;};
  document.getElementById("rw").oninput=c1;document.getElementById("rr").oninput=c1;
  const c2=()=>{const t=parseFloat(document.getElementById("pw").value),b=parseFloat(document.getElementById("pb").value)||20;
    const o=document.getElementById("pout"); if(!t){o.innerHTML="";return;}
    if(t<b){o.innerHTML=`<span style="color:var(--warn)">Weniger als die Stange.</span>`;return;}
    let rest=(t-b)/2,used=[];
    [25,20,15,10,5,2.5,1.25].forEach(p=>{const n=Math.floor(rest/p);if(n>0){used.push(`${n} × ${p}`);rest-=n*p;}});
    o.innerHTML=`<b style="color:var(--me)">Pro Seite:</b> ${used.join(" + ")||"nichts"}<br>
      <span style="color:var(--dim);font-size:12.5px">Ergibt ${(t-rest*2).toFixed(2)} kg${rest>.01?` · ${rest.toFixed(2)} kg pro Seite nicht darstellbar`:""}</span>`;};
  document.getElementById("pw").oninput=c2;document.getElementById("pb").oninput=c2;
  const c3=()=>{const k=parseFloat(document.getElementById("dk").value),p=document.getElementById("dp").value;
    const o=document.getElementById("dout"); const m=p.match(/^(\d+):(\d{1,2})$/);
    if(!k||!m){o.innerHTML="";return;}
    const sec=(+m[1]*60+ +m[2])*k, hh=Math.floor(sec/3600), mm=Math.floor(sec%3600/60), ss=Math.round(sec%60);
    o.innerHTML=`<b style="color:var(--me)">${hh?hh+":"+String(mm).padStart(2,"0"):mm}:${String(ss).padStart(2,"0")}</b> Gesamtzeit
      <br><span style="color:var(--dim);font-size:12.5px">${(60/(+m[1]+ +m[2]/60)).toFixed(2)} km/h</span>`;};
  document.getElementById("dk").oninput=c3;document.getElementById("dp").oninput=c3;
}

  plShow();
  woResumeShow();
}

/* ─── Protokoll & Archiv ─── */
let pDay=null;
function rProtokoll(){
  if(pDay)return rProtokollDay(pDay);
  const a=me();
  const dates=Object.keys(DB.log).sort().reverse();
  let h=back+`<h1 class="cond" style="font-size:25px;margin-bottom:5px">Protokoll</h1>
    <div style="font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:16px">
    Jede erfasste Einheit. Antippen zum Nachbearbeiten – auch Wochen später.</div>
    <button class="btn btn-go" id="pwa">Letzte 14 Tage an WhatsApp</button>
    <button class="btn" id="psh">Anders teilen</button>
    <button class="btn" id="pco">An Coach Marcus schicken</button>
    <button class="btn" id="pfull">Vollständigen Verlauf für den Coach erzeugen</button>
    <div class="card" style="margin-top:6px">
      <div class="lbl">Feste WhatsApp-Nummer</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.55;margin-bottom:9px">Mit Ländervorwahl ohne Plus, etwa 436641234567. Dann geht der Chat direkt auf.</div>
      <input class="inp" id="wanum" inputmode="tel" placeholder="436641234567" value="${esc(DB.waNum||"")}" style="width:100%"></div>
    <div class="sec">Einheiten</div>`;
  let any=false;
  dates.forEach(d=>{
    const r=reportDay(d,a); if(!r)return; any=true;
    const ses=sessionFor(d), dt=new Date(d+"T12:00:00");
    const head=r.split("\n")[0];
    h+=`<button class="wkc" data-pd="${d}"><div class="wnum num">${ses.cyc}</div>
      <div class="wd">${WD[dt.getDay()]} ${dt.getDate()}.${dt.getMonth()+1}. · ${ses.n}
      <div class="wss">${esc(head.split(": ").pop())}</div></div><span style="color:var(--dim)">›</span></button>`;
  });
  if(!any)h+=`<div class="empty">Noch nichts erfasst.<br>Trag Gewichte oder Laufdaten ein, dann erscheint die Einheit hier.</div>`;
  document.getElementById("p-mehr").innerHTML=h;
  document.getElementById("pwa").onclick=()=>waSend(buildReport(14));
  document.getElementById("psh").onclick=()=>shareText(buildReport(14));
  document.getElementById("pco").onclick=()=>{
    if(!DB.keys[DB.prov]){switchPage("coach");toast("Erst einen Anbieter verbinden");return;}
    switchPage("coach");setTimeout(()=>sendChat("Analysiere mein Protokoll und sag mir konkret, was ich in den nächsten Einheiten anpassen soll."),200);};
  document.getElementById("pfull").onclick=()=>{
    const t=fullExport();
    showModal(`<h3>Vollständiger Verlauf</h3>
      <p style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-bottom:10px">
      Enthält alles: Wettkampf und Phase, aktuelle Wochenstruktur, getauschte und selbst angelegte
      Übungen, eigene Vorlagen, Rahmendaten, Gyms, Übungsverlauf je Übung, Laufeinheiten,
      Messungen, Check-ins, Wochenbilanz und Notizen.</p>
      <textarea class="ta" id="fullta" style="min-height:260px;font-size:12px">${esc(t)}</textarea>
      <button class="btn btn-go" onclick="copyFull()">In Zwischenablage kopieren</button>
      <button class="btn" onclick="shareFull()">Teilen</button>
      <button class="btn" onclick="closeModal()">Schließen</button>`);};
  document.getElementById("wanum").oninput=e=>{DB.waNum=e.target.value;save();};
  document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>{pDay=b.dataset.pd;rProtokoll();scrollTop();});
}
function rProtokollDay(d){
  const a=me(), ses=sessionFor(d), items=buildSession(ses,a), lg=L(d,a);
  const dt=new Date(d+"T12:00:00");
  let h=`<button class="back" onclick="pDay=null;rProtokoll();scrollTop()">← Protokoll</button>
    <h1 class="cond" style="font-size:25px;margin-bottom:5px">${ses.n}</h1>
    <div style="font-size:13px;color:var(--mid);margin-bottom:16px">
    ${WDL[dt.getDay()]}, ${dt.getDate()}.${dt.getMonth()+1}.${dt.getFullYear()} · Zyklustag ${ses.cyc} · ${ANAME[a]}</div>`;
  items.forEach(it=>{
    if(it.type==="free")return;
    let hasData=!!lg[it.key+"-done"];
    for(let s=1;s<=(it.sets||0)+2;s++)if(lg[`${it.key}-w${s}`]||lg[`${it.key}-r${s}`]||lg[`${it.key}-x${s}`])hasData=true;
    if(it.cardio)it.cardio.forEach(f=>{if(lg[`${it.key}-c-${f}`])hasData=true;});
    if(!hasData)return;
    h+=`<div class="ex"><div class="exh"><div class="exn"><div class="nm">${esc(it.name)}</div>
      ${lg[it.key+"-eq"]?`<div class="sb">${esc(eqLabel(lg[it.key+"-eq"]))}</div>`:""}</div></div><div class="trk">`;
    for(let s=1;s<=(it.sets||0)+2;s++){
      if(!lg[`${it.key}-w${s}`]&&!lg[`${it.key}-r${s}`]&&!lg[`${it.key}-x${s}`])continue;
      h+=`<div class="erow${lg[`${it.key}-x${s}`]?" skipped":""}">
        <span class="sn" style="display:grid;place-items:center;cursor:default">${s}</span>
        <input class="inp num" type="number" placeholder="kg" data-ed="${it.key}-w${s}" value="${esc(lg[`${it.key}-w${s}`]||"")}"><span class="u">kg</span>
        <input class="inp num" type="number" placeholder="${it.unit||"Wdh"}" data-ed="${it.key}-r${s}" value="${esc(lg[`${it.key}-r${s}`]||"")}"><span class="u">${it.unit||"Wdh"}</span></div>`;
    }
    if(it.cardio){
      const CF={dist:["Distanz","km"],pace:["Pace","/km"],time:["Dauer","min"],hr:["Ø Puls","bpm"]};
      it.cardio.forEach(f=>h+=`<div class="erow"><span class="elbl">${CF[f][0]}</span>
        <input class="inp num" data-ed="${it.key}-c-${f}" value="${esc(lg[`${it.key}-c-${f}`]||"")}"><span class="u">${CF[f][1]}</span></div>`);
    }
    h+=`</div></div>`;
  });
  h+=`<div class="sec">Notiz</div><textarea class="ta" data-ed="notes">${esc(lg.notes||"")}</textarea>
    <div style="height:12px"></div>
    <button class="btn btn-go" id="dwa">Diese Einheit an WhatsApp</button>
    <button class="btn btn-r" id="ddel">Einheit löschen</button>`;
  document.getElementById("p-mehr").innerHTML=h;
  document.querySelectorAll("[data-ed]").forEach(el=>el.oninput=()=>{
    const k=el.dataset.ed;
    if(el.value)lg[k]=el.value;else delete lg[k];
    save();});
  document.getElementById("dwa").onclick=()=>waSend(`Trainingsprotokoll ${ANAME[a]}\n\n`+(reportDay(d,a)||""));
  document.getElementById("ddel").onclick=()=>showModal(
    `<h3>Einheit löschen?</h3><p style="font-size:13.5px;color:var(--mid);line-height:1.65;margin-bottom:14px">
    Alle Eintragungen von ${ANAME[a]} an diesem Tag werden entfernt. Die Einheit des anderen bleibt bestehen.</p>
    <button class="btn btn-r" onclick="delDay('${d}')">Ja, löschen</button>
    <button class="btn" onclick="closeModal()">Abbrechen</button>`);
}
function delDay(d){
  if(DB.log[d])delete DB.log[d][me()];
  if(DB.log[d]&&!Object.keys(DB.log[d]).length)delete DB.log[d];
  save();closeModal();pDay=null;rProtokoll();toast("Gelöscht");
}

/* ══════════ VOLLSTÄNDIGER VERLAUF ALS TEXT ══════════
   Für die Übergabe an den Coach: alles, was zur Plananpassung nötig ist,
   in lesbarer Form statt als Rohdaten. */
function fullExport(){
  const out=[];
  const bi=blockInfo(todayISO());
  out.push("TANDEM – Vollständiger Verlauf");
  out.push("Stand "+new Date().toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"}));
  out.push("App-Fassung "+BUILD.nr+" vom "+BUILD.datum);
  out.push("Zyklusstart "+new Date(DB.start+"T12:00:00").toLocaleDateString("de-DE")+
    " · Block "+bi.block+", Woche "+bi.week+" von "+BLOCKW);
  out.push("");
  out.push("── WETTKAMPF UND PHASE ──");
  ATH.forEach(a=>{
    const ri=raceInfo(a);
    if(!ri){out.push(`${ANAME[a]}: kein Wettkampf eingetragen`);return;}
    if(ri.past){out.push(`${ANAME[a]}: ${ri.r.name} liegt ${Math.abs(ri.days)} Tage zurück`);return;}
    out.push(`${ANAME[a]}: ${ri.r.name} am ${new Date(ri.r.date+"T12:00:00").toLocaleDateString("de-DE")}`+
      ` · noch ${ri.days} Tage · Phase ${ri.phase.n}`+(phaseAuto(a)?" (Automatik aktiv)":" (von Hand gesetzt)"));
  });
  out.push("");
  out.push("── REISEN ──");
  const tl=travels().filter(x=>x.bis>=DB.start);
  if(!tl.length)out.push("  keine");
  else tl.forEach(t=>out.push("  "+t.n+": "+new Date(t.von+"T12:00:00").toLocaleDateString("de-DE")+
    " bis "+new Date(t.bis+"T12:00:00").toLocaleDateString("de-DE")+" · "+(t.wer||ATH).map(x=>ANAME[x]).join(", ")));
  out.push("");
  out.push("── AKTUELLE WOCHENSTRUKTUR ──");
  ATH.forEach(a=>{
    const c=cyc(a);
    out.push(`${ANAME[a]} – ${c.mode==="roll"?"wandernder Zyklus":c.mode==="fix"?"feste Wochenbelegung":"rollierende Woche"}:`);
    if(c.mode==="roll"){
      rollPlanOf(a).forEach((v,i)=>out.push(`  Tag ${i+1}: ${entryLabel(v)[0]}`));
    } else {
      [1,2,3,4,5,6,0].forEach(wd=>{
        const d=new Date();d.setDate(d.getDate()+((wd-d.getDay())+7)%7);
        out.push(`  ${WDL[wd]}: ${sessionFor(iso(d),a).n}`);
      });
    }
  });
  out.push("");
  out.push("── GETAUSCHTE ÜBUNGEN ──");
  const sw=Object.keys(DB.swaps||{});
  if(!sw.length)out.push("  Dauerhaft: keine");
  else{
    out.push("  Dauerhaft:");
    sw.forEach(k=>{
      const l=swapLabel(k);
      out.push(`    ${l.ein} · ${l.pos} · ${ANAME[l.ath]||l.ath} → ${(EX[DB.swaps[k]]||{n:DB.swaps[k]}).n}`);
    });
  }
  // Einmalige Tauschvorgänge aus den Tagesprotokollen
  const einmal=[];
  Object.keys(DB.log||{}).sort().forEach(d=>{
    ATH.forEach(a=>{
      const lg=(DB.log[d]||{})[a]||{};
      Object.keys(lg).forEach(k=>{
        if(!k.endsWith("-swap"))return;
        const ses=sessionFor(d,a);
        const it=buildSession(ses,a,true).find(x=>x.key===k.replace("-swap",""));
        einmal.push(`    ${d.slice(5)} ${ANAME[a]} · ${ses.n} → ${(EX[lg[k]]||{n:lg[k]}).n}`+
          (it&&it.orig?` (statt ${(EX[it.orig]||{n:it.orig}).n})`:""));
      });
    });
  });
  out.push("  Nur für einen Tag: "+(einmal.length?"":"keine"));
  einmal.forEach(x=>out.push(x));
  if(DB.customEx&&Object.keys(DB.customEx).length)
    out.push("  Selbst angelegte Übungen: "+Object.values(DB.customEx).map(x=>x.n).join(", "));
  // Selbst ergänzte Geräte, damit sie in künftige Fassungen übernommen werden können
  const eigEq=Object.keys(DB.customEq||{});
  if(eigEq.length){
    out.push("");
    out.push("── SELBST ERGÄNZTE GERÄTE ──");
    eigEq.forEach(t=>{
      const bei=Object.keys(DB.exEq||{}).filter(ex=>(DB.exEq[ex]||[]).includes(t))
        .map(ex=>(EX[ex]||{n:ex}).n);
      const gyms=(DB.gyms||[]).filter(g=>g.eq.includes(t)).map(g=>g.n);
      out.push(`  ${DB.customEq[t]}`+(bei.length?` · bei: ${bei.join(", ")}`:"")+
        (gyms.length?` · in: ${gyms.join(", ")}`:""));
    });
  }
  if((DB.templates||[]).length){
    out.push("");
    out.push("── EIGENE VORLAGEN ──");
    DB.templates.forEach(t=>out.push(`  ${t.name}: ${t.items.map(x=>(EX[x.e]||{n:x.e}).n+" "+x.s+"×"+x.r).join(", ")}`));
  }
  out.push("");
  out.push("── RAHMEN ──");
  ATH.forEach(a=>{
    const c=cyc(a);
    out.push(`${ANAME[a]}: ${DB.bw[a]||"?"} kg · Rhythmus ${c.mode==="roll"?SLOTS.length+" wandernde Plätze":"feste Woche"}`+
      ` · Long Run ${longRun(a,todayISO())} km (Obergrenze ${DB.longMax[a]})`);
    out.push(`  Tempozonen: locker ${paceTxt(a,"esy")} · Tempo ${paceTxt(a,"tmp")} · Intervall ${paceTxt(a,"ivl")}`);
    const bm=BIG3.map(e=>{const st=pathState(a,e);
      return st.mx?`${PATHS[e].n} ${Math.round(st.mx)} kg (${st.ratio}× KG)`:null;}).filter(Boolean);
    if(bm.length)out.push("  Bestwerte: "+bm.join(" · "));
    if(DB.pullStage[a]!==undefined)out.push("  Klimmzug-Stufe "+(DB.pullStage[a]+1)+" von "+LADDER.length);
  });
  out.push("");
  out.push("── GYMS ──");
  DB.gyms.forEach(g=>{
    out.push(g.n+" ("+g.s+"): "+g.eq.length+" Geräte");
    EQGROUPS.forEach(([t,list])=>{
      const have=list.filter(x=>g.eq.includes(x)).map(eqLabel);
      if(have.length)out.push("  "+t+": "+have.join(", "));
    });
    const cu=g.eq.filter(x=>DB.customEq&&DB.customEq[x]).map(eqLabel);
    if(cu.length)out.push("  Selbst ergänzt: "+cu.join(", "));
  });
  out.push("");
  out.push("── ÜBUNGSVERLAUF ──");
  ATH.forEach(a=>{
    const perEx={};
    Object.keys(DB.log).sort().forEach(d=>{
      const ses=sessionFor(d,a); if(ses.k!=="kraft")return;
      const lg=LR(d,a);
      buildSession(ses,a,true).forEach(it=>{
        if(it.type!=="lift"&&it.type!=="circuit")return;
        let sets=[];
        for(let s=1;s<=(it.sets||0)+2;s++){
          if(lg[`${it.key}-x${s}`])continue;
          const w=lg[`${it.key}-w${s}`], r=lg[`${it.key}-r${s}`];
          if(w||r)sets.push((w?w+(it.unit?"":"kg"):"")+(r?(w?"×":"")+r+(it.unit||""):""));
        }
        const gf=lg[`${it.key}-griff`];
        const nt=lg[`${it.key}-note`];
        if(!sets.length&&!nt)return;
        perEx[it.name]=perEx[it.name]||[];
        perEx[it.name].push(d.slice(5)+": "+(sets.join(", ")||"\u2013")+
          (gf?" ("+(GRIFFE[gf]||gf)+")":"")+(nt?" \u2013 \u201e"+nt+"\u201c":""));
      });
    });
    const keys=Object.keys(perEx);
    if(!keys.length)return;
    out.push("");
    out.push(ANAME[a]+":");
    keys.sort().forEach(n=>{
      const h2=perEx[n].slice(-8);
      out.push("  "+n+" — "+h2.join(" | "));
    });
  });
  out.push("");
  out.push("── LAUFEINHEITEN ──");
  ATH.forEach(a=>{
    const runs=[];
    Object.keys(DB.log).sort().forEach(d=>{
      const ses=sessionFor(d,a); if(ses.k!=="lauf")return;
      const lg=LR(d,a);
      buildSession(ses,a,true).forEach(it=>{
        if(!it.cardio)return;
        const km=lg[`${it.key}-c-dist`], pc=lg[`${it.key}-c-pace`], hr=lg[`${it.key}-c-hr`];
        if(km||pc)runs.push(d.slice(5)+" "+ses.n+": "+[km?km+" km":"",pc?pc+"/km":"",hr?hr+" bpm":""].filter(Boolean).join(", "));
      });
    });
    if(runs.length){out.push("");out.push(ANAME[a]+":");runs.slice(-20).forEach(r=>out.push("  "+r));}
  });
  out.push("");
  out.push("── MESSUNGEN ──");
  ATH.forEach(a=>{
    const tt=testText(a);
    if(tt)out.push(tt);
  });
  out.push("");
  out.push("── CHECK-INS ──");
  ATH.forEach(a=>{
    const ck=DB.checkins[a]||{};
    const keys=Object.keys(ck).filter(k=>ck[k]&&(ck[k].sleep||ck[k].energy||ck[k].sore||ck[k].bw)).sort().slice(-21);
    if(!keys.length)return;
    out.push("");out.push(ANAME[a]+":");
    keys.forEach(k=>{const e=ck[k];
      out.push("  "+k.slice(5)+": Schlaf "+(e.sleep||"–")+", Energie "+(e.energy||"–")+
        ", Kater "+(e.sore||"–")+(e.bw?", "+e.bw+" kg":"")+(e.note?' – "'+e.note+'"':""));});
  });
  out.push("");
  out.push("── WOCHENBILANZ ──");
  ATH.forEach(a=>{
    const W=scanWeeks(a); if(!W.length)return;
    out.push("");out.push(ANAME[a]+":");
    W.slice(-12).forEach(w=>out.push(`  Woche ${w.w+1}: ${Math.round(w.ton).toLocaleString("de-DE")} kg Tonnage · `+
      `${w.km.toFixed(1)} km · längster Lauf ${w.long.toFixed(1)} km · ${w.sets} Sätze`));
  });
  out.push("");
  out.push("── NOTIZEN ──");
  Object.keys(DB.log).sort().forEach(d=>{
    ATH.forEach(a=>{
      const lg=(DB.log[d]||{})[a]||{};
      if(lg.notes)out.push("  "+d.slice(5)+" "+ANAME[a]+" (Einheit): \u201e"+lg.notes+"\u201c");
      const ses=sessionFor(d,a);
      if(ses.k==="rest")return;
      buildSession(ses,a,true).forEach(it=>{
        const n=lg[`${it.key}-note`];
        if(n)out.push("  "+d.slice(5)+" "+ANAME[a]+" \u2013 "+it.name+": \u201e"+n+"\u201c");
      });
    });
  });
  out.push("");
  out.push("Was ich anpassen möchte: ");
  return out.join("\n");
}

/* ══════════ SYNCHRONISATION ZWISCHEN GERÄTEN ══════════
   Ohne eigenen Server: die Daten liegen als JSON in einem Ablageplatz,
   auf den beide Geräte zugreifen. Zusammengeführt wird pro Tag und Person –
   wer zuletzt an einem Tag etwas geändert hat, gewinnt für diesen Tag. */
const SYNC_SKIP=["keys","sp","sync","ciPrompt","reviewSeen","chat","padTop","padBottom","extend","autoBottom"];
function syncPayload(){
  const o={};
  Object.keys(DB).forEach(k=>{if(!SYNC_SKIP.includes(k))o[k]=DB[k];});
  o._dev=DB.sync&&DB.sync.dev||"";
  o._at=Date.now();
  return o;
}
function mergeRemote(r){
  if(!r||typeof r!=="object")return 0;
  let changed=0;
  // Protokolle: je Tag und Person den neueren Stand nehmen
  if(r.log){
    DB.log=DB.log||{};
    Object.keys(r.log).forEach(d=>{
      DB.log[d]=DB.log[d]||{};
      Object.keys(r.log[d]).forEach(a=>{
        const rem=r.log[d][a], loc=DB.log[d][a];
        if(!rem||typeof rem!=="object")return;
        if(!loc){DB.log[d][a]=rem;changed++;return;}
        if((rem._t||0)>(loc._t||0)){DB.log[d][a]=rem;changed++;}
      });
    });
  }
  // Check-ins: feldweise ergänzen, bei Konflikt zählt der neuere Eintrag
  if(r.checkins)ATH.forEach(a=>{
    if(!r.checkins[a])return;
    DB.checkins[a]=DB.checkins[a]||{};
    Object.keys(r.checkins[a]).forEach(d=>{
      const rem=r.checkins[a][d], loc=DB.checkins[a][d];
      if(!loc){DB.checkins[a][d]=rem;changed++;return;}
      if((rem._t||0)>(loc._t||0)){DB.checkins[a][d]=rem;changed++;}
    });
  });
  // Protein: der höhere Wert gewinnt, man zählt über den Tag nur hoch
  if(r.protein)ATH.forEach(a=>{
    if(!r.protein[a])return;
    DB.protein[a]=DB.protein[a]||{};
    Object.keys(r.protein[a]).forEach(d=>{
      const rem=+r.protein[a][d]||0;
      if(rem>(+DB.protein[a][d]||0)){DB.protein[a][d]=rem;changed++;}
    });
  });
  // Bestleistungen: Vereinigung über die Kennung, Gratulationen zusammenführen
  if(Array.isArray(r.prs)){
    DB.prs=DB.prs||[];
    const idx={};DB.prs.forEach(p=>idx[p.id]=p);
    r.prs.forEach(p=>{
      const lok=idx[p.id];
      if(!lok){DB.prs.push(p);changed++;return;}
      (p.cheers||[]).forEach(c=>{
        if(!(lok.cheers||[]).some(x=>x.by===c.by&&x.at===c.at)){
          lok.cheers=lok.cheers||[];lok.cheers.push(c);changed++;}
      });
      (p.seen||[]).forEach(s=>{
        lok.seen=lok.seen||[];
        if(!lok.seen.includes(s)){lok.seen.push(s);changed++;}
      });
    });
    if(DB.prs.length>120)DB.prs=DB.prs.sort((a,b)=>a.at-b.at).slice(-120);
  }
  if(r.best){
    DB.best=DB.best||{};
    ATH.forEach(a=>{
      if(!r.best[a])return;
      DB.best[a]=DB.best[a]||{};
      Object.keys(r.best[a]).forEach(ex=>{
        const rm=r.best[a][ex], lo=DB.best[a][ex];
        if(!lo||rm.e1rm>lo.e1rm){DB.best[a][ex]=rm;changed++;}
      });
    });
  }
  // Nachrichten: Vereinigung über die Kennung, gelesen bleibt gelesen
  if(Array.isArray(r.msgs)){
    DB.msgs=DB.msgs||[];
    const have={};
    DB.msgs.forEach(m=>have[m.id]=m);
    r.msgs.forEach(m=>{
      if(!have[m.id]){DB.msgs.push(m);changed++;}
      else if(m.read&&!have[m.id].read){have[m.id].read=m.read;changed++;}
    });
    if(DB.msgs.length>200)DB.msgs=DB.msgs.sort((a,b)=>a.at-b.at).slice(-200);
  }
  // Einstellungen: der zuletzt gespeicherte Stand gewinnt
  const cfg=["gyms","customEq","customEx","exEq","tests","race","travel","gh","hrmax","bestStreak","planSince","waveOff","best","cycle","start","maxes","bw","zones","longBase","longMax",
    "pullStage","swaps","waNum","archive","reviewDone","gym","templates","custom"];
  if((r.cfgTs||0)>(DB.cfgTs||0)){
    cfg.forEach(k=>{if(r[k]!==undefined){DB[k]=r[k];changed++;}});
    DB.cfgTs=r.cfgTs;
  }
  if(changed)save(true);
  return changed;
}
async function syncGet(){
  const s=DB.sync||{};
  if(s.prov==="jsonbin"){
    const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(s.binId)}/latest`,
      {headers:{"X-Master-Key":s.key,"X-Bin-Meta":"false"}});
    if(!r.ok)throw new Error("Abruf fehlgeschlagen ("+r.status+")");
    return await r.json();
  }
  if(s.prov==="url"){
    const r=await fetch(s.url,{headers:s.hdr?{Authorization:s.hdr}:{}});
    if(!r.ok)throw new Error("Abruf fehlgeschlagen ("+r.status+")");
    return await r.json();
  }
  throw new Error("Keine Synchronisation eingerichtet");
}
async function syncPut(data){
  const s=DB.sync||{};
  if(s.prov==="jsonbin"){
    const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(s.binId)}`,
      {method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":s.key},
       body:JSON.stringify(data)});
    if(!r.ok)throw new Error("Hochladen fehlgeschlagen ("+r.status+")");
    return true;
  }
  if(s.prov==="url"){
    const r=await fetch(s.url,{method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"},s.hdr?{Authorization:s.hdr}:{}),
      body:JSON.stringify(data)});
    if(!r.ok)throw new Error("Hochladen fehlgeschlagen ("+r.status+")");
    return true;
  }
  throw new Error("Keine Synchronisation eingerichtet");
}
let syncBusy=false;
/* Kurzer Fingerabdruck der eigenen Daten – damit nur hochgeladen wird,
   wenn sich wirklich etwas geändert hat. Spart Datenvolumen. */
function dataHash(o){
  // Zeitstempel und Gerätekennung raus – sonst wäre jeder Abgleich "neu"
  const kopie=Object.assign({},o);
  delete kopie._at; delete kopie._dev;
  const s=JSON.stringify(kopie);
  let x=5381;
  for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;
  return s.length+"-"+(x>>>0).toString(36);
}
async function syncNow(silent){
  const s=DB.sync||{};
  if(!s.prov||syncBusy)return;
  if(!navigator.onLine){
    if(!silent)toast("Offline – wird beim nächsten Netz abgeglichen");
    return;
  }
  syncBusy=true;
  try{
    const remote=await syncGet();
    const n=mergeRemote(remote);
    const payload=syncPayload();
    const hash=dataHash(payload);
    if(n||hash!==DB.syncHash){
      await syncPut(payload);
      DB.syncHash=hash;
    } else if(!silent){
      toast("Nichts zu senden – alles gleich");
    }
    DB.sync.last=Date.now();DB.sync.err="";save(true);
    if(!silent&&n)toast(n+" Änderung"+(n===1?"":"en")+" übernommen");
    if(n){
      const offen=unread(me());
      if(offen&&page==="mehr"&&mehrView==="msgs"){chime();rMsgs();}
      else if(offen)msgReminder();
      prReminder();
    }
  }catch(e){
    DB.sync.err=e.message||"Fehler";save(true);
    if(!silent)toast("Sync: "+DB.sync.err);
  }
  syncBusy=false;
  if(mehrView==="sync")rSync();
}

/* ══════════ PLANALTER UND STAGNATION ══════════
   Ein Mesozyklus läuft üblicherweise acht bis zwölf Wochen. Zu häufiges
   Wechseln verhindert Fortschritt, weil der gleiche Reiz nicht lange genug
   wirkt – zu seltenes führt zur Gewöhnung. Deshalb zählt hier beides:
   die Laufzeit des Plans und ob die Zahlen noch steigen. */
const PLANMIN=8, PLANMAX=12;
const planSince=a=>((DB.planSince||{})[a])||DB.start;
function planAge(a){
  return Math.floor((new Date(todayISO())-new Date(planSince(a)))/(7*86400000));
}
/* Steigen Tonnage und geschätzte Maxima noch? */
function progressTrend(a){
  const W=scanWeeks(a).filter(w=>w.ton>0);
  if(W.length<4)return {n:W.length,stale:false,txt:"Noch zu wenige Wochen für eine Aussage."};
  const last3=W.slice(-3), prev3=W.slice(-6,-3);
  if(!prev3.length)return {n:W.length,stale:false,txt:"Noch zu wenige Wochen für eine Aussage."};
  const avg=arr=>arr.reduce((s,x)=>s+x.ton,0)/arr.length;
  const a1=avg(prev3), a2=avg(last3);
  const diff=a1?Math.round((a2-a1)/a1*1000)/10:0;
  const mx=BIG3.map(e=>bestMax(a,e)).reduce((s,x)=>s+x,0);
  const stale=diff<1.5;
  return {n:W.length,diff,stale,mx,
    txt:stale
      ? `Die Tonnage liegt in den letzten drei Wochen nur ${diff>0?"+":""}${diff} % über den drei davor. Das deutet auf Gewöhnung hin.`
      : `Die Tonnage ist in den letzten drei Wochen um ${diff} % gestiegen. Der Plan wirkt noch.`};
}
function planStatus(a){
  const age=planAge(a), tr=progressTrend(a);
  if(age<PLANMIN)return {due:false,age,tr,
    t:"Läuft",d:`Der Plan läuft seit ${age} Wochen. Unter acht Wochen lohnt ein Wechsel selten – der gleiche Reiz braucht Zeit, um zu wirken.`};
  if(age>=PLANMAX)return {due:true,hard:true,age,tr,
    t:"Wechsel überfällig",d:`Der Plan läuft seit ${age} Wochen. Ab zwölf Wochen überwiegt die Gewöhnung, auch wenn die Zahlen noch stimmen.`};
  if(tr.stale)return {due:true,age,tr,
    t:"Wechsel sinnvoll",d:`Der Plan läuft seit ${age} Wochen und die Zahlen stagnieren. Jetzt ist der richtige Zeitpunkt.`};
  return {due:false,age,tr,
    t:"Läuft gut",d:`Der Plan läuft seit ${age} Wochen und die Zahlen steigen noch. Solange das so ist, gibt es keinen Grund zu wechseln – spätestens nach ${PLANMAX} Wochen aber schon.`};
}

function blockReport(){
  const bi=blockInfo(todayISO());
  const out=[`Hybrid – Überprüfung nach Block ${bi.block} (${BLOCKW} Wochen)`,
    `Zeitraum bis ${new Date().toLocaleDateString("de-DE")}`,""];
  ATH.forEach(a=>{
    const W=scanWeeks(a);
    if(!W.length){out.push(ANAME[a]+": keine Daten erfasst.","");return;}
    const first=W[0],last=W[W.length-1];
    out.push(ANAME[a]+" ("+(DB.bw[a]||"?")+" kg):");
    out.push("  Wochen mit Daten: "+W.length);
    out.push("  Tonnage zuletzt: "+Math.round(last.ton).toLocaleString("de-DE")+" kg"+
      (first!==last?" (erste erfasste Woche "+Math.round(first.ton).toLocaleString("de-DE")+" kg)":""));
    const km=W.reduce((s,x)=>s+x.km,0);
    out.push("  Laufkilometer gesamt: "+km.toFixed(1)+" km · längster Lauf "+
      Math.max(...W.map(x=>x.long)).toFixed(1)+" km");
    BIG3.forEach(ex=>{
      const st=pathState(a,ex);
      if(st.mx)out.push("  "+PATHS[ex].n+": "+Math.round(st.mx)+" kg = "+st.ratio+
        "× Körpergewicht · Stufe "+(st.cur+1)+" von "+PATHS[ex].steps.length);
    });
    const ck=DB.checkins[a]||{}, keys=Object.keys(ck).filter(k=>ck[k]&&(ck[k].sleep||ck[k].energy));
    if(keys.length){
      const avg=f=>{const v=keys.map(k=>ck[k][f]).filter(Boolean);
        return v.length?(v.reduce((x,y)=>x+ +y,0)/v.length).toFixed(1):"–";};
      out.push("  Check-in Schnitt: Schlaf "+avg("sleep")+", Energie "+avg("energy")+", Muskelkater "+avg("sore"));
    }
    const pw=DB.pullStage[a];
    if(pw!==undefined)out.push("  Klimmzug-Stufe: "+(pw+1)+" von "+LADDER.length);
    out.push("");
  });
  out.push("Gyms:");
  DB.gyms.forEach(g=>out.push("  "+g.n+": "+g.eq.length+" Geräte"));
  if(DB.customEq&&Object.keys(DB.customEq).length)
    out.push("  Selbst ergänzt: "+Object.values(DB.customEq).join(", "));
  out.push("","Was ich anpassen möchte: ");
  return out.join("\n");
}

/* ══════════ DIKTIEREN ══════════
   Drei Wege: die eingebaute Spracherkennung des Browsers, danach optional
   eine Nachbearbeitung durch Gemini, oder – falls der Browser nichts kann –
   eine Aufnahme, die Gemini direkt transkribiert. */
let dictRec=null, dictMR=null, dictChunks=[], dictKey=null;

function dictMsg(k,txt,warn){
  const el=document.getElementById("nh-"+k);
  if(el)el.innerHTML=warn?`<span style="color:var(--warn)">${esc(txt)}</span>`:esc(txt);
}
function dictWrite(k,txt){
  const ta=(k==="msg")?document.getElementById("msgin")
    :(document.querySelector(`[data-nex="${k}"]`)||document.querySelector(`[data-wnex="${k}"]`));
  if(!ta)return;
  ta.value=(ta.value?ta.value.replace(/\s+$/,"")+" ":"")+txt;
  if(k==="msg")return;
  const inWO=document.getElementById("wo")?.classList.contains("on");
  const lg=L(selDate,inWO?woAth:me());
  lg[k+"-note"]=ta.value;
  saveDay(lg);
  const t=document.querySelector(`[data-ntog="${k}"]`);
  if(t){t.classList.add("has");
    t.textContent="✎ Notiz: "+ta.value.slice(0,42)+(ta.value.length>42?"…":"");}
}
async function aiClean(raw){
  const key=DB.keys&&DB.keys.gemini;
  if(!key||DB.aiDictate===false)return raw;
  try{
    const mdl=(DB.models&&DB.models.gemini)||PROV.gemini.m;
    const r=await fetch(PROV.gemini.base+mdl+":generateContent?key="+encodeURIComponent(key),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:"Du bereinigst diktierte Trainingsnotizen auf Deutsch. Entferne Füllwörter und Versprecher, setze Satzzeichen, korrigiere falsch erkannte Fachbegriffe aus dem Krafttraining (Kniebeuge, Kreuzheben, Bankdrücken, Latzug, Wiederholungen, Sätze, RPE). Ändere den Inhalt nicht und ergänze nichts. Gib nur den bereinigten Text zurück, ohne Anführungszeichen."}]},
        contents:[{role:"user",parts:[{text:raw}]}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message);
    const out=d.candidates?.[0]?.content?.parts?.[0]?.text;
    return (out||raw).trim();
  }catch(e){return raw;}
}
async function geminiAudio(blob,k){
  const key=DB.keys&&DB.keys.gemini;
  if(!key){dictMsg(k,"Für die KI-Transkription brauchst du einen Gemini-Schlüssel. Unter Coach eintragen.",1);return;}
  dictMsg(k,"Wird transkribiert …");
  try{
    const b64=await new Promise((res,rej)=>{
      const fr=new FileReader();
      fr.onload=()=>res(String(fr.result).split(",")[1]);
      fr.onerror=rej; fr.readAsDataURL(blob);
    });
    const mdl=(DB.models&&DB.models.gemini)||PROV.gemini.m;
    const r=await fetch(PROV.gemini.base+mdl+":generateContent?key="+encodeURIComponent(key),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{role:"user",parts:[
        {text:"Transkribiere diese deutsche Trainingsnotiz wörtlich, aber ohne Füllwörter, mit Satzzeichen. Fachbegriffe aus dem Krafttraining korrekt schreiben. Gib nur den Text zurück."},
        {inline_data:{mime_type:blob.type||"audio/webm",data:b64}}]}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message);
    const txt=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
    if(txt){dictWrite(k,txt);dictMsg(k,"Mit Gemini transkribiert.");}
    else dictMsg(k,"Nichts verstanden.",1);
  }catch(e){dictMsg(k,"Transkription fehlgeschlagen: "+(e.message||""),1);}
}
function stopDictation(btn){
  if(dictRec){try{dictRec.stop();}catch(e){}dictRec=null;}
  if(dictMR&&dictMR.state!=="inactive"){try{dictMR.stop();}catch(e){}}
  if(btn){btn.classList.remove("rec");btn.textContent="🎙 Diktieren";}
}
async function startDictation(k,btn){
  if(btn.classList.contains("rec")){stopDictation(btn);return;}
  dictKey=k;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const useAI=!!(DB.keys&&DB.keys.gemini)&&DB.aiDictate!==false;
  if(SR){
    try{
      dictRec=new SR();
      dictRec.lang="de-DE";dictRec.continuous=true;dictRec.interimResults=false;
      let collected="";
      dictRec.onresult=e=>{
        for(let i=e.resultIndex;i<e.results.length;i++)
          if(e.results[i].isFinal)collected+=e.results[i][0].transcript+" ";
      };
      dictRec.onerror=ev=>{dictMsg(k,"Spracherkennung: "+(ev.error||"Fehler"),1);stopDictation(btn);};
      dictRec.onend=async()=>{
        btn.classList.remove("rec");btn.textContent="🎙 Diktieren";
        const raw=collected.trim();
        if(!raw){dictMsg(k,"Nichts verstanden.",1);return;}
        if(useAI){
          dictMsg(k,"Wird von Gemini bereinigt …");
          const clean=await aiClean(raw);
          dictWrite(k,clean);
          dictMsg(k,clean!==raw?"Diktiert und von Gemini bereinigt.":"Diktiert.");
        } else {
          dictWrite(k,raw);
          dictMsg(k,"Diktiert. Für die KI-Bereinigung einen Gemini-Schlüssel unter Coach eintragen.");
        }
      };
      dictRec.start();
      btn.classList.add("rec");btn.textContent="⏹ Aufnahme läuft";
      dictMsg(k,useAI?"Sprich los. Gemini bereinigt danach.":"Sprich los.");
      return;
    }catch(e){dictRec=null;}
  }
  // Kein Spracherkenner im Browser: aufnehmen und von Gemini transkribieren lassen
  if(!navigator.mediaDevices||!window.MediaRecorder){
    dictMsg(k,"Dieses Gerät unterstützt kein Diktieren. Notiz bitte tippen.",1);return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    dictChunks=[];
    dictMR=new MediaRecorder(stream);
    dictMR.ondataavailable=e=>{if(e.data.size)dictChunks.push(e.data);};
    dictMR.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      btn.classList.remove("rec");btn.textContent="🎙 Diktieren";
      await geminiAudio(new Blob(dictChunks,{type:dictMR.mimeType||"audio/webm"}),k);
    };
    dictMR.start();
    btn.classList.add("rec");btn.textContent="⏹ Aufnahme läuft";
    dictMsg(k,"Aufnahme läuft. Gemini transkribiert nach dem Stoppen.");
  }catch(e){dictMsg(k,"Kein Zugriff auf das Mikrofon.",1);}
}

/* ══════════ ANGEFANGENE EINHEIT ══════════
   Sobald eine Einheit begonnen und nicht beendet wurde, schwebt ein Knopf
   über allen Seiten, der genau dort weitermacht. */
function woOffen(){
  const a=me(), d=todayISO();
  const ses=sessionFor(d,a);
  if(ses.k==="rest"||ses.pre)return null;
  const items=buildSession(ses,a).filter(i=>i.type==="lift"||i.type==="circuit");
  if(!items.length)return null;
  const lg=LR(d,a);
  const fertig=items.filter(x=>lg[x.key+"-done"]).length;
  const begonnen=((DB.woPos||{})[d+"|"+a]!==undefined)||
    items.some(x=>Object.keys(lg).some(k=>k.startsWith(x.key+"-")&&k!==x.key+"-eq"&&lg[k]));
  if(!begonnen||fertig>=items.length)return null;
  const pos=(DB.woPos||{})[d+"|"+a];
  const idx=(pos!==undefined&&pos<items.length)?pos
    :Math.max(0,items.findIndex(x=>!lg[x.key+"-done"]));
  return {ses,items,idx,fertig,ges:items.length,date:d};
}
function woResumeShow(){
  const el=document.getElementById("woresume");
  if(!el)return;
  const offen=(document.getElementById("wo")?.classList.contains("on"))?null:woOffen();
  el.classList.toggle("on",!!offen);
  if(!offen)return;
  document.getElementById("wrsname").textContent=offen.ses.n;
  document.getElementById("wrsinfo").textContent=
    `weiter bei Übung ${offen.idx+1} von ${offen.ges} · ${offen.fertig} erledigt`;
  // Über der unteren Leiste, links neben dem Player
  const bot=document.getElementById("bot");
  const h=bot?bot.getBoundingClientRect().height:70;
  el.style.bottom=(h+14)+"px";
}
function woResumeInit(){
  const el=document.getElementById("woresume");
  if(!el)return;
  el.addEventListener("click",()=>{
    const o=woOffen();
    if(!o){woResumeShow();return;}
    selDate=o.date;
    openWO(o.ses,me(),buildSession(o.ses,me()));
    woResumeShow();
  });
}

/* ══════════ SCHWEBENDER PLAYER ══════════ */
const PL=()=>document.getElementById("player");
let plOpen=false, plTimer=null;
function plPos(){
  const p=PL(); if(!p)return;
  const d=DB.fabPos||{};
  const w=plOpen?252:48, hgt=plOpen?124:48;
  const maxX=Math.max(8,window.innerWidth-w-8);
  const maxY=Math.max(60,window.innerHeight-hgt-8);
  const x=Math.min(maxX,Math.max(8,d.x!==undefined?d.x:maxX));
  const y=Math.min(maxY,Math.max(60,d.y!==undefined?d.y:window.innerHeight-170));
  p.style.left=x+"px"; p.style.top=y+"px";
}
function plShow(){
  const p=PL(); if(!p)return;
  const vis=(spOK()||!!SPd().ref)&&DB.fabOff!==true;
  p.classList.toggle("on",vis);
  if(vis)plPos();
  if(vis&&plOpen)plNow();
}
function plToggle(open){
  const p=PL(); if(!p)return;
  plOpen=open;
  p.classList.toggle("open",open);
  p.classList.toggle("mini",!open);
  plPos();
  if(open){plNow();clearInterval(plTimer);plTimer=setInterval(plNow,15000);}
  else clearInterval(plTimer);
}
async function plNow(){
  if(!plOpen)return;
  const d=await spCall("/me/player");
  const t1=document.getElementById("pt1"), t2=document.getElementById("pt2"), im=document.getElementById("part");
  if(!t1)return;
  if(!d||!d.item){t1.textContent="Nichts aktiv";t2.textContent="In Spotify starten";if(im)im.src="";return;}
  t1.textContent=d.item.name;
  t2.textContent=d.item.artists.map(x=>x.name).join(", ");
  if(im)im.src=d.item.album?.images?.[2]?.url||"";
}
function plInit(){
  const p=PL(); if(!p)return;
  let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  const start=e=>{
    const t=e.touches?e.touches[0]:e;
    drag=true;moved=false;sx=t.clientX;sy=t.clientY;
    const r=p.getBoundingClientRect();ox=r.left;oy=r.top;
    e.preventDefault();
  };
  const move=e=>{
    if(!drag)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    DB.fabPos={x:ox+dx,y:oy+dy};
    plPos();
    e.preventDefault();
  };
  const end=()=>{
    if(!drag)return;
    drag=false;
    if(moved)save(true); else plToggle(!plOpen);
  };
  ["mousedown","touchstart"].forEach(ev=>{
    document.getElementById("pmini")?.addEventListener(ev,start,{passive:false});
    document.getElementById("pdrag")?.addEventListener(ev,start,{passive:false});
  });
  ["mousemove","touchmove"].forEach(ev=>document.addEventListener(ev,move,{passive:false}));
  ["mouseup","touchend"].forEach(ev=>document.addEventListener(ev,end));
  document.getElementById("pclose")?.addEventListener("click",e=>{e.stopPropagation();plToggle(false);});
  document.querySelectorAll("[data-pc]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const a=b.dataset.pc;
    if(a==="next")await spCall("/me/player/next","POST");
    else if(a==="prev")await spCall("/me/player/previous","POST");
    else{const d=await spCall("/me/player");await spCall("/me/player/"+(d&&d.is_playing?"pause":"play"),"PUT");}
    setTimeout(plNow,400);
  });
  window.addEventListener("resize",()=>setTimeout(plPos,60));
}

/* Workout durch Herunterwischen schließen – Griff oben oder Wisch von ganz oben */
(function woSwipe(){
  const wo=document.getElementById("wo"), grip=document.getElementById("wgrip");
  if(!wo)return;
  let sy=0,sx=0,aktiv=false,dy=0;
  const start=e=>{
    const t=e.touches?e.touches[0]:e;
    const vomGriff=grip&&grip.contains(e.target);
    const vonOben=t.clientY<120;
    if(!vomGriff&&!vonOben)return;
    // In der Pausenansicht nicht schließen
    if(document.getElementById("wrest")?.classList.contains("on")&&!wrMini)return;
    aktiv=true;sy=t.clientY;sx=t.clientX;dy=0;
  };
  const move=e=>{
    if(!aktiv)return;
    const t=e.touches?e.touches[0]:e;
    dy=t.clientY-sy;
    if(Math.abs(t.clientX-sx)>Math.abs(dy))return;
    if(dy>0){
      wo.style.transform="translateY("+Math.min(dy,460)+"px)";
      wo.style.opacity=String(Math.max(.35,1-dy/560));
      if(e.cancelable)e.preventDefault();
    }
  };
  const end=()=>{
    if(!aktiv)return;
    aktiv=false;
    wo.style.transition="transform .22s ease, opacity .22s ease";
    if(dy>110){
      wo.style.transform="translateY(100%)";wo.style.opacity="0";
      setTimeout(()=>{
        wo.classList.remove("on");
        wo.style.transition="";wo.style.transform="";wo.style.opacity="";
        render();woResumeShow();
      },210);
    } else {
      wo.style.transform="";wo.style.opacity="";
      setTimeout(()=>{wo.style.transition="";},230);
    }
  };
  ["touchstart","mousedown"].forEach(ev=>wo.addEventListener(ev,start,{passive:true}));
  ["touchmove","mousemove"].forEach(ev=>wo.addEventListener(ev,move,{passive:false}));
  ["touchend","mouseup","touchcancel"].forEach(ev=>wo.addEventListener(ev,end));
})();

  showModal(`<h3>${ps.hard?"Zeit für einen neuen Plan":"Der Plan hat seinen Zweck erfüllt"}</h3>
