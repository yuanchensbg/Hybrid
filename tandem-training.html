function exCard(it,ath,lg,ses){
  const k=it.key, done=lg[k+"-done"];
  let h=`<div class="ex${done?" done":""}${it.lead?" lead":""}" data-ex="${k}">
    <div class="exh">`;
  if(it.type!=="free")h+=`<button class="tick" data-done="${k}"><svg viewBox="0 0 16 16"><path d="M2 8.5l4 4 8-9"/></svg></button>`;
  const swapped=it.orig&&it.ex!==it.orig;
  h+=`<div class="exn"><div class="nm">${esc(it.name)}${it.lead&&it.type==="lift"?'<span class="badge-lead">BEIDE</span>':""}</div>
    ${swapped?`<div class="sb swap">getauscht für ${esc(EX[it.orig]?.n||it.orig)}</div>`:(it.sub?`<div class="sb">${esc(it.sub)}</div>`:"")}</div>`;
  const sk=swapKeyOf(ses,ath,it);
  const swapAktiv=sk&&DB.swaps[sk];
  if(sk&&it.type!=="warm"&&it.type!=="free")
    h+=`<button class="ib${swapAktiv?" on":""}" data-swapex="${esc(sk)}" data-swapname="${esc(it.name)}" title="Übung tauschen">⇄</button>`;
  if(it.how)h+=`<button class="ib" data-how="${k}">?</button>`;
  h+=`</div>`;

  let figs=it.figs;
  if(it.type==="lift"&&!figs){
    figs=[["Plan",`${it.sets} × ${it.rep}${it.unit?" "+it.unit:""}`]];
    if(it.target)figs.push(["Ziel",it.target+" kg"]);
    if(it.rpe)figs.push(["RPE",String(it.rpe)]);
    if(it.pause)figs.push(["Pause",it.pause,1]);
  }
  if(figs){
    h+=`<div class="figs">`;
    figs.forEach(f=>h+=`<div class="fig${f[2]?" tap":""}"${f[2]?` data-t="${f[1]}" data-tn="${esc(it.name)}"`:""}><div class="k">${f[0]}</div><div class="v num">${f[1]}</div></div>`);
    h+=`</div>`;
  }

  let selEq=null;
  if(it.ex&&EX[it.ex]){
    const opts=exOptions(it.ex);
    const avail=opts.filter(o=>o.ok);
    if(!avail.length&&opts.length){
      const alts=altsFor(it.ex);
      h+=`<div class="warnl">Im ${esc(curGym().n)} nicht vorhanden.${alts.length?" Verfügbare Alternativen: "+alts.map(a=>EX[a].n).join(", ")+".":""}</div>`;
      if(alts.length&&it.slotKey){
        h+=`<div class="trk"><div class="erow"><span class="elbl">Ersatz</span><div class="opts">`;
        alts.slice(0,3).forEach(a=>h+=`<button class="opt" data-swap="${it.slotKey}" data-sv="${a}">${esc(EX[a].n)}</button>`);
        h+=`</div></div></div>`;
      }
    } else if(opts.length){
      const sel=lg[k+"-eq"]||(avail[0]||opts[0]).t;
      selEq=sel;
      h+=`<div class="trk"><div class="erow"><span class="elbl">Gerät</span><div class="opts">`;
      opts.forEach(o=>h+=`<button class="opt${o.t===sel?" sel":""}${o.ok?"":" miss"}" data-eq="${k}" data-ev="${o.t}">${esc(o.l)}${o.eigen?" ·":""}</button>`);
      h+=`<button class="opt" data-eqnew="${k}|${it.ex}" style="color:var(--me)">+ eigenes Gerät</button>`;
      h+=`</div></div>`;
      const gr=griffeOf(it.ex);
      if(gr.length){
        const gsel=lg[k+"-griff"]||gr[0];
        h+=`<div class="eqrow"><div class="eql">Griff</div><div class="opts">`;
        gr.forEach(g=>h+=`<button class="opt${g===gsel?" sel":""}" data-griff="${k}" data-gv="${g}">${esc(GRIFFE[g])}</button>`);
        h+=`</div></div>`;
      }
      h+=`</div>`;
    }
  }

  if(it.type==="lift"||it.type==="circuit"){
    h+=`<div class="trk">`;
    const ll=lastLine(ath,it,selDate,selEq);
    if(ll)h+=ll;
    if(it.sch){
      h+=`<div class="hintl">${waveHint(it,ath)}</div>`;
      if(it.target)h+=`<button class="fillbtn" data-fill="${k}" data-kg="${it.target}">Alle Sätze mit ${it.target} kg vorbelegen</button>`;
    } else {
      const pr=progression(ath,it,selDate,selEq);
      if(pr){
        h+=`<div class="hintl">${esc(pr.txt)}</div>`;
        if(pr.kg)h+=`<button class="fillbtn" data-fill="${k}" data-kg="${pr.kg}">Alle Sätze mit ${pr.kg.toLocaleString("de-DE")} kg vorbelegen</button>`;
      }
    }
    const erg=isErg(selEq);
    const wm=WMODE[weightMode(it.ex,selEq,lg[k+"-griff"])];
    for(let s=1;s<=it.sets;s++){
      const sk=lg[`${k}-x${s}`];
      h+=`<div class="erow${sk?" skipped":""}">
        <button class="sn${lg[`${k}-s${s}`]&&!sk?" ok":""}" data-set="${k}-s${s}">${s}</button>`;
      if(erg){
        h+=`<input class="inp num" type="text" inputmode="numeric" placeholder="2:05" data-clk="${k}-t${s}" value="${esc(lg[`${k}-t${s}`]||"")}">
        <span class="u">Zeit</span>
        <input class="inp num" type="number" inputmode="numeric" placeholder="${it.unit==="m"?it.rep:"m"}" data-r="${k}-r${s}" value="${esc(lg[`${k}-r${s}`]||"")}">
        <span class="u">m</span>`;
      } else {
        h+=`<input class="inp num" type="number" inputmode="decimal" placeholder="${wm.kurz}" data-w="${k}-w${s}" value="${esc(lg[`${k}-w${s}`]||"")}">
        <span class="u">${wm.kurz}</span>
        <input class="inp num" type="number" inputmode="numeric" placeholder="${it.unit||"Wdh"}" data-r="${k}-r${s}" value="${esc(lg[`${k}-r${s}`]||"")}">
        <span class="u">${it.unit||"Wdh"}</span>`;
      }
      h+=`<button class="skp" data-skip="${k}-x${s}">${sk?"↺":"✕"}</button>

    else if(wm.lang)h+=`<div class="hintl" style="border-top:none">${wm.lang}</div>`;
    h+=`</div>`;
  }
  if(it.cardio){
    h+=`<div class="trk">`;
    const CF={dist:["Distanz","km","decimal"],pace:["Pace","/km","text"],time:["Dauer","min","decimal"],hr:["Ø Puls","bpm","numeric"]};
    it.cardio.forEach(f=>{
      const c=CF[f];
      h+=`<div class="erow"><span class="elbl">${c[0]}</span>
        <input class="inp num" type="${c[2]==="text"?"text":"number"}" inputmode="${c[2]}" placeholder="${c[0]}" data-c="${k}-c-${f}" value="${esc(lg[`${k}-c-${f}`]||"")}">
        <span class="u">${c[1]}</span></div>`;
    });
    h+=`</div>`;
  }
  if(swapAktiv){
    const orig=EX[it.orig]||{};
    h+=`<div class="hintl" style="display:flex;align-items:center;gap:9px">
      <span style="flex:1">Getauscht – im Plan steht hier <b>${esc(orig.n||it.orig)}</b>.</span>
      <button class="opt" onclick="undoSwap('${esc(sk)}')">zurück</button></div>`;
  }
  if(it.type==="lift"||it.type==="circuit"){
    const hatWas=Object.keys(lg).some(x=>x.startsWith(k+"-")&&x!==k+"-eq");
    if(hatWas)h+=`<button class="notetog" data-clrex="${k}" data-clrn="${esc(it.name)}"
      style="color:var(--red)">✕ Einträge dieser Übung löschen</button>`;
  }
  if(it.type!=="free"&&it.type!=="warm"){
    const nv=lg[k+"-note"]||"";
    h+=`<button class="notetog${nv?" has":""}" data-ntog="${k}">✎ ${nv?"Notiz: "+esc(nv.slice(0,42))+(nv.length>42?"…":""):"Notiz hinzufügen"}</button>
      <div class="notewrap${nv?" on":""}" id="nw-${k}">
        <textarea data-nex="${k}" placeholder="Wie lief die Übung? Technik, Schmerzen, Gewicht zu leicht …">${esc(nv)}</textarea>
        <div class="noterow">
          <button class="mic" data-mic="${k}">🎙 Diktieren</button>
          <button data-nclr="${k}">Leeren</button>
        </div>
        <div class="notehint" id="nh-${k}"></div>
      </div>`;
  }
  if(it.how)h+=`<div class="how" id="how-${k}">${it.rpe?`<div style="margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--line)">
    <b style="color:var(--me)">RPE ${it.rpe}</b> · ${RPEINFO[it.rpe]}${it.lead?"":`<br><span style="font-size:12px">Der letzte Satz darf bis RPE 9 gehen, die davor nicht.</span>`}</div>`:""}${HOWOF(it.how,selEq)}</div>`;
  return h+`</div>`;
}

function bindHeute(ses,ath,lg,items){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  q("[data-mode]",b=>b.onclick=()=>{const o=L(selDate,ath);o.mode=b.dataset.mode;saveDay(o);renderHeute();scrollTop();});
  q("[data-gym]",b=>b.onclick=()=>{DB.gym=b.dataset.gym;save();render();});
  q("[data-done]",b=>b.onclick=()=>{const k=b.dataset.done;lg[k+"-done"]=!lg[k+"-done"];saveDay(lg);
    b.closest(".ex").classList.toggle("done",!!lg[k+"-done"]);});
  q("[data-how]",b=>b.onclick=()=>{const e=document.getElementById("how-"+b.dataset.how);
    e.classList.toggle("on");b.classList.toggle("on",e.classList.contains("on"));});
  q(".fig.tap",f=>f.onclick=()=>startTimer(f.dataset.t,f.dataset.tn));
  q("[data-eq]",b=>b.onclick=()=>{
    const wasOpen=document.getElementById("how-"+b.dataset.eq)?.classList.contains("on");
    lg[b.dataset.eq+"-eq"]=b.dataset.ev;saveDay(lg);
    openHow=wasOpen?b.dataset.eq:null;
    renderHeute();});
  q("[data-swap]",b=>b.onclick=()=>{DB.swaps[b.dataset.swap]=b.dataset.sv;save();render();toast("Getauscht");});
  q("[data-w]",i=>i.oninput=()=>{lg[i.dataset.w]=i.value;
    const bk=i.dataset.w.replace(/-w\d+$/,"");
    freezeEx(lg,bk,(items.find(x=>x.key===bk)||{}).ex);
    const m=i.dataset.w.match(/^(.+)-w(\d+)$/);
    if(m&&m[2]==="1"&&i.value)document.querySelectorAll(`[data-w^="${m[1]}-w"]`).forEach(o=>{
      if(o!==i&&!o.value){o.value=i.value;lg[o.dataset.w]=i.value;}});
    saveDay(lg);});
  q("[data-r]",i=>i.oninput=()=>{lg[i.dataset.r]=i.value;saveDay(lg);});
  q("[data-clk]",i=>{
    i.oninput=()=>{lg[i.dataset.clk]=i.value;saveDay(lg);};
    i.onblur=()=>{const v=clockFmt(i.value);i.value=v;
      if(v)lg[i.dataset.clk]=v; else delete lg[i.dataset.clk];
      saveDay(lg);};
  });
  q("[data-c]",i=>i.oninput=()=>{lg[i.dataset.c]=i.value;saveDay(lg);});
  q("[data-set]",b=>b.onclick=()=>{const k=b.dataset.set;
    const bk0=k.replace(/-s\d+$/,"");
    freezeEx(lg,bk0,(items.find(x=>x.key===bk0)||{}).ex);
    const xk=k.replace(/-s(\d+)$/,"-x$1"); if(lg[xk])delete lg[xk];
    lg[k]=!lg[k];saveDay(lg);
    if(lg[k]){
      const base=k.replace(/-s\d+$/,"");
      const item=items.find(x=>x.key===base);
      const pr=item&&prCheck(ath,item,lg,selDate);
      if(pr){renderHeute();prCelebrate(pr);return;}
    }
    renderHeute();});
  q("[data-griff]",b=>b.onclick=()=>{
    lg[b.dataset.griff+"-griff"]=b.dataset.gv;saveDay(lg);renderHeute();});
  q("[data-eqnew]",b=>b.onclick=()=>{const [k,ex]=b.dataset.eqnew.split("|");eqNewDialog(k,ex,false);});
  q("[data-clrex]",b=>b.onclick=()=>clearExAsk(b.dataset.clrex,b.dataset.clrn,false));
  q("[data-ntog]",b=>b.onclick=()=>{
    document.getElementById("nw-"+b.dataset.ntog)?.classList.toggle("on");});
  q("[data-nex]",el=>el.oninput=()=>{
    const k=el.dataset.nex;
    if(el.value)lg[k+"-note"]=el.value; else delete lg[k+"-note"];
    saveDay(lg);
    const t=document.querySelector(`[data-ntog="${k}"]`);
    if(t){t.classList.toggle("has",!!el.value);
      t.textContent="✎ "+(el.value?"Notiz: "+el.value.slice(0,42)+(el.value.length>42?"…":""):"Notiz hinzufügen");}
  });
  q("[data-nclr]",b=>b.onclick=()=>{
    const k=b.dataset.nclr;
    delete lg[k+"-note"];saveDay(lg);renderHeute();});
  q("[data-mic]",b=>b.onclick=()=>startDictation(b.dataset.mic,b));
  q("[data-swapex]",b=>b.onclick=()=>{
    planSwapKey=b.dataset.swapex; swapQuery="";
    openPlanSwap(b.dataset.swapname);});
  q("[data-fill]",b=>b.onclick=()=>{
    const k=b.dataset.fill, kg=b.dataset.kg;
    document.querySelectorAll(`[data-w^="${k}-w"]`).forEach(o=>{o.value=kg;lg[o.dataset.w]=kg;});
    saveDay(lg);toast("Mit "+kg+" kg vorbelegt");});
  q("[data-skip]",b=>b.onclick=()=>{const k=b.dataset.skip;lg[k]=!lg[k];
    if(lg[k])delete lg[k.replace(/-x(\d+)$/,"-s$1")];saveDay(lg);renderHeute();});
  const nt=document.getElementById("ntog"),na=document.getElementById("nta");
  if(nt){nt.onclick=()=>na.classList.toggle("open");
    na.oninput=()=>{lg.notes=na.value;saveDay(lg);nt.classList.toggle("has",!!na.value);};}
  document.getElementById("startwo")?.addEventListener("click",()=>openWO(ses,ath,items));
  document.getElementById("cuedit")?.addEventListener("click",()=>{cuDate=selDate;go("mehr","custom");});
  document.getElementById("shday")?.addEventListener("click",()=>shareDay(selDate));
  document.getElementById("wa")?.addEventListener("click",()=>waSend(buildReport()));
}

let woL=[],woI=0,woSes=null,woAth=null;
/* Einstieg dort, wo zuletzt aufgehört wurde. Gemerkt wird je Tag und Person;
   fehlt der Merker, springt die App zur ersten noch offenen Übung. */
function woResume(date,ath){
  const k=date+"|"+ath;
  const saved=(DB.woPos||{})[k];
  if(saved!==undefined&&saved>=0&&saved<woL.length)return saved;
  const lg=LR(date,ath);
  const open=woL.findIndex(x=>!lg[x.key+"-done"]);
  return open>=0?open:0;
}
function woRemember(){
  if(!woAth)return;
  DB.woPos=DB.woPos||{};
  DB.woPos[selDate+"|"+woAth]=woI;
  // Merker alter Tage aufräumen
  const keep=Object.keys(DB.woPos).filter(x=>x.split("|")[0]>=selDate);
  if(Object.keys(DB.woPos).length>14){
    const neu={}; keep.forEach(x=>neu[x]=DB.woPos[x]); DB.woPos=neu;
  }
  save(true);
}
function openWO(ses,ath,items){
  woL=items.filter(i=>i.type==="lift"||i.type==="circuit");

  woSes=ses;woAth=ath;
  woI=woResume(selDate,ath);

/* Satzpause im Workout-Modus: rechnet mit einem Zielzeitpunkt statt
   herunterzuzählen. Dadurch läuft sie weiter, wenn der Bildschirm aus ist
   oder die App im Hintergrund liegt. Zusätzlich hält ein Wake Lock den
   Bildschirm an, solange die Pause läuft. */
let wrEndAt=0, wrId=null, wrBeeped=false, wrLock=null;
const wrLeft=()=>Math.max(0,Math.round((wrEndAt-Date.now())/1000));
async function wrWake(on){
  try{
    if(on&&!wrLock&&navigator.wakeLock){wrLock=await navigator.wakeLock.request("screen");
      wrLock.addEventListener("release",()=>{wrLock=null;});}
    else if(!on&&wrLock){await wrLock.release();wrLock=null;}
  }catch(e){}
}
let wrTotal=0, wrHalf=false, wrSaid=0;
function wrPaint(){
  const left=wrLeft();
  const el=document.getElementById("wrt");
  if(el)el.textContent=fmt(left);
  if(!wrEndAt)return;
  if(DB.cueOff!==true){
    // Halbzeit: ein eigenes Doppelsignal, nur bei Pausen ab einer Minute
    if(!wrHalf&&wrTotal>=60&&left<=Math.round(wrTotal/2)&&left>Math.round(wrTotal/2)-3){
      wrHalf=true;
      say("Halbzeit",beepHalf);
      if(navigator.vibrate)navigator.vibrate(120);
    }
    // Die letzten zehn Sekunden einzeln
    if(left<=10&&left>=1&&wrSaid!==left){
      wrSaid=left;
      say(String(left),beepTick);
    }
  }
  if(left<=0){
    if(!wrBeeped){
      wrBeeped=true;
      say("Los",beep);
      beep();
    }
    clearInterval(wrId);wrId=null;
    setTimeout(wrEnd,900);
  }
}
function woRest(p){
  const a=p.split(":");
  const secs=(+a[0])*60+(+a[1]);
  wrEndAt=Date.now()+secs*1000;
  wrTotal=secs;wrHalf=false;wrSaid=0;wrBeeped=false;
  DB.wrEnd=wrEndAt;save(true);
  document.getElementById("wrest").classList.add("on");
  wrPaint();
  clearInterval(wrId);
  wrId=setInterval(wrPaint,250);
  wrWake(true);
  unlock();
}
/* Pausenanzeige verkleinern: schwebt dann über der Seite und lässt sich
   verschieben, während du scrollst oder Sätze einträgst. */
let wrMini=false;
function wrPos(){
  const w=document.getElementById("wrest");
  if(!w||!wrMini)return;
  const p=DB.wrPos||{};
  const maxX=Math.max(8,window.innerWidth-120);
  const maxY=Math.max(60,window.innerHeight-70);
  const x=Math.min(maxX,Math.max(8,p.x!==undefined?p.x:maxX-8));
  const y=Math.min(maxY,Math.max(60,p.y!==undefined?p.y:110));
  w.style.left=x+"px";w.style.top=y+"px";
}
function wrSetMini(on){
  const w=document.getElementById("wrest");
  if(!w)return;
  wrMini=on;
  w.classList.toggle("mini",on);
  if(on)wrPos(); else {w.style.left="";w.style.top="";}
}
function wrDragInit(){
  const w=document.getElementById("wrest"), t=document.getElementById("wrt");
  if(!w||!t)return;
  let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  const start=e=>{
    if(!wrMini)return;
    const p=e.touches?e.touches[0]:e;
    drag=true;moved=false;sx=p.clientX;sy=p.clientY;
    const r=w.getBoundingClientRect();ox=r.left;oy=r.top;
    e.preventDefault();
  };
  const move=e=>{
    if(!drag)return;
    const p=e.touches?e.touches[0]:e;
    const dx=p.clientX-sx, dy=p.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    DB.wrPos={x:ox+dx,y:oy+dy};
    wrPos();e.preventDefault();
  };
  const end=()=>{
    if(!drag)return;
    drag=false;
    if(moved)save(true); else wrSetMini(false);   // Tippen vergrößert wieder
  };
  // Im großen Zustand verkleinert ein Tipp auf die Zeit, im kleinen zieht er
  const tippen=e=>{
    if(wrMini)return;
    e.preventDefault();e.stopPropagation();
    wrSetMini(true);
  };
  ["click"].forEach(ev=>t.addEventListener(ev,tippen));
  ["mousedown","touchstart"].forEach(ev=>t.addEventListener(ev,start,{passive:false}));
  ["mousemove","touchmove"].forEach(ev=>document.addEventListener(ev,move,{passive:false}));
  ["mouseup","touchend"].forEach(ev=>document.addEventListener(ev,end));
  ["wrmin","wrmin2"].forEach(id=>{
    document.getElementById(id)?.addEventListener("click",e=>{
      e.preventDefault();e.stopPropagation();wrSetMini(true);});
  });
  window.addEventListener("resize",()=>setTimeout(wrPos,60));
}
function wrEnd(){
  clearInterval(wrId);wrId=null;wrEndAt=0;wrBeeped=false;wrHalf=false;wrSaid=0;
  wrSetMini(false);
  if(window.speechSynthesis){try{speechSynthesis.cancel();}catch(e){}}
  delete DB.wrEnd;save(true);
  document.getElementById("wrest")?.classList.remove("on");
  wrWake(false);
}
/* Nach Rückkehr aus dem Hintergrund die Restzeit neu berechnen */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){wrWake(false);return;}
  if(wrEndAt){
    if(wrLeft()<=0)wrPaint();
    else{clearInterval(wrId);wrId=setInterval(wrPaint,250);wrPaint();wrWake(true);}

});
/* Nach einem Neustart eine noch laufende Pause fortsetzen */
(function(){
  if(!DB.wrEnd)return;
  if(DB.wrEnd-Date.now()<=0){delete DB.wrEnd;return;}

/* ══════════ TIMER ══════════
   Rechnet mit Zeitstempeln statt herunterzuzählen: die Restzeit ergibt sich
   aus dem Zielzeitpunkt. Dadurch stimmt sie auch, wenn der Bildschirm aus war.
   Eine stille Tonschleife und der Wake Lock halten die App dabei wach. */
let tEnd=0,tPausedLeft=null,tId=null,ac=null,wakeLock=null,silentSrc=null;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const tRemain=()=>tPausedLeft!==null?tPausedLeft:Math.max(0,Math.round((tEnd-Date.now())/1000));

/* Töne sollen laufende Musik nicht unterbrechen.
   iOS stoppt fremde Wiedergabe, sobald eine App eine eigene Audiositzung
   beansprucht. Deshalb: Sitzung auf "ambient" stellen, den Kontext erst beim
   ersten Ton anlegen und danach wieder schlafen legen. */
function audioAmbient(){
  try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}
}
audioAmbient();
let acIdle=null;
function acGet(){
  audioAmbient();
  if(!ac){
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      ac=new C({latencyHint:"interactive"});
    }catch(e){return null;}
  }
  if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
  clearTimeout(acIdle);
  // Nach kurzer Ruhe die Audiositzung wieder freigeben
  acIdle=setTimeout(()=>{try{ac&&ac.state==="running"&&ac.suspend();}catch(e){}},2500);
  return ac;
}
/* Wird beim ersten Antippen aufgerufen – legt aber nichts mehr an,
   solange kein Ton gebraucht wird. */
function unlock(){audioAmbient();}
/* Einzelner Ton mit wählbarer Höhe und Länge */
function tone(freq,dur,vol){try{
  const ac=acGet(); if(!ac)return;
  const s=ac.createOscillator(),g=ac.createGain();
  s.frequency.value=freq;s.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(vol||.22,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(dur||.15));
  s.start();s.stop(ac.currentTime+(dur||.15)+.01);
}catch(e){}}
/* Ansage per Sprachausgabe, sonst Ersatzton */
/* Sprachausgabe unterbricht auf iOS laufende Musik kurz. Deshalb standardmäßig
   aus – wer sie will, schaltet sie im Profil ein. */
function say(txt,fallback){
  if(DB.ttsOn===true&&window.speechSynthesis){
    try{
      const u=new SpeechSynthesisUtterance(txt);
      u.lang="de-DE";u.rate=1.15;u.volume=1;
      speechSynthesis.cancel();speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  if(fallback)fallback();
}
/* Leiser Zweiklang für neue Nachrichten – kurz genug, um Musik nicht zu stören */
const chime=()=>{tone(784,.14,.16);setTimeout(()=>tone(1047,.22,.14),130);};
const beepHalf=()=>{tone(660,.16);setTimeout(()=>tone(660,.16),220);};
const beepTick=()=>tone(1180,.07,.18);
function beep(){try{
  const ac=acGet(); if(!ac)return;
  [0,260,520].forEach(o=>setTimeout(()=>{
    const s=ac.createOscillator(),g=ac.createGain();
    s.frequency.value=880;s.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);
    s.start();s.stop(ac.currentTime+.19);},o));
  if(navigator.vibrate)navigator.vibrate([200,120,200]);
}catch(e){}}

/* Hält die App im Hintergrund aktiv, damit der Ton beim Ablauf kommt */
function keepAwake(on){
  try{
    if(on){
      unlock();
      if(!silentSrc&&ac){
        const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*2),ac.sampleRate);
        silentSrc=ac.createBufferSource();
        silentSrc.buffer=buf;silentSrc.loop=true;
        const g=ac.createGain();g.gain.value=0.0001;
        silentSrc.connect(g);g.connect(ac.destination);silentSrc.start();
      }
      if(navigator.wakeLock&&!wakeLock)
        navigator.wakeLock.request("screen")
          .then(w=>{wakeLock=w;w.addEventListener("release",()=>{wakeLock=null;});})
          .catch(()=>{});
    } else {
      if(silentSrc){try{silentSrc.stop();}catch(e){}silentSrc=null;}
      if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
    }
  }catch(e){}
}
function tTick(){
  const left=tRemain();
  const t=document.getElementById("tmr");
  const tv=document.getElementById("tv");
  if(tv)tv.textContent=fmt(left);
  if(left<=0&&tPausedLeft===null){
    clearInterval(tId);tId=null;
    if(t)t.classList.add("done");
    const tl=document.getElementById("tl");
    if(tl)tl.textContent="Weiter";
    keepAwake(false);
    beep();
  }
}
function startTimer(txt,name){
  const a=String(txt).split(":");
  if(a.length<2)return;
  const sec=(+a[0])*60+(+a[1]);
  tEnd=Date.now()+sec*1000;tPausedLeft=null;
  document.getElementById("tl").textContent=name.length>24?name.slice(0,24)+"…":name;
  const t=document.getElementById("tmr");t.classList.remove("done");t.classList.add("up");
  document.getElementById("tp").textContent="Pause";
  clearInterval(tId);tId=setInterval(tTick,250);
  keepAwake(true);
  tTick();
}
function pauseTimer(){
  if(tPausedLeft===null){
    tPausedLeft=tRemain();clearInterval(tId);tId=null;keepAwake(false);
    document.getElementById("tp").textContent="Weiter";
  } else {
    tEnd=Date.now()+tPausedLeft*1000;tPausedLeft=null;
    clearInterval(tId);tId=setInterval(tTick,250);keepAwake(true);
    document.getElementById("tp").textContent="Pause";
  }
}
function stopTimer(){
  clearInterval(tId);tId=null;tPausedLeft=null;keepAwake(false);
  document.getElementById("tmr").classList.remove("up","done");
}
/* Beim Zurückkehren in die App sofort neu rechnen */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tId)tTick();});
window.addEventListener("focus",()=>{if(tId)tTick();});

/* ══════════ BERICHT / TEILEN ══════════ */
function reportDay(date,ath){
  const ses=sessionFor(date,ath);
  if(ses.k==="rest")return null;
  const items=buildSession(ses,ath), lg=LR(date,ath);
  let rows=[],done=0,total=0;
  items.forEach(it=>{
    if(it.type==="free")return;
    total++; if(lg[it.key+"-done"])done++;
    let parts=[];
    if(lg[it.key+"-eq"])parts.push(eqLabel(lg[it.key+"-eq"]));
    if(lg[it.key+"-griff"])parts.push("Griff "+(GRIFFE[lg[it.key+"-griff"]]||lg[it.key+"-griff"]));
    if(it.orig&&it.ex!==it.orig)parts.push(`[getauscht für ${(EX[it.orig]||{n:it.orig}).n}${lg[it.key+"-swap"]?", nur heute":""}]`);
    let sets=[];
    for(let s=1;s<=(it.sets||0)+2;s++){
      if(lg[`${it.key}-x${s}`]){sets.push(`S${s} ausgelassen`);continue;}
      const w=lg[`${it.key}-w${s}`],r=lg[`${it.key}-r${s}`],t=lg[`${it.key}-t${s}`];
      if(t)sets.push(`S${s} ${t}${r?" / "+r+" m":""}`);
      else if(w||r||lg[`${it.key}-s${s}`]){
        const wm2=WMODE[weightMode(it.ex,lg[it.key+"-eq"],lg[it.key+"-griff"])];
        sets.push(`S${s}${w?" "+w+" "+wm2.kurz:""}${r?" × "+r+(it.unit||""):""}`);
      }
    }
    if(sets.length)parts.push("("+sets.join(", ")+")");
    if(it.cardio){
      const CF={dist:["Distanz","km"],pace:["Pace","/km"],time:["Dauer","min"],hr:["Puls","bpm"]};
      it.cardio.forEach(f=>{const v=lg[`${it.key}-c-${f}`];if(v)parts.push(`${CF[f][0]} ${v} ${CF[f][1]}`);});
    }
    const exn=lg[it.key+"-note"];
    if(exn)parts.push("\u201e"+exn+"\u201c");
    if(parts.length)rows.push(it.name+" "+parts.join(" "));
  });
  if(!done&&!rows.length&&!lg.notes)return null;
  const d=new Date(date+"T12:00:00");
  let line=`${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}. · ${ses.n}${ses.cyc?` (Tag ${ses.cyc})`:ses.custom?" (eigener Tag)":ses.tpl?" (Vorlage)":""}: ${done}/${total}`;
  if(rows.length)line+="\n  "+rows.join("\n  ");
  if(lg.notes)line+=`\n  Notiz: "${lg.notes}"`;
  return line;
}
function buildReport(days){
  const ath=me();
  const dates=Object.keys(DB.log).sort();
  const since=days?iso(new Date(Date.now()-days*86400000)):null;
  const lines=dates.filter(d=>!since||d>=since).map(d=>reportDay(d,ath)).filter(Boolean);
  if(!lines.length)return "";
  return `Trainingsprotokoll ${ANAME[ath]}\n\n`+lines.join("\n\n");
}
/* Ergebnisse eines Tages teilen – wahlweise nur eigene, nur die des Partners
   oder beide zusammen. */
function dayText(date,who){
  const d=new Date(date+"T12:00:00");
  const head=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const list=who==="both"?ATH:[who==="other"?other():me()];
  const parts=list.map(a=>{
    const r=reportDay(date,a);
    if(!r)return "";
    // Name voranstellen, damit erkennbar bleibt, wessen Zahlen das sind
    return ANAME[a].toUpperCase()+"\n"+r;
  }).filter(Boolean);
  if(!parts.length)return "";
  return "Training "+head+"\n\n"+parts.join("\n\n");
}

/* ══════════ FORM / FORTSCHRITT ══════════ */
const MAIN=["squat","bench","deadlift","rdl","ohp","pullup"];
function weekOf(d){return Math.floor(Math.max(0,dayNum(d))/7);}

function scanWeeks(ath){
  const W={};
  Object.keys(DB.log).sort().forEach(d=>{
    const ses=sessionFor(d,ath); if(ses.k==="rest")return;
    const items=buildSession(ses,ath), lg=LR(d,ath);
    const w=weekOf(d);
    W[w]=W[w]||{w,ton:0,km:0,paces:[],long:0,e1:{},sets:0,days:new Set()};
    let any=false;
    items.forEach(it=>{
      if(it.type==="lift"||it.type==="circuit"){
        for(let s=1;s<=(it.sets||0)+2;s++){
          if(lg[`${it.key}-x${s}`])continue;
          const wt=parseFloat(lg[`${it.key}-w${s}`]), r=parseInt(lg[`${it.key}-r${s}`],10);
          if(!isNaN(r)){W[w].sets++;any=true;}
          if(!isNaN(wt)&&!isNaN(r)){
            W[w].ton+=wt*r;
            if(it.ex&&MAIN.includes(it.ex)){
              const v=e1rm(wt,r);
              if(!W[w].e1[it.ex]||v>W[w].e1[it.ex])W[w].e1[it.ex]=v;
            }
          }
        }
      }
      if(it.cardio){
        const km=parseFloat(lg[`${it.key}-c-dist`]);
        const pc=lg[`${it.key}-c-pace`];
        if(!isNaN(km)){W[w].km+=km;any=true;if(km>W[w].long)W[w].long=km;}
        if(pc&&/^\d+:\d+$/.test(pc)){const[a,b]=pc.split(":");W[w].paces.push(+a*60+ +b);}
      }
    });
    if(any)W[w].days.add(d);
  });
  return Object.values(W).sort((a,b)=>a.w-b.w);
}
function strengthScore(ath,wk){
  const bw=DB.bw[ath]||70;
  const s=(wk.e1.squat||0)+(wk.e1.bench||0)+(wk.e1.deadlift||0);
  return s?+(s/bw).toFixed(2):0;
}
function enduranceScore(wk){
  if(!wk.km)return 0;
  const p=wk.paces.length?wk.paces.reduce((a,b)=>a+b,0)/wk.paces.length:400;
  return +((wk.km/10)+(wk.long/6)+(420-Math.min(420,p))/60).toFixed(2);
}
function lineChart(pts,color,unit){
  if(pts.length<2)return `<div class="empty">Ab der zweiten erfassten Woche entsteht hier eine Kurve.</div>`;
  const W=320,H=128,P=30;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1;
  const x=i=>P+i*(W-P-8)/(pts.length-1), y=v=>H-20-((v-mn)/sp)*(H-44);
  const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const ar=`M${x(0).toFixed(1)} ${H-20} `+pts.map((p,i)=>`L${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ")+` L${x(pts.length-1).toFixed(1)} ${H-20} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <text x="2" y="${(y(mx)+3).toFixed(1)}">${(+mx.toFixed(1))}</text>
    <text x="2" y="${(y(mn)+3).toFixed(1)}">${(+mn.toFixed(1))}</text>
    <path d="${ar}" fill="${color}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.8" fill="${color}"/>`).join("")}
    ${pts.map((p,i)=>`<text x="${x(i).toFixed(1)}" y="${H-5}" text-anchor="middle">W${p.w+1}</text>`).join("")}</svg>`;
}

    DB.chat.push({r:"assistant",c:"**Fehler:** "+msg+"\n\n"+hint});

async function callAI(){
  const p=DB.prov,c=PROV[p],key=DB.keys[p],m=mdl(p);
  const hist=DB.chat.slice(-10).map(x=>({role:x.r,content:x.c}));
  let res,d;
  if(p==="gemini"){
    res=await fetch(c.base+m+":generateContent?key="+encodeURIComponent(key),{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},
        contents:hist.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]}))})});
    d=await res.json(); if(d.error)throw new Error(d.error.message);
    return d.candidates?.[0]?.content?.parts?.[0]?.text||"Keine Antwort.";
  }
  if(p==="anthropic"){
    res=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:m,max_tokens:1024,system:SYS(),messages:hist})});
    d=await res.json(); if(d.error)throw new Error(d.error.message);
    return d.content?.find(x=>x.type==="text")?.text||"Keine Antwort.";
  }
  res=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:m,max_tokens:1024,messages:[{role:"system",content:SYS()},...hist]})});
  d=await res.json(); if(d.error)throw new Error(d.error.message);
  return d.choices?.[0]?.message?.content||"Keine Antwort.";
}

/* Client-ID der Spotify-App. Sie ist für öffentliche Anwendungen gedacht und
   darf in der Datei stehen. Das Client Secret gehört hier bewusst nicht hinein –
   der verwendete PKCE-Ablauf kommt ohne aus, und ein Secret in einer
   ausgelieferten Datei wäre für jeden lesbar. */
const SP_CID="304eeb30d27147f8a2f553c260a11b26";
/* Client Secret auf Wunsch hinterlegt. Der PKCE-Ablauf braucht es nicht und
   schickt es auch nirgends mit – die Anmeldung läuft über einen einmaligen
   Prüfcode. Wer die Datei öffnet, kann es lesen; bei öffentlicher Adresse
   also im Spotify-Dashboard erneuern. */
const SP_SECRET="57a8909e51aa417ea63b58e8c56ff57e";
const SPd=()=>{
  DB.sp[me()]=DB.sp[me()]||{};
  if(!DB.sp[me()].cid)DB.sp[me()].cid=SP_CID;
  return DB.sp[me()];
};
const spOK=()=>{const s=SPd();return s.tok&&Date.now()<s.exp;};
async function pkce(){
  const v=[...crypto.getRandomValues(new Uint8Array(48))].map(b=>("0"+b.toString(16)).slice(-2)).join("");
  const dg=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  return{v,c:btoa(String.fromCharCode(...new Uint8Array(dg))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
}
async function spLogin(){
  const s=SPd(); if(!s.cid){toast("Erst Client ID eintragen");return;}
  const{v,c}=await pkce();
  sessionStorage.setItem("sp_v",v);sessionStorage.setItem("sp_who",me());
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({
    client_id:s.cid,response_type:"code",redirect_uri:location.origin+location.pathname,
    code_challenge_method:"S256",code_challenge:c,
    scope:"user-read-playback-state user-modify-playback-state"});
}
async function spCallback(){
  const code=new URLSearchParams(location.search).get("code"); if(!code)return;
  const v=sessionStorage.getItem("sp_v"),who=sessionStorage.getItem("sp_who")||me();
  history.replaceState({},"",location.pathname);
  const s=DB.sp[who]||{}; if(!v||!s.cid)return;
  try{
    const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:s.cid,grant_type:"authorization_code",code,
        redirect_uri:location.origin+location.pathname,code_verifier:v})});
    const d=await r.json();
    if(d.access_token){s.tok=d.access_token;s.ref=d.refresh_token;s.exp=Date.now()+(d.expires_in-60)*1000;
      DB.sp[who]=s;save();toast("Spotify verbunden");}
  }catch(e){toast("Spotify-Login fehlgeschlagen");}
}
async function spRefresh(){
  const s=SPd(); if(!s.ref||!s.cid)return false;
  try{
    const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:s.cid,grant_type:"refresh_token",refresh_token:s.ref})});
    const d=await r.json();
    if(d.access_token){s.tok=d.access_token;s.exp=Date.now()+(d.expires_in-60)*1000;
      if(d.refresh_token)s.ref=d.refresh_token;save();return true;}
  }catch(e){}
  return false;
}
async function spCall(path,method="GET"){
  if(!spOK()&&!await spRefresh())return null;
  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+SPd().tok}});
  if(r.status===204||r.status===202)return{};
  if(!r.ok)return null;
  try{return await r.json();}catch(e){return{};}
}

function rGyms(){
  mergeCustomEq();
  const g=curGym();
  const custom=Object.keys(DB.customEq||{});
  let h=back+`<h1 style="font-size:25px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px">Gyms &amp; Geräte</h1>
    <div style="font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:16px">
    Markiere, was tatsächlich dasteht. Fehlt ein Gerät für eine geplante Übung, schlägt die App
    im Plan eine Alternative vor und empfiehlt dir das Gym, in dem die Einheit am besten läuft.</div>
    <div class="gymbar">`;
  DB.gyms.forEach(x=>h+=`<button class="${x.id===DB.gym?"on":""}" data-g="${x.id}">${esc(x.n.replace("Speedfit ","SF "))}<span class="gl">${x.eq.length} Geräte</span></button>`);
  h+=`</div>
    <div class="card">
      <div class="lbl">Name</div>
      <input class="inp" id="gname" value="${esc(g.n)}" style="width:100%;margin-bottom:8px">
      <div class="lbl">Kurzbeschreibung</div>
      <input class="inp" id="gsub" value="${esc(g.s)}" style="width:100%"></div>
    <div class="card"><h4>Eigenes Gerät ergänzen</h4>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-bottom:10px">
      Was hier fehlt, trägst du selbst ein. Eigene Geräte landen im Export und in der Geräteliste,
      die du Coach Marcus schicken kannst.</div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="neweq" placeholder="z.B. Belt Squat Maschine" style="flex:1">
        <button class="btn btn-go" id="addeq" style="width:auto;margin:0;padding:0 18px">Hinzufügen</button>
      </div></div>`;
  if(custom.length){
    h+=`<div class="sec">Eigene Geräte</div><div class="eqgrid">`;
    custom.forEach(t=>h+=`<button class="eqi${g.eq.includes(t)?" has":""}" data-eq="${t}">${esc(DB.customEq[t])}
      <span data-del="${t}" style="color:var(--red);margin-left:7px">×</span></button>`);
    h+=`</div>`;
  }
  EQGROUPS.forEach(([title,list])=>{
    const have=list.filter(t=>g.eq.includes(t)).length;
    h+=`<div class="sec">${title} <span class="sx">· ${have} von ${list.length}</span></div><div class="eqgrid">`;
    list.forEach(t=>h+=`<button class="eqi${g.eq.includes(t)?" has":""}" data-eq="${t}">${esc(eqLabel(t))}</button>`);
    h+=`</div>`;
    const defs=list.filter(t=>EQDEF[t]);
    if(defs.length){
      h+=`<button class="mi" data-eqgrp="${esc(title)}" style="margin:6px 0 0;padding:8px 12px">
        <span class="mg" style="font-size:12px;color:var(--dim)">?</span>
        <span class="md" style="font-size:12.5px">Was ist was?<div class="ms">${defs.length} Geräte erklärt</div></span>
        <span class="ma" style="font-size:11px">zeigen</span></button>
        <div id="eqg-${esc(title)}" style="display:none">`;
      defs.forEach(t=>h+=`<div style="padding:9px 12px;border-bottom:1px solid var(--line)">
        <div style="font-size:13px;font-weight:550;color:${g.eq.includes(t)?"var(--me)":"var(--ink)"}">${esc(eqLabel(t))}</div>
        <div style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-top:3px">${esc(EQDEF[t])}</div></div>`);
      h+=`</div>`;
    }
  });
  h+=`<div style="height:16px"></div>
    <button class="btn" id="gcopy">Geräteliste als Text kopieren</button>
    <button class="btn" id="gwa">Geräteliste an WhatsApp</button>
    <button class="btn" id="gall">Alle auswählen</button>
    <button class="btn" id="gnone">Alle abwählen</button>`;
  document.getElementById("p-mehr").innerHTML=h;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{DB.gym=b.dataset.g;save();rGyms();scrollTop();});
  document.querySelectorAll("[data-eqgrp]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById("eqg-"+b.dataset.eqgrp);
    if(el)el.style.display=el.style.display==="none"?"block":"none";});
  document.querySelectorAll("[data-eq]").forEach(b=>b.onclick=ev=>{
    if(ev.target.dataset.del){
      const t=ev.target.dataset.del;
      delete DB.customEq[t]; delete EQ[t];
      DB.gyms.forEach(x=>{const i=x.eq.indexOf(t);if(i>=0)x.eq.splice(i,1);});
      save();rGyms();return;
    }
    const t=b.dataset.eq,i=g.eq.indexOf(t);
    if(i>=0)g.eq.splice(i,1);else g.eq.push(t);
    save();rGyms();});
  document.getElementById("gname").oninput=e=>{g.n=e.target.value;save();};
  document.getElementById("gsub").oninput=e=>{g.s=e.target.value;save();};
  document.getElementById("addeq").onclick=()=>{
    const el=document.getElementById("neweq"), v=el.value.trim();
    if(!v){toast("Keine Bezeichnung eingegeben");return;}
    const id="x_"+v.toLowerCase().replace(/[^a-z0-9äöüß]+/g,"_").slice(0,28);
    DB.customEq=DB.customEq||{}; DB.customEq[id]=v; EQ[id]=v;
    if(!g.eq.includes(id))g.eq.push(id);
    save();rGyms();toast(v+" ergänzt");};
  document.getElementById("gall").onclick=()=>{g.eq=[...EQ_ORDER()];save();rGyms();};
  document.getElementById("gnone").onclick=()=>{g.eq=[];save();rGyms();};
  document.getElementById("gcopy").onclick=async()=>{
    const t=gymText();
    try{await navigator.clipboard.writeText(t);toast("Geräteliste kopiert");}
    catch(e){showModal(`<h3>Geräteliste</h3><textarea class="ta" style="min-height:260px">${esc(t)}</textarea><button class="btn" onclick="closeModal()">Schließen</button>`);}};
  document.getElementById("gwa").onclick=()=>waSend(gymText());
}
function gymText(){
  mergeCustomEq();
  let out=["Geräteliste Hybrid – Stand "+new Date().toLocaleDateString("de-DE")];
  DB.gyms.forEach(g=>{
    out.push("");
    out.push(g.n+" ("+g.s+") – "+g.eq.length+" Geräte:");
    EQGROUPS.forEach(([title,list])=>{
      const have=list.filter(t=>g.eq.includes(t)).map(eqLabel);
      if(have.length)out.push("  "+title+": "+have.join(", "));
    });
    const cust=g.eq.filter(t=>DB.customEq&&DB.customEq[t]).map(eqLabel);
    if(cust.length)out.push("  Selbst ergänzt: "+cust.join(", "));
  });
  return out.join("\n");
}

        return `<div class="erow"><span class="elbl" style="width:92px">${PATHS[ex].n}</span>
          <button class="opt" data-woff="${ex}|-1">−</button>
          <span class="num" style="flex:1;text-align:center;font-size:12.5px">${nxt.n}${off?` (${off>0?"+":""}${off})`:""}</span>
          <button class="opt" data-woff="${ex}|1">+</button></div>`;}).join("")}
    </div>
    <div class="card"><h4>Bestwerte der drei Hauptlifts</h4>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-bottom:12px">
      Trag ein, was du aktuell einmal sauber schaffst. Daraus rechnet die App die Zielgewichte
      für jede Woche aus. Weißt du es nicht genau, schätze lieber etwas zu niedrig –
      die erste Welle korrigiert sich von selbst nach oben.</div>
      ${BIG3.map(ex=>{
        const mx=bestMax(a,ex), man=(DB.maxes&&DB.maxes[a]&&DB.maxes[a][ex])||"";
        return `<div class="frow"><label>${EX[ex].n}${mx?` · aktuell geschätzt ${Math.round(mx)} kg`:""}</label>
        <input class="inp num" type="number" inputmode="decimal" data-mx="${ex}" value="${esc(man)}" placeholder="kg einmal maximal" style="width:100%"></div>`;
      }).join("")}
      <div style="font-size:12px;color:var(--dim);line-height:1.55">
      Sobald du Sätze protokollierst, nimmt die App automatisch den höheren Wert aus eingetragenem
      Maximum und errechnetem Bestwert.<br><br>
      ${HYP_ATH.includes(a)
        ? `Deine Welle ist auf Muskelaufbau ausgelegt, nicht auf Maximalkraft: 4 × 10 bei 66 %,
           dann 4 × 12 bei 68 %, dann 4 × 8 bei 78 %, danach eine Entlastung mit 3 × 10 bei 58 %.
           Moderate Last, viel Volumen, zweieinhalb Minuten Pause. Schaffst du am schweren Tag alle
           Sätze sauber, erhöhe dein Maximum um 2,5 kg.`
        : `Die Welle läuft über vier Durchgänge: 4 × 5 bei 78 %, dann 4 × 4 bei 83 %, dann 5 × 3 bei 88 %,
           danach eine Entlastung mit 3 × 5 bei 65 %. Schaffst du in der Spitzenwoche alle Sätze
           sauber, erhöhe dein eingetragenes Maximum um 2,5 bis 5 kg – die nächste Welle rechnet
           dann von dort aus weiter.`}</div>
    </div>
    <div class="card"><h4>Körpergewicht & Long Run</h4>
      <div class="frow"><label>Körpergewicht in kg</label>
        <input class="inp num" type="number" inputmode="decimal" id="pbw" value="${DB.bw[a]||""}" style="width:100%"></div>
      <div class="r2">
        <div class="frow"><label>Startdistanz km</label>
          <input class="inp num" type="number" id="plb" value="${DB.longBase[a]||12}" style="width:100%"></div>
        <div class="frow"><label>Maximum km</label>
          <input class="inp num" type="number" id="plm" value="${DB.longMax[a]||20}" style="width:100%"></div>
      </div>
      <div style="font-size:12px;color:var(--dim);line-height:1.55">
      Der Long Run wächst um einen Kilometer pro Woche bis zum Maximum. Jede vierte Woche fällt er
      auf siebzig Prozent zurück – diese Entlastung ist der Grund, warum der Aufbau überhaupt trägt.
      Diese Woche: <b style="color:var(--me)">${longRun(a,todayISO())} km</b>.</div>
    </div>`;
  document.getElementById("p-mehr").innerHTML=h;
  const pz=(id,arr,ix)=>{const el=document.getElementById(id);
    el.oninput=()=>{const m=el.value.match(/^(\d+):(\d{1,2})$/);
      if(m){arr[ix]=+m[1];arr[ix+1]=+m[2];save();}};};
  pz("z0",z.esy,0);pz("z1",z.esy,2);pz("z2",z.tmp,0);pz("z3",z.tmp,2);pz("z4",z.ivl,0);pz("z5",z.ivl,2);
  document.querySelectorAll("[data-mx]").forEach(el=>el.oninput=()=>{
    DB.maxes=DB.maxes||{}; DB.maxes[a]=DB.maxes[a]||{};
    if(el.value)DB.maxes[a][el.dataset.mx]=parseFloat(el.value);
    else delete DB.maxes[a][el.dataset.mx];
    save();});
  document.getElementById("pbw").oninput=e=>{DB.bw[a]=parseFloat(e.target.value)||DB.bw[a];save();};
  document.getElementById("plb").oninput=e=>{DB.longBase[a]=parseFloat(e.target.value)||DB.longBase[a];save();};
  document.getElementById("plm").oninput=e=>{DB.longMax[a]=parseFloat(e.target.value)||DB.longMax[a];save();};
}

/* ─── Zyklusstart ─── */
function rStart(){return rZyklus();}
function delTpl(i){
  DB.templates.splice(i,1);save();closeModal();rCustom();toast("Vorlage gelöscht");
}
/* Auswahlliste für Zyklusplätze und Wochentage */
function pickerHTML(title,call,extra){
  const q=s=>`${call}'${s}')`;
  let m=`<h3>${esc(title)}</h3>
    <p style="font-size:12.5px;color:var(--mid);line-height:1.6;margin-bottom:12px">
    Was soll hier stehen?</p>
    <div class="sec" style="margin:4px 0 7px">Pause und Lauf</div>
    <button class="btn" onclick="${q("rest")}">Ruhetag</button>
    <button class="btn" onclick="${q("long")}">Long Run</button>
    <div class="sec" style="margin:14px 0 7px">Aus dem Zyklus</div>`;
  SLOTS.forEach((s,i)=>{
    if(s.k==="rest")return;
    m+=`<button class="btn" onclick="${call}${i})" style="color:${s.k==="lauf"?"var(--yara)":"var(--yuan)"}">${esc(s.n)}</button>`;
  });
  m+=`<div class="sec" style="margin:14px 0 7px">Fertige Trainings</div>`;
  PRESETS.forEach(p=>m+=`<button class="btn" onclick="${q("P:"+p.n.replace(/['"\\]/g,""))}" style="color:var(--both)">${esc(p.n)}</button>`);
  const tps=DB.templates||[];
  if(tps.length){
    m+=`<div class="sec" style="margin:14px 0 7px">Eigene Vorlagen</div>`;
    tps.forEach(t=>m+=`<button class="btn" onclick="${q("t:"+t.name.replace(/['"\\]/g,""))}" style="color:var(--ok)">${esc(t.name)}</button>`);
  }
  m+=`<div class="sec" style="margin:14px 0 7px">Neu</div>
    <button class="btn" onclick="closeModal();newTemplate()">Vorlage erstellen</button>
    <button class="btn" onclick="closeModal();go('mehr','vorlagen')">Bibliothek öffnen</button>
    <div style="height:8px"></div>${extra||""}<button class="btn" onclick="closeModal()">Abbrechen</button>`;
  return m;
}
function setRoll(i,v){
  const a=me(), c=cyc(a), RP=[...rollPlanOf(a)];
  RP[i]=v;
  DB.cycle=DB.cycle||{};
  DB.cycle[a]=Object.assign({},DB.cycle[a]||{},{rollPlan:RP});
  save();closeModal();rZyklus();
}
function rmRoll(i){
  const a=me(), c=cyc(a), RP=[...rollPlanOf(a)];
  if(RP.length<=3){toast("Mindestens drei Plätze");closeModal();return;}
  RP.splice(i,1);
  DB.cycle=DB.cycle||{};
  DB.cycle[a]=Object.assign({},DB.cycle[a]||{},{rollPlan:RP});
  save();closeModal();rZyklus();toast("Platz entfernt");
}
function setFix(wd,v){
  const a=me(), c=cyc(a);
  const fp=[...(c.fixPlan||["long",0,"rest",2,1,3,"rest"])];
  fp[wd]=v;
  DB.cycle=DB.cycle||{};
  DB.cycle[a]=Object.assign({},DB.cycle[a]||{},{fixPlan:fp});
  save();closeModal();rZyklus();
}
function rZyklus(){
  const a=me(), c=cyc(a);
  const KINDS={kraft:["Kraft","var(--yuan)"],lauf:["Lauf","var(--yara)"],rest:["Ruhetag","var(--dim)"],long:["Long Run","var(--both)"]};
  let h=back+`<h1 style="font-size:25px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px">Zyklus &amp; Ruhetage</h1>
    <div style="font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:16px">
    Jeder von euch kann einen eigenen Rhythmus fahren. Die Einstellungen gelten für
    <b style="color:var(--me)">${ANAME[a]}</b> – oben im Kopf wechseln, um den anderen zu ändern.</div>

    <div class="card"><div class="lbl">Startdatum</div>
      <input class="inp" type="date" id="sdate" value="${DB.start}" style="width:100%">
      <div style="font-size:12px;color:var(--dim);line-height:1.55;margin-top:9px">
      Gilt für beide. Ab hier zählt der Zyklus.</div></div>

    ${((DB.cycle||{})[a])?`<div class="card" style="border-color:var(--warn)">
      <div style="font-size:12.5px;color:var(--warn);line-height:1.6">
      Für ${ANAME[a]} ist eine eigene Einstellung gespeichert. Sie hat Vorrang vor der
      Vorgabe aus dem Trainingsplan.</div>
      <button class="btn" id="creset2" style="margin:11px 0 0">Auf die Planvorgabe zurücksetzen</button></div>`:""}
    <div class="card"><h4>Rhythmus</h4>
      <div class="seg" style="margin-bottom:10px">
        <button data-cm="roll" aria-pressed="${c.mode==="roll"}">Wandernd</button>
        <button data-cm="week" aria-pressed="${c.mode==="week"}">Rollierend</button>
        <button data-cm="fix" aria-pressed="${c.mode==="fix"}">Fest</button>
      </div>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.6">${
        c.mode==="roll"
        ? `Die ${SLOTS.length} Plätze rücken an jedem Trainingstag einen weiter. Eine Runde dauert rund ${Math.round(SLOTS.length*7/5)} Tage und beginnt jedes Mal an einem anderen Wochentag. Die meiste Abwechslung, dafür kein planbarer Wochenrhythmus.`
        : c.mode==="week"
        ? `Jeder Wochentag hat eine feste Rolle – Montag ist immer Kraft, Donnerstag immer Lauf. Welche Krafteinheit am Montag ansteht, rotiert aber weiter. Planbarer Rhythmus bei wechselnden Inhalten.`
        : `Jeder Wochentag hat dauerhaft dieselbe Einheit. Montag ist immer derselbe Trainingstag, Woche für Woche. Am besten planbar und am leichtesten zu vergleichen – dafür kommen nur so viele Einheiten vor, wie du Wochentage belegst.`}</div></div>`;

  if(c.mode==="roll"){
    const RP=rollPlanOf(a);
    // An welchem Wochentag landet welcher Platz als nächstes?
    const nextWd={};
    for(let i=0;i<90;i++){
      const dt=new Date();dt.setDate(dt.getDate()+i);
      const e=schedEntry(iso(dt),a);
      if(e&&e.pos>=0&&nextWd[e.pos]===undefined)nextWd[e.pos]={wd:dt.getDay(),d:iso(dt)};
    }
    h+=`<div class="sec">Zyklus · ${RP.length} Plätze</div>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-4px 2px 10px">
      Die Plätze rücken an jedem Trainingstag einen weiter. In Klammern steht, auf welchen
      Wochentag der Platz das nächste Mal fällt – das verschiebt sich mit jeder Runde.</div>`;
    RP.forEach((v,i)=>{
      const [t,col]=entryLabel(v);
      const nx=nextWd[i];
      h+=`<button class="mi" data-rp="${i}" style="margin-bottom:6px">
        <span class="mg" style="color:${col}">${i+1}</span>
        <span class="md">Tag ${i+1}<div class="ms" style="color:${col}">${esc(t)}${
          nx?` <span style="color:var(--dim)">(nächstes Mal ${WD[nx.wd]}, ${new Date(nx.d+"T12:00:00").getDate()}.${new Date(nx.d+"T12:00:00").getMonth()+1}.)</span>`:""}</div></span>
        <span class="ma">ändern</span></button>`;
    });
    h+=`<div class="r2" style="margin-top:4px">
      <button class="btn" id="rpadd" style="margin:0">Platz hinzufügen</button>
      <button class="btn" id="rprm" style="margin:0"${RP.length<=3?" disabled":""}>Letzten entfernen</button>
    </div>`;
    const nK=RP.filter(v=>entryKind(v)==="kraft").length;
    const nL=RP.filter(v=>entryKind(v)==="lauf").length;
    const nR=RP.filter(v=>entryKind(v)==="rest").length;
    const fixedR=(c.rest||[]).length, hasLong=(c.longDay>=0);
    const perRunde=Math.round(RP.length*7/Math.max(1,7-fixedR-(hasLong?1:0))*10)/10;
    h+=`<div class="card" style="margin-top:10px"><h4>Was das ergibt</h4>
      <div style="font-size:13px;color:var(--mid);line-height:1.8">
      Pro Runde: ${nK} Kraft · ${nL} Lauf · ${nR} Ruhetage<br>
      Eine Runde dauert rund ${perRunde} Kalendertage${fixedR||hasLong?", weil feste Wochentage dazwischenliegen":""}.</div>
      ${nR===0?`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:9px">
      Kein Ruhetag im Zyklus. Nur sinnvoll, wenn du feste Ruhetage über die Wochentage gesetzt hast.</div>`:""}
      ${nK/Math.max(1,nK+nL)>0.8?`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:9px">
      Über achtzig Prozent Kraft. Für den Ausdaueraufbau ist das wenig.</div>`:""}</div>`;
  }
  else if(c.mode==="fix"){
    const fp=c.fixPlan||[];
    const lbl=v=>{
      if(v==="rest"||v===undefined)return ["Ruhetag","var(--dim)"];
      if(v==="long")return ["Long Run","var(--both)"];
      if(typeof v==="string"&&v[0]==="p")return [(PRESETS[+v.slice(1)]||{n:"Vorlage"}).n,"var(--both)"];
      if(typeof v==="string"&&v[0]==="t")return [v.slice(2),"var(--ok)"];
      return SLOTS[+v]?[SLOTS[+v].n,SLOTS[+v].k==="lauf"?"var(--yara)":"var(--yuan)"]:["Ruhetag","var(--dim)"];
    };
const riZ=raceInfo(a);
    h+=`<div class="sec">Feste Wochenbelegung</div>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-4px 2px 10px">
      Tippe einen Tag an und wähle, was dort künftig jede Woche steht.${
        riZ&&!riZ.past&&phaseAuto(a)
        ? ` <span style="color:var(--both)">Aktuell steuert die Wettkampf-Automatik diese Belegung (Phase ${esc(riZ.phase.n)}). Sobald du etwas änderst, schaltet sie sich ab.</span>`
        : ""}</div>`;
    [1,2,3,4,5,6,0].forEach(wd=>{
      const [t,col]=lbl(fp[wd]);
      h+=`<button class="mi" data-fp="${wd}" style="margin-bottom:6px">
        <span class="mg" style="color:${col}">●</span>
        <span class="md">${WDL[wd]}<div class="ms" style="color:${col}">${esc(t)}</div></span>
        <span class="ma">ändern</span></button>`;
    });
    const slotVals=fp.filter(v=>typeof v==="number"||(typeof v==="string"&&/^\d+$/.test(v)));
    const used=new Set(slotVals.map(Number));
    const fehlt=SLOTS.map((s,i)=>i).filter(i=>!used.has(i)&&SLOTS[i].k!=="rest");
    const isTpl=v=>typeof v==="string"&&(v[0]==="p"||v[0]==="t")&&v!=="rest";
    const nK=fp.filter(v=>isTpl(v)||(SLOTS[+v]&&SLOTS[+v].k==="kraft")).length;
    const nL=fp.filter(v=>v==="long"||(!isTpl(v)&&v!=="rest"&&SLOTS[+v]&&SLOTS[+v].k==="lauf")).length;
    const nR=fp.filter(v=>v==="rest"||v===undefined).length;
    h+=`<div class="card" style="margin-top:10px"><h4>Ergibt pro Woche</h4>
      <div style="font-size:13px;color:var(--mid);line-height:1.8">
      ${nK} Krafteinheiten · ${nL} Läufe · ${nR} Ruhetage</div>
      ${fehlt.length?`<div style="font-size:12.5px;color:var(--warn);line-height:1.6;margin-top:9px">
      Aus dem Zyklus kommen damit nie vor: ${fehlt.map(i=>SLOTS[i].n).join(", ")}.
      Bei wenigen Trainingstagen ist das unvermeidbar – entscheide bewusst, worauf du verzichtest.</div>`:""}
      ${nR<2?`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:8px">
      Weniger als zwei Ruhetage pro Woche. Kurzfristig machbar, über Monate nicht.</div>`:""}</div>`;
  }
  else if(c.mode==="week"){
    h+=`<div class="sec">Wochenstruktur</div>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-4px 2px 10px">
      Tippe einen Tag an, um seine Rolle zu wechseln.</div>`;
    [1,2,3,4,5,6,0].forEach(wd=>{
      const kind=(wd===c.longDay)?"long":((c.rest||[]).includes(wd)?"rest":((c.plan||[])[wd]||"rest"));
      const k=KINDS[kind];
      h+=`<button class="mi" data-wd="${wd}" style="margin-bottom:6px">
        <span class="mg" style="color:${k[1]}">●</span>
        <span class="md">${WDL[wd]}<div class="ms" style="color:${k[1]}">${k[0]}</div></span>
        <span class="ma">wechseln</span></button>`;
    });
    const cnt={};
    [0,1,2,3,4,5,6].forEach(wd=>{
      const kind=(wd===c.longDay)?"long":((c.rest||[]).includes(wd)?"rest":((c.plan||[])[wd]||"rest"));
      cnt[kind]=(cnt[kind]||0)+1;});
    h+=`<div class="card" style="margin-top:10px"><h4>Ergibt pro Woche</h4>
      <div style="font-size:13px;color:var(--mid);line-height:1.8">
      ${cnt.kraft||0} Krafteinheiten · ${(cnt.lauf||0)+(cnt.long||0)} Läufe · ${cnt.rest||0} Ruhetage</div>
      ${(cnt.rest||0)<2?`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:8px">
      Weniger als zwei Ruhetage pro Woche. Das geht kurzfristig, aber nicht über Monate.</div>`:""}
      ${(cnt.kraft||0)>4?`<div style="font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:8px">
      Mehr als vier Krafttage pro Woche bei gleichzeitigem Laufen ist viel. Beobachte die Check-in-Werte.</div>`:""}</div>`;
  } else {
    h+=`<div class="sec">Feste Tage</div>
      <div style="font-size:12.5px;color:var(--mid);line-height:1.55;margin:-4px 2px 10px">
      Diese Tage überschreiben den wandernden Zyklus.</div>`;
    [1,2,3,4,5,6,0].forEach(wd=>{
      const isLong=wd===c.longDay, isRest=(c.rest||[]).includes(wd);
      const lbl=isLong?"Long Run":isRest?"Ruhetag":"aus dem Zyklus";
      const col=isLong?"var(--both)":isRest?"var(--dim)":"var(--mid)";
      h+=`<button class="mi" data-fx="${wd}" style="margin-bottom:6px">
        <span class="mg" style="color:${col}">●</span>
        <span class="md">${WDL[wd]}<div class="ms" style="color:${col}">${lbl}</div></span>
        <span class="ma">wechseln</span></button>`;
    });
  }

  h+=`<div class="sec">Vorschau nächste 14 Tage</div><div class="card">`;
  for(let i=0;i<14;i++){
    const dt=new Date();dt.setDate(dt.getDate()+i);
    const ds=iso(dt), s=sessionFor(ds,a);
    const col=s.k==="rest"?"var(--dim)":s.k==="lauf"?"var(--yara)":"var(--yuan)";
    h+=`<div style="display:flex;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)">
      <span style="width:62px;color:var(--dim)">${WD[dt.getDay()]} ${dt.getDate()}.${dt.getMonth()+1}.</span>
      <span style="flex:1;color:${col}">${esc(s.n)}</span></div>`;
  }
  h+=`</div><button class="btn" id="creset">Auf Standard zurücksetzen</button>`;
  document.getElementById("p-mehr").innerHTML=h;

  /* Nur die tatsächlich geänderten Werte ablegen. Würde hier der ganze
     zusammengesetzte Stand gespeichert, fröre jede Berührung die damaligen
     Vorgaben ein – spätere Planänderungen kämen nie mehr an. */
  const setC=(patch)=>{
    DB.cycle=DB.cycle||{};
    const eigen=Object.assign({},DB.cycle[a]||{},patch);
    delete eigen.phasePlans;
    DB.cycle[a]=eigen;
    save();rZyklus();
  };
  document.getElementById("sdate").onchange=ev=>{
    if(ev.target.value){DB.start=ev.target.value;save();rZyklus();toast("Start neu gesetzt");}};
  document.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{
    const m=b.dataset.cm, c2=cyc(a);
    if(m==="week"&&!c2.plan)setC({mode:m,plan:["long","kraft","rest","kraft","lauf","kraft","rest"]});
    else if(m==="fix"&&!c2.fixPlan)setC({mode:m,fixPlan:["long",0,"rest",2,1,3,"rest"]});
    else setC({mode:m});});
  document.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{
    const wd=+b.dataset.wd, c2=cyc(a);
    const order=["kraft","lauf","rest","long"];
    let cur=(wd===c2.longDay)?"long":((c2.rest||[]).includes(wd)?"rest":((c2.plan||[])[wd]||"rest"));
    const next=order[(order.indexOf(cur)+1)%order.length];
    const plan=[...(c2.plan||["long","kraft","rest","kraft","lauf","kraft","rest"])];
    let rest=(c2.rest||[]).filter(x=>x!==wd), longDay=c2.longDay;
    plan[wd]=next;
    if(next==="rest")rest=[...rest,wd];
    if(next==="long"){
      longDay=wd;
      // alter Long-Run-Tag wird Krafttag
      if(c2.longDay!==wd)plan[c2.longDay]="kraft";
    } else if(longDay===wd)longDay=-1;
    setC({plan,rest,longDay});});
  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.rp;
    showModal(pickerHTML(`Tag ${i+1} im Zyklus`,`setRoll(${i},`,
      `<button class="btn btn-r" onclick="rmRoll(${i})">Diesen Platz entfernen</button>`));});
  document.getElementById("rpadd")?.addEventListener("click",()=>{
    const c2=cyc(a), RP=[...rollPlanOf(a)];
    RP.push("rest");
    DB.cycle=DB.cycle||{};DB.cycle[a]=Object.assign({},c2,{rollPlan:RP});save();rZyklus();
    toast("Platz "+RP.length+" hinzugefügt");});
  document.getElementById("rprm")?.addEventListener("click",()=>{
    const c2=cyc(a), RP=[...rollPlanOf(a)];
    if(RP.length<=3){toast("Mindestens drei Plätze");return;}
    RP.pop();
    DB.cycle=DB.cycle||{};DB.cycle[a]=Object.assign({},c2,{rollPlan:RP});save();rZyklus();});

    if(longDay===wd){longDay=-1;}

function restSwap(date){
  const tps=DB.templates||[];
  let m=`<h3>Training statt Ruhetag</h3>

    Mit einem Knopf kommst du jederzeit zurück zum Ruhetag.</p>
    <div class="sec" style="margin:4px 0 7px">Aus dem Zyklus</div>`;
  SLOTS.forEach((s,i)=>{
    if(s.k==="rest")return;
    m+=`<button class="btn" onclick="restPut('${date}','${i}')" style="color:${s.k==="lauf"?"var(--yara)":"var(--yuan)"}">${esc(s.n)}</button>`;
  });
  m+=`<div class="sec" style="margin:14px 0 7px">Fertige Trainings</div>`;
  PRESETS.forEach(p=>m+=`<button class="btn" onclick="restPut('${date}','P:${p.n.replace(/['"\\]/g,"")}')" style="color:var(--both)">${esc(p.n)}</button>`);

  }

    <div style="height:8px"></div><button class="btn" onclick="closeModal()">Abbrechen</button>`;
  showModal(m);
}
function restUndo(date){
  const a=me();
  if(DB.custom&&DB.custom[date]){
    delete DB.custom[date][a];
    if(!Object.keys(DB.custom[date]).length)delete DB.custom[date];
  }
  save();renderHeute();toast("Wieder Ruhetag");
}
function restPut(date,ref){
  const a=me();
  let src=null;
  if(ref.slice(0,2)==="P:")src=PRESETS.find(p=>p.n===ref.slice(2));
  else if(ref.slice(0,2)==="t:")src=(DB.templates||[]).find(t=>t.name===ref.slice(2));
  else{
    const s=SLOTS[+ref];
    if(s){
      const lead=(s.lead||[]).map(x=>({e:x.e,s:x.s,r:x.r,p:x.p,unit:x.unit,sch:x.sch}));
      const acc=((a==="yuan"?(s.yuanA||s.yuan):(s.yaraA||s.yara))||[])
        .map(x=>({e:x.e,s:x.s,r:x.r,p:x.p,unit:x.unit}));
      src={n:s.n,w:s.warm,items:[...lead,...acc]};
    }
  }
  if(!src||!(src.items||[]).length){toast("Nicht gefunden");closeModal();return;}
  DB.custom=DB.custom||{};DB.custom[date]=DB.custom[date]||{};
  DB.custom[date][a]={name:src.n||src.name,k:"kraft",warm:src.w||src.warm||"mixed",
    items:JSON.parse(JSON.stringify(src.items)),restSwap:1};
  save();closeModal();
  selDate=date;switchPage("heute");
  toast((src.n||src.name)+" eingesetzt");
}

   Mehrfachwiederholungen zwei Wiederholungen vor dem Versagen und

];
const TESTGROUPS=[["kraft","Kraft"],["lauf","Ausdauer"],["koerper","Körper"]];
const TESTIVL=6;   // Wochen zwischen zwei Messungen

function testsOf(a){return (DB.tests||[]).filter(t=>t.ath===a).sort((x,y)=>x.date<y.date?1:-1);}
function lastTest(a){return testsOf(a)[0]||null;}
function weeksSinceTest(a){
  const t=lastTest(a);
  if(!t)return 999;
  return Math.floor((new Date(todayISO())-new Date(t.date))/(7*86400000));
}
function newTest(a){
  DB.tests=DB.tests||[];
  const t={id:"t"+Date.now(),ath:a,date:todayISO(),v:{}};
  DB.tests.push(t);save();return t;
}
/* Epley-Hochrechnung aus Gewicht und Wiederholungen */
function testMax(v){
  const w=parseFloat(v&&v.kg), r=parseInt(v&&v.reps,10);
  if(isNaN(w)||isNaN(r)||w<=0)return 0;
  return Math.round(e1rm(w,r)*10)/10;
}
/* Tempozonen aus der 2000-Meter-Zeit ableiten */
function zonesFrom2k(mmss){
  const m=String(mmss||"").match(/^(\d+):(\d{1,2})$/);
  if(!m)return null;
  const sec=(+m[1])*60+(+m[2]);
  const perKm=sec/2;                       // Sekunden pro Kilometer
  const f=s=>[Math.floor(s/60),Math.round(s%60)];
  const esy=perKm+67, tmp=perKm+25, ivl=perKm+2;
  return {esy:[...f(esy-10),...f(esy+20)], tmp:[...f(tmp-5),...f(tmp+10)], ivl:[...f(ivl-7),...f(ivl+8)]};
}
function applyTest(tid){
  const t=(DB.tests||[]).find(x=>x.id===tid);
  if(!t)return;
  const a=t.ath;
  let n=0;
  ["squat","bench","deadlift"].forEach(k=>{
    const mx=testMax(t.v[k]);
    if(mx){DB.maxes=DB.maxes||{};DB.maxes[a]=DB.maxes[a]||{};DB.maxes[a][k]=mx;n++;}
  });
  const hm=parseInt((t.v.hrmax||{}).kg,10);
  if(hm>120&&hm<230){DB.hrmax=DB.hrmax||{};DB.hrmax[a]=hm;n++;}
  const bw=parseFloat((t.v.bw||{}).kg);
  if(bw){DB.bw[a]=bw;n++;}
  const z=zonesFrom2k((t.v.run2k||{}).val);
  if(z){DB.zones[a]=z;n++;}
  const pu=parseInt((t.v.pullup||{}).reps,10);
  if(!isNaN(pu)){
    DB.pullStage=DB.pullStage||{};
    DB.pullStage[a]=pu>=5?5:pu>=1?4:pu===0?2:DB.pullStage[a];
    n++;
  }
  t.applied=todayISO();
  save();
  toast(n+" Werte übernommen");
  rTests();
}

function testText(a){
  const list=testsOf(a);
  if(!list.length)return "";
  const out=["Messungen "+ANAME[a],""];
  list.forEach(t=>{
    out.push(new Date(t.date+"T12:00:00").toLocaleDateString("de-DE")+":");
    TESTS.forEach(x=>{
      const v=t.v[x.id]; if(!v)return;
      if(x.g==="kraft"&&!x.unit&&v.kg&&v.reps)
        out.push("  "+x.t+": "+v.kg+" kg × "+v.reps+" → geschätzt "+testMax(v)+" kg");
      else if(x.id==="run2k"&&v.val)out.push("  2000 m: "+v.val+(v.hr?" · "+v.hr+" bpm":""));
      else if(x.id==="runlong"&&v.val)out.push("  Long Run: "+v.val+" km"+(v.pace?" · "+v.pace+" /km":"")+(v.hr?" · "+v.hr+" bpm":""));
      else if(v.reps)out.push("  "+x.t+": "+v.reps);
      else if(v.kg)out.push("  "+x.t+": "+v.kg+" "+(x.unit||""));
    });
    out.push("");
  });
  return out.join("\n");
}

/* Alle Eintragungen einer Übung an einem Tag entfernen:
   Sätze, Zeiten, Haken, ausgelassene Sätze und die Notiz. Gerätewahl bleibt. */
function clearEx(date,ath,key,keepNote){
  const lg=L(date,ath);
  let n=0;
  Object.keys(lg).forEach(k=>{
    if(k===key+"-eq")return;
    if(!k.startsWith(key+"-"))return;
    if(keepNote&&k===key+"-note")return;
    delete lg[k];n++;
  });
  saveDay(lg);
  return n;
}
function clearExAsk(key,name,inWO){
  const ath=inWO?woAth:me();
  showModal(`<h3>Einträge löschen?</h3>
    <p style="font-size:13.5px;color:var(--mid);line-height:1.7;margin-bottom:14px">
    Alle Sätze, Haken und die Notiz zu <b>${esc(name)}</b> an diesem Tag werden entfernt.
    Die Gerätewahl bleibt bestehen. Das lässt sich nicht rückgängig machen.</p>
    <button class="btn btn-r" onclick="clearExDo('${key}',${inWO?1:0},0)">Alles löschen</button>
    <button class="btn" onclick="clearExDo('${key}',${inWO?1:0},1)">Nur Sätze, Notiz behalten</button>
    <button class="btn" onclick="closeModal()">Abbrechen</button>`);
}
function clearExDo(key,inWO,keepNote){
  const ath=inWO?woAth:me();
  const n=clearEx(selDate,ath,key,!!keepNote);
  closeModal();
  if(inWO)renderWO(); else renderHeute();
  toast(n?"Einträge entfernt":"Nichts einzutragen gewesen");
}

/* ══════════ FORMWERT, SERIE, DUELL, MEILENSTEINE ══════════
   Spielerische Elemente, die auf echten Zahlen beruhen: keine Punkte fürs
   Erscheinen, sondern Planerfüllung, Entwicklung und Erholung. */

/* Gilt ein geplanter Trainingstag als absolviert? */
function dayDone(date,ath){
  const ses=sessionFor(date,ath);
  if(ses.k==="rest"||ses.pre)return null;
  const items=buildSession(ses,ath,true).filter(x=>x.type==="lift"||x.type==="circuit"||x.cardio);
  if(!items.length)return null;
  const lg=LR(date,ath);
  let mit=0;
  items.forEach(it=>{
    const hat=Object.keys(lg).some(k=>k.startsWith(it.key+"-")&&k!==it.key+"-eq"&&lg[k]);
    if(hat)mit++;
  });
  return mit/items.length;
}
/* Serie: wie viele geplante Einheiten in Folge zuletzt absolviert wurden */
function streak(ath){
  let n=0;
  for(let i=1;i<=120;i++){
    const d=new Date(todayISO()+"T12:00:00");d.setDate(d.getDate()-i);
    const q=dayDone(iso(d),ath);
    if(q===null)continue;          // Ruhetag zählt nicht, bricht aber auch nicht
    if(q>=.5)n++; else break;
  }
  // Heute zählt mit, wenn schon etwas eingetragen ist
  const heute=dayDone(todayISO(),ath);
  if(heute!==null&&heute>=.5)n++;
  return n;
}
/* Planerfüllung über einen Zeitraum */
function erfuellung(ath,tage){
  let soll=0,ist=0;
  for(let i=0;i<tage;i++){
    const d=new Date(todayISO()+"T12:00:00");d.setDate(d.getDate()-i);
    if(iso(d)<DB.start)continue;
    const q=dayDone(iso(d),ath);
    if(q===null)continue;
    soll++; if(q>=.5)ist++;
  }
  return {soll,ist,pct:soll?Math.round(ist/soll*100):0};
}
/* Formwert aus vier Bestandteilen, 0 bis 100 */
function formScore(ath){
  const e=erfuellung(ath,28);
  const konstanz=e.pct;                                   // 0–100
  const W=scanWeeks(ath).filter(w=>w.ton>0||w.km>0);
  const l2=W.slice(-2), v2=W.slice(-4,-2);
  const sum=(a,f)=>a.reduce((s,x)=>s+x[f],0);
  const tonTrend=(v2.length&&sum(v2,"ton"))
    ? Math.max(0,Math.min(100,50+(sum(l2,"ton")/sum(v2,"ton")-1)*250)) : 50;
  const kmTrend=(v2.length&&sum(v2,"km"))
    ? Math.max(0,Math.min(100,50+(sum(l2,"km")/sum(v2,"km")-1)*250)) : 50;
  const ck=DB.checkins[ath]||{};
  const keys=Object.keys(ck).sort().slice(-14).filter(k=>ck[k]&&(ck[k].sleep||ck[k].energy));
  let erholung=60;
  if(keys.length){
    const avg=f=>{const v=keys.map(k=>+ck[k][f]).filter(x=>x>0);
      return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;};
    const sl=avg("sleep"), en=avg("energy"), so=avg("sore");
    const teile=[sl?sl/5*100:null,en?en/5*100:null,so?(6-so)/5*100:null].filter(x=>x!==null);
    if(teile.length)erholung=teile.reduce((a,b)=>a+b,0)/teile.length;
  }
  const score=Math.round(konstanz*.40+tonTrend*.25+kmTrend*.20+erholung*.15);
  return {score:Math.max(0,Math.min(100,score)),konstanz,tonTrend:Math.round(tonTrend),
    kmTrend:Math.round(kmTrend),erholung:Math.round(erholung),e};
}
const FORMTXT=s=>
  s>=85?["In Form","Die Zahlen stimmen auf allen Ebenen. Genau jetzt lohnt es sich, schwer zu arbeiten."]
 :s>=70?["Auf Kurs","Solide Basis. Ein bis zwei Stellschrauben, dann geht noch mehr."]
 :s>=55?["Im Aufbau","Es läuft, aber noch nicht rund. Konstanz ist der größte Hebel."]
 :s>=40?["Wackelig","Entweder fehlen Einheiten oder die Erholung trägt nicht. Erst das klären, dann steigern."]
 :["Unter Form","Zu wenig Substanz in den letzten Wochen. Klein anfangen, dafür jeden geplanten Tag."];

/* Wochenduell: wer hat mehr vom eigenen Plan umgesetzt */
function weekDuel(){
  const mo=new Date(todayISO()+"T12:00:00");
  mo.setDate(mo.getDate()-((mo.getDay()+6)%7));
  const res={};
  ATH.forEach(a=>{
    let soll=0,ist=0,ton=0,km=0;
    for(let i=0;i<7;i++){
      const d=new Date(mo);d.setDate(d.getDate()+i);
      const ds=iso(d);
      if(ds>todayISO()||ds<DB.start)continue;
      const q=dayDone(ds,a);
      if(q!==null){soll++;if(q>=.5)ist++;}
      const ses=sessionFor(ds,a), lg=LR(ds,a);
      if(ses.k==="rest")continue;
      buildSession(ses,a,true).forEach(it=>{
        for(let s=1;s<=(it.sets||0)+2;s++){
          if(lg[`${it.key}-x${s}`])continue;
          const w=parseFloat(lg[`${it.key}-w${s}`]),r=parseInt(lg[`${it.key}-r${s}`],10);
          if(!isNaN(w)&&!isNaN(r))ton+=w*r;
        }
        if(it.cardio){const d2=parseFloat(lg[`${it.key}-c-dist`]);if(!isNaN(d2))km+=d2;}
      });
    }
    res[a]={soll,ist,pct:soll?Math.round(ist/soll*100):0,ton:Math.round(ton),km:Math.round(km*10)/10,
      rel:Math.round(ton/(DB.bw[a]||70))};
  });
  // Zusätzlich der Vergleich mit der eigenen Vorwoche – das ist der Maßstab,
  // der für beide gleich viel bedeutet.
  ATH.forEach(a=>{
    const W=scanWeeks(a).filter(w=>w.ton>0||w.km>0);
    const vor=W[W.length-2];
    res[a].vorTon=vor?Math.round(vor.ton/(DB.bw[a]||70)):0;
    res[a].relTon=Math.round(res[a].ton/(DB.bw[a]||70));
    res[a].delta=res[a].vorTon?Math.round((res[a].relTon/res[a].vorTon-1)*100):null;
  });
  res.team={ist:res.yuan.ist+res.yara.ist,soll:res.yuan.soll+res.yara.soll};
  res.team.pct=res.team.soll?Math.round(res.team.ist/res.team.soll*100):0;
  const diff=res.yuan.pct-res.yara.pct;
  res.fuehrt=Math.abs(diff)<1?null:(diff>0?"yuan":"yara");
  res.von=iso(mo);
  return res;
}

/* Meilensteine mit echten Schwellen */
/* Alle Schwellen sind entweder zählbar oder auf das eigene Körpergewicht
   bezogen. Absolute Kilogramm wären unfair – ein schwererer Körper bewegt
   bei gleichem Einsatz automatisch mehr. */
const MILES=[
 {id:"units",n:"Einheiten",e:"absolvierte Trainingseinheiten",stufen:[25,50,100,250,500]},
 {id:"saetze",n:"Absolvierte Sätze",e:"jeder eingetragene Arbeitssatz zählt",
  stufen:[250,500,1000,2500,5000]},
 {id:"km",n:"Laufkilometer",e:"gelaufene Kilometer insgesamt",stufen:[50,100,250,500,1000],unit:" km"},
 {id:"streak",n:"Längste Serie",e:"Einheiten ohne Auslassen in Folge",stufen:[5,10,20,40,80]}
];
function mileStats(ath){
  const W=scanWeeks(ath);
  const ton=W.reduce((s,x)=>s+x.ton,0);
  const km=W.reduce((s,x)=>s+x.km,0);
  let units=0;
  Object.keys(DB.log||{}).forEach(d=>{
    if(!(DB.log[d]||{})[ath])return;
    const q=dayDone(d,ath);
    if(q!==null&&q>=.5)units++;
  });
  const best=Math.max(streak(ath),(DB.bestStreak||{})[ath]||0);
  DB.bestStreak=DB.bestStreak||{};
  if(best>((DB.bestStreak[ath])||0)){DB.bestStreak[ath]=best;save(true);}
  // Sätze statt Kilogramm: misst den Einsatz unabhängig von Last und Körperbau
  let saetze=0;
  Object.keys(DB.log||{}).forEach(d=>{
    const lg=(DB.log[d]||{})[ath]; if(!lg)return;
    Object.keys(lg).forEach(k=>{
      const m=k.match(/-w(\d+)$/)||k.match(/-t(\d+)$/);
      if(m&&lg[k]&&!lg[k.replace(/-[wt](\d+)$/,"-x$1")])saetze++;
    });
  });
  return {units,ton:Math.round(ton),tonRel:Math.round(ton/(DB.bw[ath]||70)),saetze,
    km:Math.round(km*10)/10,streak:best};
}
function mileState(v,stufen){
  let erreicht=0;
  stufen.forEach(s=>{if(v>=s)erreicht++;});
  const naechste=stufen[erreicht];
  const vorige=erreicht?stufen[erreicht-1]:0;
  return {erreicht,naechste,
    pct:naechste?Math.round((v-vorige)/(naechste-vorige)*100):100};
}

/* ══════════ BESTLEISTUNGEN ══════════
   Erkennt neue persönliche Bestleistungen anhand des geschätzten Maximums
   aus Gewicht und Wiederholungen. Der Partner bekommt eine Meldung und kann
   gratulieren – die Gratulation erscheint wiederum beim Urheber. */
const prs=()=>DB.prs||(DB.prs=[]);
function bestOf(ath,ex){
  return ((DB.best||{})[ath]||{})[ex]||null;
}
/* Prüft alle Sätze einer Übung und meldet eine neue Bestleistung */
function prCheck(ath,it,lg,date){
  if(!it||!it.ex||it.unit)return null;
  if(isErg(lg[it.key+"-eq"]))return null;
  let bestE=0,bKg=0,bRep=0;
  for(let s=1;s<=(it.sets||0)+2;s++){
    if(lg[`${it.key}-x${s}`])continue;
    const w=parseFloat(lg[`${it.key}-w${s}`]), r=parseInt(lg[`${it.key}-r${s}`],10);
    if(isNaN(w)||isNaN(r)||w<=0||r<=0||r>15)continue;
    const e=e1rm(w,r);
    if(e>bestE){bestE=e;bKg=w;bRep=r;}
  }
  if(!bestE)return null;
  const prev=bestOf(ath,it.ex);
  DB.best=DB.best||{};DB.best[ath]=DB.best[ath]||{};
  if(prev&&bestE<=prev.e1rm+0.4){
    return null;                               // kein Fortschritt
  }
  DB.best[ath][it.ex]={e1rm:Math.round(bestE*10)/10,kg:bKg,reps:bRep,date};
  // Die allererste Eintragung ist noch keine Bestleistung
  if(!prev){save(true);return null;}
  const pr={id:"p"+Date.now()+Math.random().toString(36).slice(2,5),
    ath,ex:it.ex,name:it.name,kg:bKg,reps:bRep,
    e1rm:Math.round(bestE*10)/10,prev:prev.e1rm,at:Date.now(),date,cheers:[]};
  prs().push(pr);
  save();
  return pr;
}
function prCelebrate(pr){
  const plus=Math.round((pr.e1rm-pr.prev)*10)/10;
  showModal(`<h3>Neue Bestleistung</h3>
    <div style="text-align:center;padding:10px 0 16px">
      <div style="font-size:40px;line-height:1">🔥</div>
      <div style="font-size:19px;font-weight:700;margin-top:8px">${esc(pr.name)}</div>
      <div style="font-size:15px;color:var(--me);margin-top:4px">${pr.kg} kg × ${pr.reps}</div>
      <div style="font-size:12.5px;color:var(--mid);margin-top:8px;line-height:1.6">
      Geschätztes Maximum ${pr.e1rm} kg – ${plus} kg über deinem bisherigen Bestwert.</div>
    </div>
    <button class="btn btn-go" onclick="closeModal()">Weiter</button>`);
  if(navigator.vibrate)navigator.vibrate([90,60,90,60,160]);
  say("Bestleistung");
}
/* Offene Meldungen für den gerade aktiven Athleten */
function prPending(){
  const a=me();

/* ══════════ UPDATE ÜBER GITHUB ══════════
   Die App liegt als einzelne Datei im Repository und wird über GitHub Pages
   ausgeliefert. Beim Prüfen holt sie die Rohdatei, liest deren Fassungsnummer
   und vergleicht sie mit der eigenen. Ist eine neuere da, lädt ein Knopf die
   Seite mit angehängter Fassungsnummer neu – damit umgeht sie den Zwischenspeicher. */
const GH_DEF={user:"yuanchensbg",repo:"Hybrid",branch:"main",file:"index.html"};
/* Falls die Datei im Repository anders heißt, werden diese Namen mitprobiert */
const GH_ALT=["index.html","hybrid.html","Hybrid.html","tandem-training.html"];
const gh=()=>Object.assign({},GH_DEF,DB.gh||{});
const ghRaw=()=>{const g=gh();
  return g.user&&g.repo?`https://raw.githubusercontent.com/${g.user}/${g.repo}/${g.branch}/${g.file}`:"";};
let updState={status:"idle",nr:null,datum:null,fehler:""};

async function checkUpdate(silent){
  const url=ghRaw();
  if(!url){updState={status:"nocfg"};if(!silent)rUpdate();return;}
  updState={status:"pruefe"};
  if(!silent&&mehrView==="update")rUpdate();
  try{
    const g=gh();
    const basis=`https://raw.githubusercontent.com/${g.user}/${g.repo}/${g.branch}/`;
    // Zuerst den eingetragenen Dateinamen, dann die üblichen Alternativen
    const namen=[g.file,...GH_ALT.filter(n=>n!==g.file)];
    let txt=null,genutzt=null,letzter="";
    for(const n of namen){
      try{
        const rr=await fetch(basis+n+"?t="+Date.now(),{cache:"no-store"});
        if(rr.ok){txt=await rr.text();genutzt=n;break;}
        letzter="HTTP "+rr.status;
      }catch(e){letzter=e.message||"Abruf fehlgeschlagen";}
    }
    if(txt===null)throw new Error(letzter||"Datei nicht gefunden");
    if(genutzt!==g.file){DB.gh=Object.assign({},g,{file:genutzt});save(true);}
    const m=txt.match(/const BUILD=\{datum:"([^"]+)",nr:(\d+)\}/);
    if(!m)throw new Error("Keine Fassungsnummer gefunden");
    const nr=+m[2];
    updState={status:nr>BUILD.nr?"neu":"aktuell",nr,datum:m[1]};
    DB.ghLast={at:Date.now(),nr,datum:m[1]};save(true);
    if(nr>BUILD.nr){
      if(page==="heute")renderHeute();
      if(silent&&!updGezeigt){updGezeigt=true;updBanner();}
    }
  }catch(e){
    updState={status:"fehler",fehler:e.message||"Abruf fehlgeschlagen"};
  }
  if(!silent||mehrView==="update")rUpdate();
}
/* Der Service Worker liefert die gespeicherte Fassung aus. Dadurch bleibt die
   Datei auf Netlify unangetastet und Updates kommen trotzdem aus GitHub. */
let swReg=null;
let offlineBereit=false;
async function swInit(){
  if(!("serviceWorker" in navigator))return;
  try{
    swReg=await navigator.serviceWorker.register("sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;
    navigator.serviceWorker.addEventListener("message",ev=>{

}
function swStatus(){
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)

}

async function doUpdate(){
  const url=ghRaw();
  if(!url){toast("Kein Repository eingetragen");return;}
  toast("Wird geladen …");
  try{
    const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const html=await r.text();
    if(!/const BUILD=\{/.test(html))throw new Error("Datei sieht nicht nach der App aus");
    if(!navigator.serviceWorker||!navigator.serviceWorker.controller){
      // Ohne Service Worker bleibt nur das Neuladen mit Fassungsnummer
      location.replace(location.origin+location.pathname+"?v="+(updState.nr||Date.now()));
      return;
    }
    await new Promise((res,rej)=>{
      const kanal=ev=>{
        const d=ev.data||{};
        if(d.typ==="updated"){navigator.serviceWorker.removeEventListener("message",kanal);res();}
        if(d.typ==="fehler"){navigator.serviceWorker.removeEventListener("message",kanal);rej(new Error(d.text));}
      };
      navigator.serviceWorker.addEventListener("message",kanal);
      navigator.serviceWorker.controller.postMessage({typ:"update",html});
      setTimeout(()=>rej(new Error("Zeitüberschreitung")),12000);
    });
    DB.ghLast={at:Date.now(),nr:updState.nr,datum:updState.datum};save(true);
    location.reload();
  }catch(e){
    toast("Update fehlgeschlagen: "+(e.message||""));
    updState={status:"fehler",fehler:e.message||"Abruf fehlgeschlagen"};
    if(mehrView==="update")rUpdate();
  }
}
/* Zurück auf die Fassung, die auf Netlify liegt */
async function updReset(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller){
    location.replace(location.origin+location.pathname+"?v=0");return;
  }
  navigator.serviceWorker.controller.postMessage({typ:"reset"});
  setTimeout(()=>location.reload(),600);
}

function swapLabel(k){
  if(k.startsWith("n:")){
    const p=k.slice(2).split("|");
    return {ein:p[0],ath:p[1],pos:"Position "+(parseInt(p[2].replace(/\D/g,""),10)+1)};
  }
  const p=k.split("-");
  const s=SLOTS[+p[0]];
  return {ein:s?s.n:"Zyklus "+p[0],ath:p[1],pos:p[2]==="L0"||p[2]==="L1"?"Hauptblock":"Zusatz"};
}
