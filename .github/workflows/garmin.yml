# Holt den letzten Lauf über die Garmin Personal API und legt ihn als
# garmin/latest.json ab. Kein Passwort nötig – nur der Personal-API-Schlüssel.
name: Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Letzten Lauf holen
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python scripts/garmin_pull.py

      - name: Ergebnis ins Repository legen
        run: |
          git config user.name "Garmin Bot"
          git config user.email "bot@users.noreply.github.com"
          git add garmin/latest.json
          git diff --staged --quiet || git commit -m "Garmin: letzter Lauf"
          git push
